// ========== DATA ==========
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const CY=2026;
const NOW_M=new Date().getMonth();
const NOW_Y=new Date().getFullYear();
function isPastMonth(){ return (S.year<NOW_Y)||(S.year===NOW_Y&&S.month<NOW_M); }
// القفل المشترك: يفتحه المدير فيراه الموظفون على أجهزتهم، ويُقفل تلقائياً بعد 10 دقائق.
var UNLOCK_MS=10*60*1000;
function unlockActive(){
  var u=S.unlock;
  if(!u||!u.key)return false;
  if(u.key!==getMonthKey(S.year,S.month))return false;
  return (Date.now()-Number(u.at||0))<UNLOCK_MS;
}
function unlockLeftMin(){
  var u=S.unlock; if(!u||!u.at)return 0;
  return Math.max(0,Math.ceil((UNLOCK_MS-(Date.now()-Number(u.at)))/60000));
}
function loadUnlock(){
  try{
    import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js").then(function(m){
      return m.getDocFromServer(doc(db,"config","unlock")).catch(function(){return getDoc(doc(db,"config","unlock"));});
    }).then(function(snap){
      if(snap&&snap.exists()){ S.unlock=snap.data()||{key:null,at:0}; R(); }
    }).catch(function(){});
  }catch(e){}
}
function saveUnlock(key){
  S.unlock={key:key,at:key?Date.now():0,by:S.user};
  try{ setDoc(doc(db,"config","unlock"),S.unlock,{merge:false}); }catch(e){}
  R();
}
function canEdit(){
  if(!S.user)return false;
  // صلاحية المستخدم الحالي تُقرأ أولاً — "كل الشهور (بالاعتماد)" تتجاوز قفل الأشهر
  // المنتهية، لأن تعديلات الموظف تمر بموافقة المدير أصلاً.
  const perms=(S.permissions&&S.permissions[S.user])||null;
  if(perms&&perms.allMonths&&USERS[S.user].role!=="owner")return true;
  if(USERS[S.user]?.role==="owner"){
    // الأشهر المنتهية مقفلة على المدير أيضاً — تُفتح بتأكيد صريح لهذا الشهر فقط
    if(isPastMonth() && !unlockActive())return false;
    return true;
  }
  // الأشهر المنتهية مقفلة على الموظف — إلا إذا فتحها المدير (قفل مشترك مؤقت)
  if(isPastMonth())return unlockActive();
  if(hasCapability("monthWindow")){
    const cur=new Date(NOW_Y,NOW_M,1);
    const sel=new Date(S.year,S.month,1);
    const diffMs=sel-cur;
    const diffMonths=Math.round(diffMs/(1000*60*60*24*30));
    const windowSize=Math.max(0,Number(USERS[S.user]?.capabilities?.monthWindow)||0);
    return diffMonths>=-windowSize && diffMonths<=windowSize;
  }
  return S.month===NOW_M && S.year===NOW_Y;
}

async function savePermissions(){
  try{
    await setDoc(doc(db,"config","permissions"),{data:S.permissions,updatedAt:serverTimestamp()},{merge:true});

  }catch(e){ console.error(e); showMsg("⚠ لم تُحفظ الصلاحيات"); return false; }
}

// ===== REQUEST SYSTEM =====
async function submitRequest(type, desc, payload){
  if(!S.user)return false;
  // استخراج المبلغ المالي من الطلب (إن وجد)
  const _reqAmt=Number(payload?.expense?.amount ?? payload?.transaction?.amount ?? payload?.maintenance?.amount ?? payload?.booking?.total ?? NaN);
  // (11) فحص صلاحية المبلغ
  if(!isNaN(_reqAmt)){
    if(_reqAmt<=0){showMsg("⚠ المبلغ غير صالح — يجب أن يكون أكبر من صفر");return false;}
    if(_reqAmt>=50000){
      const _bigKey=type+"|"+_reqAmt;
      if(S.confirmBig!==_bigKey){
        S.confirmBig=_bigKey;
        showMsg("⚠ المبلغ كبير ("+_reqAmt.toLocaleString()+" د.إ) — اضغط الإرسال مرة أخرى للتأكيد");
        return false;
      }
      S.confirmBig=null;
    }
  }
  // Prevent duplicate pending requests for same item
  const dupe=S.pendingRequests.find(r=>r.status==="pending"&&r.by===S.user&&r.type===type&&
    ((type==="update_partition"&&r.payload?.partId===payload?.partId&&r.payload?.unitId===payload?.unitId)||
     (type==="update_full"&&r.payload?.unitId===payload?.unitId)));
  if(dupe){showMsg("⏳ لديك طلب معلق على نفس العنصر بالفعل");return false;}
  // (2) كشف الطلبات المالية المتطابقة المعلقة (نفس النوع والمبلغ والوصف)
  if(!isNaN(_reqAmt)){
    const dupeFin=S.pendingRequests.find(r=>r.status==="pending"&&r.type===type&&r.desc===desc&&
      Number(r.payload?.expense?.amount ?? r.payload?.transaction?.amount ?? r.payload?.maintenance?.amount ?? r.payload?.booking?.total ?? NaN)===_reqAmt);
    if(dupeFin){
      const _dupKey="dup|"+type+"|"+_reqAmt+"|"+desc;
      if(S.confirmDup!==_dupKey){
        S.confirmDup=_dupKey;
        showMsg("⚠ يوجد طلب مطابق معلّق بالفعل ("+_reqAmt.toLocaleString()+" د.إ) — اضغط مرة أخرى إذا كان طلباً منفصلاً فعلاً");
        return false;
      }
      S.confirmDup=null;
    }
  }
  const lockKey=type+"|"+desc;
  S.requestLocks=S.requestLocks||{};
  if(S.requestLocks[lockKey]){showMsg("⏳ جاري إرسال الطلب...");return false;}
  S.requestLocks[lockKey]=true;
  const req={
    id:"req_"+Date.now()+"_"+(crypto.randomUUID?crypto.randomUUID().slice(0,8):Math.random().toString(36).slice(2,10)),
    type, desc, payload,
    by:S.user,
    byName:USERS[S.user].name,
    month:S.month, year:S.year,
    status:"pending",
    createdAt:new Date().toISOString()
  };
  // Save to Firebase
  let saved=false;
  try{
    await setDoc(doc(db,"requests",req.id),req);
    saved=true;
    showMsg("✓ تم إرسال الطلب لاعتماد المدير");
  }catch(e){
    // إظهار السبب الفعلي بدل رسالة عامة — يوفّر تشخيصاً بلا فتح Console
    console.error("submitRequest",e);
    const c=String(e&&e.code||e&&e.message||"");
    let t="⚠ تعذر إرسال الطلب";
    if(c.includes("permission-denied")) t="⛔ القواعد رفضت الطلب — تحقق أن users/"+(S.uid||"")+" فيه role:\"employee\" و userKey:\""+S.user+"\"";
    else if(c.includes("unauthenticated")) t="⛔ انتهت الجلسة — سجّل خروجاً ثم دخولاً";
    else if(c.includes("unavailable")||c.includes("network")) t="⚠ لا اتصال — حاول مجدداً";
    else if(c) t="⚠ تعذر إرسال الطلب — "+c.slice(0,60);
    showMsg(t);
  }finally{
    delete S.requestLocks[lockKey];
  }
  await loadRequests();
  return saved;
}

async function loadRequests(){
  try{
    const {getDocs,collection,query,orderBy}=await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
    const q=query(collection(db,"requests"),orderBy("createdAt","desc"));
    const snap=await getDocs(q);
    S.pendingRequests=snap.docs.map(d=>d.data());
    S.notifCount=S.pendingRequests.filter(r=>r.status==="pending").length;
    R();
  }catch(e){console.error(e);}
}

async function approveRequest(req){
  if(S.approving){showMsg("⏳ جاري الاعتماد...");return;}
  if((req.year!==NOW_Y||req.month!==NOW_M)&&S.confirmOldReq!==req.id){
    S.confirmOldReq=req.id;
    showMsg("⚠ هذا الطلب يخص شهر "+(req.month+1)+"/"+req.year+" وليس الشهر الحالي — اضغط اعتماد مرة أخرى للتأكيد");
    return;
  }
  S.confirmOldReq=null;
  S.approving=true;
  const monthKey=getMonthKey(req.year,req.month);
  const srcSel=((S.approveSrc||{})[req.id])==="company"?"company":"revenue";
  let okMsg="✓ تم اعتماد الطلب", failMsg=null;
  try{
    // ===== عملية ذرّية واحدة: حالة الطلب + بيانات الشهر + الأرصدة =====
    // كل القراءات قبل كل الكتابات (شرط Firestore). أي فشل = لا يتغير شيء إطلاقاً.
    await runTransaction(db, async (tx)=>{
      const reqRef=doc(db,"requests",req.id);
      const monRef=doc(db,"months",monthKey);
      const balRef=doc(db,"config","balances");

      const reqSnap=await tx.get(reqRef);
      if(!reqSnap.exists())            throw new Error("REQ_MISSING");
      const reqCur=reqSnap.data()||{};
      if(reqCur.status!=="pending")    throw new Error("ALREADY_PROCESSED");
      // ===== من هنا: بيانات الخادم فقط. لا ثقة بكائن الواجهة =====
      const R_TYPE = reqCur.type;
      const R_PAY  = reqCur.payload || {};
      const R_YEAR = Number(reqCur.year);
      const R_MON  = Number(reqCur.month);
      const R_BY   = reqCur.by;
      if(R_YEAR!==Number(req.year)||R_MON!==Number(req.month)) throw new Error("MONTH_MISMATCH");
      if(R_TYPE!==req.type) throw new Error("TYPE_MISMATCH");
      const openBal={company:0,revenue:0};
      const ledMoves=[];
      let _bpForBooking=null, _bpDataForBooking=null;

      const monSnap=await tx.get(monRef);
      const monRaw = monSnap.exists() ? monSnap.data() : null;
      const monRev = monRaw ? (Number(monRaw._rev)||0) : 0;
      if(!monRaw) throw new Error("MONTH_MISSING");
      let data = normalizeData(monRaw.data||monRaw);
      try{ if(typeof mergeCustomUnits==="function") mergeCustomUnits(data,R_YEAR,R_MON); }catch(e){}

      const balSnap=await tx.get(balRef);
      const bal = balancesFromServer(balSnap);
      let company=bal.company;
      let revenue=bal.revenue;
      openBal.company=company; openBal.revenue=revenue;
      const instBal=bal.installment;
      const instSch=bal.schedule;

      // ---- تحقق صارم من المبلغ قبل أي خصم ----
      const amtOf=(v)=>{ const n=Number(v); if(!isFinite(n)||isNaN(n)) throw new Error("BAD_AMOUNT"); if(n<=0) throw new Error("BAD_AMOUNT"); return Math.round(n*100)/100; };
      const deduct=(src,amount)=>{
        const cur = src==="company" ? company : revenue;
        if(amount>cur) throw new Error("INSUFFICIENT|"+src+"|"+cur+"|"+amount);
        if(src==="company") company=Math.round((company-amount)*100)/100;
        else                revenue=Math.round((revenue-amount)*100)/100;
        ledMoves.push({account:src,direction:"debit",amount});
      };

      let paidFrom=null;
      // فحص التعارض: هل تغيّرت القيم على السيرفر بعد إنشاء الطلب؟
      const assertNoConflict=(target)=>{
        const of=R_PAY.originalFields;
        if(!of) return; // طلبات قديمة بلا قيم سابقة — تُطبَّق كما كانت (توافق رجعي)
        const bv=Number(R_PAY.baseVersion);
        if(isFinite(bv) && Number(target.version||0)!==bv) throw new Error("VERSION_CONFLICT");
        const changed=[];
        Object.keys(of).forEach(k=>{
          const now=(target[k]===undefined||target[k]===null)?"":target[k];
          const was=(of[k]===undefined||of[k]===null)?"":of[k];
          if(String(now)!==String(was)) changed.push(k);
        });
        if(changed.length) throw new Error("CONFLICT|"+changed.join(","));
      };
      if(R_TYPE==="update_partition"){
        const unit=data.units.find(u=>u.id===R_PAY.unitId);
        if(unit){ const p=unit.partitions.find(p=>p.id===R_PAY.partId);
          if(p){ assertNoConflict(p); Object.assign(p,R_PAY.fields); p.version=(Number(p.version)||0)+1; } }
      } else if(R_TYPE==="update_full"){
        const u=data.full.find(u=>u.id===R_PAY.unitId);
        if(u){ assertNoConflict(u); Object.assign(u,R_PAY.fields); u.version=(Number(u.version)||0)+1; }
      } else if(R_TYPE==="add_expense"){
        const a=amtOf(R_PAY.expense.amount);
        deduct(srcSel,a); paidFrom=srcSel;
        data.expenses.push({...R_PAY.expense,amount:a,paidFrom:srcSel,approvedBy:S.user, approvedByUid:S.uid||null,approvedAt:new Date().toISOString(),requestId:req.id});
      } else if(R_TYPE==="add_transaction"){
        const a=amtOf(R_PAY.transaction.amount);
        // idempotency: نفس الطلب لا يُضاف مرتين حتى لو أُعيدت المحاولة
        if(!(data.transactions||[]).some(t=>t.requestId===req.id)){
          data.transactions.push({...R_PAY.transaction,amount:a,requestId:req.id,approvedBy:S.user, approvedByUid:S.uid||null,approvedAt:new Date().toISOString()});
          revenue=Math.round((revenue+a)*100)/100;
          ledMoves.push({account:"revenue",direction:"credit",amount:a});
        }
      } else if(R_TYPE==="add_unit_maintenance"){
        const a=amtOf(R_PAY.maintenance.amount);
        deduct(srcSel,a); paidFrom=srcSel;
        if(!data.unitMaintenance)data.unitMaintenance=[];
        data.unitMaintenance.push({...R_PAY.maintenance,amount:a,id:req.id,paidFrom:srcSel,requestId:req.id});
      } else if(R_TYPE==="add_facility_maintenance"){
        const a=amtOf(R_PAY.maintenance.amount);
        deduct(srcSel,a); paidFrom=srcSel;
        if(!data.facilityMaintenance)data.facilityMaintenance=[];
        data.facilityMaintenance.push({...R_PAY.maintenance,amount:a,id:req.id,paidFrom:srcSel,requestId:req.id});
      } else if(R_TYPE==="add_unit"){
        data.units.push(R_PAY.unit);
      } else if(R_TYPE==="add_full_unit"){
        data.full.push(R_PAY.unit);
      } else if(R_TYPE==="add_partition"){
        const unit=data.units.find(u=>String(u.id)===String(R_PAY.unitId));
        if(!unit) throw new Error("UNIT_MISSING");
        if((unit.partitions||[]).some(p=>String(p.id)===String(R_PAY.part?.id))) throw new Error("TARGET_CHANGED");
        unit.partitions.push({...R_PAY.part,createdByRequest:req.id});
      } else if(R_TYPE==="transfer_tenant"){
        const su=data.units.find(u=>String(u.id)===String(R_PAY.sourceUnitId));
        const tu=data.units.find(u=>String(u.id)===String(R_PAY.targetUnitId));
        const sp=su&&(su.partitions||[]).find(p=>String(p.id)===String(R_PAY.sourcePartId));
        const tp=tu&&(tu.partitions||[]).find(p=>String(p.id)===String(R_PAY.targetPartId));
        if(!sp||!tp) throw new Error("UNIT_MISSING");
        if(!sameSnapshot(sp,R_PAY.sourceOriginal)||!sameSnapshot(tp,R_PAY.targetOriginal)) throw new Error("TARGET_CHANGED");
        if(displayStatus(tp)!=="vacant") throw new Error("TARGET_OCCUPIED");
        (R_PAY.moveFields||[]).forEach(f=>{tp[f]=sp[f];});
        (R_PAY.moveFields||[]).forEach(f=>{if(f!=="status")sp[f]=(f==="paid_amount"||f==="deposit"||f==="elec_amount")?0:(f==="partial"||f==="elec_paid")?false:"";});
        sp.status="vacant"; sp.version=(Number(sp.version)||0)+1; tp.version=(Number(tp.version)||0)+1;
      } else if(R_TYPE==="add_handover"){
        const h=R_PAY.handover||{};const a=amtOf(h.amount);
        if(h.from!==R_BY||!h.to||h.to===h.from)throw new Error("BAD_HANDOVER");
        data.handovers=data.handovers||[];
        if(!data.handovers.some(x=>String(x.id)===String(h.id)))data.handovers.push({...h,amount:a,status:"pending",requestId:req.id});
      } else if(R_TYPE==="confirm_handover"||R_TYPE==="reject_handover"){
        const h=(data.handovers||[]).find(x=>String(x.id)===String(R_PAY.handoverId));
        if(!h||h.status!=="pending"||h.to!==R_BY)throw new Error("BAD_HANDOVER");
        if(R_TYPE==="confirm_handover"){h.status="confirmed";h.confirmedAt=new Date().toISOString();h.confirmedBy=R_BY;h.confirmRequestId=req.id;}
        else {h.status="rejected";h.rejectedAt=new Date().toISOString();h.rejectedBy=R_BY;h.rejectRequestId=req.id;}
      } else if(R_TYPE==="delete_partition"){
        const unit=data.units.find(u=>u.id===R_PAY.unitId);
        if(unit){ const pi=unit.partitions.findIndex(p=>p.id===R_PAY.partId); if(pi<0)throw new Error("UNIT_MISSING");
          if(R_PAY.original&&!sameSnapshot(unit.partitions[pi],R_PAY.original))throw new Error("TARGET_CHANGED"); unit.partitions.splice(pi,1); }
      } else if(R_TYPE==="delete_full"){
        const fi=data.full.findIndex(u=>u.id===R_PAY.unitId);
        if(fi<0)throw new Error("UNIT_MISSING");
        if(R_PAY.original&&!sameSnapshot(data.full[fi],R_PAY.original))throw new Error("TARGET_CHANGED"); data.full.splice(fi,1);
      } else if(R_TYPE==="add_daily"){
        if(!data.dailyBookings)data.dailyBookings=[];
        if(!data.dailyBookings.some(b=>b.id===req.id)){
          const bk={...R_PAY.booking,id:req.id,requestId:req.id};
          // الحجز البنكي المرسل كطلب: مستند الدفعة يُنشأ في نفس المعاملة
          if(bk.paymentMethod==="bank"){
            _bpForBooking = bankPayId(monthKey, "booking_"+req.id, "booking_"+req.id);
            bk.bankPaymentId=_bpForBooking;
            _bpDataForBooking={
              idempotencyKey:"booking_"+req.id, unitRef:"booking_"+req.id,
              unitLabel:"حجز يومي "+(bk.partLabel||""), tenant:bk.guest||"",
              unitId:"", partId:null, contractCycle:"", monthKey,
              // المبلغ يؤخذ من payload مباشرة ليطابق ما تتحقق منه Rules حرفياً
              amount:R_PAY.booking.total, method:"bank",
              bankReference:bk.bankReference||"", paymentDate:bk.paidAt?String(bk.paidAt).slice(0,10):todayISO(),
              status:"pending", bookingId:String(req.id),
              createdBy:R_BY, createdAt:new Date().toISOString(),
              approvedBy:null, approvedAt:null, cancelledAt:null, cancelReason:null
            };
          }
          // إعادة التحقق داخل المعاملة — فحص الواجهة وحده لا يكفي (قد يكون حجز آخر أُضيف بعده)
          if(!bk.startDate||!bk.endDate||bk.endDate<=bk.startDate) throw new Error("BAD_BOOKING_DATES");
          const _dailyTarget=(()=>{
            const pid=String(bk.partId||"");
            if(pid.startsWith("full-"))return (data.full||[]).find(u=>String(u.id)===pid.slice(5));
            const cut=pid.lastIndexOf("-"); if(cut<1)return null;
            const u=(data.units||[]).find(u=>String(u.id)===pid.slice(0,cut));
            return u&&(u.partitions||[]).find(p=>String(p.id)===pid.slice(cut+1));
          })();
          if(!_dailyTarget)throw new Error("UNIT_MISSING");
          if(rentType(_dailyTarget)!=="daily"&&displayStatus(_dailyTarget)!=="vacant")throw new Error("MONTHLY_OCCUPIED");
          const clash=(data.dailyBookings||[]).find(x=>
            String(x.partId)===String(bk.partId) && x.status!=="cancelled" && x.status!=="refunded" &&
            x.startDate<bk.endDate && bk.startDate<x.endDate);
          if(clash) throw new Error("BOOKING_OVERLAP|"+(clash.guest||"—")+"|"+clash.startDate+"|"+clash.endDate);
          data.dailyBookings.push(bk);
        }
      }

      try{
        const RTL={update_partition:"تعديل بارتشن",update_full:"تعديل شقة",add_transaction:"إيداع",add_expense:"مصروف",add_unit_maintenance:"صيانة شقة",add_facility_maintenance:"صيانة مرافق",add_daily:"حجز يومي",delete_partition:"حذف بارتشن",delete_full:"حذف شقة",add_partition:"إضافة بارتشن",transfer_tenant:"تحويل مستأجر",add_handover:"تسليم عهدة",confirm_handover:"تأكيد استلام عهدة",reject_handover:"رفض استلام عهدة"};
        addLog&&addLog(data,(USERS[S.user]?.name||S.user)+" اعتمد طلب "+(RTL[R_TYPE]||R_TYPE)+" من "+(USERS[R_BY]?.name||R_BY||"موظف"),{target:req.desc||(RTL[R_TYPE]||R_TYPE),field:"اعتماد",oldVal:"معلّق",newVal:"معتمد"});
      }catch(e){}

      // ---- قيود الدفتر (إلزامية) ----
      const _openMap={company:openBal.company,revenue:openBal.revenue};
      const _finalMap={company,revenue};
      const _agg={};
      ledMoves.forEach(mv=>{ _agg[mv.account]=(_agg[mv.account]||0)+(mv.direction==="credit"?mv.amount:-mv.amount); });
      Object.keys(_agg).forEach(acc=>{
        const net=Math.round(_agg[acc]*100)/100;
        if(Math.abs(net)<0.001) return;
        writeLedgerEntry(tx,{
          operationId:"approve_"+req.id, operationType:"approve_request:"+R_TYPE,
          account:acc, direction:net>0?"credit":"debit", amount:Math.abs(net),
          balanceBefore:_openMap[acc], balanceAfter:_finalMap[acc],
          monthKey, sourceCollection:"requests", sourceId:req.id,
          description:(reqCur.desc||R_TYPE)+" — اعتماد",
          idempotencyKey:"approve_"+req.id
        });
      });
      // ---- الكتابات (كلها أو لا شيء) ----
      if(_bpForBooking&&_bpDataForBooking) tx.set(doc(db,"bankPayments",_bpForBooking),_bpDataForBooking,{merge:true});
      tx.set(monRef,{data,_rev:monRev+1,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(balRef,{companyBalance:company,revenueBalance:revenue,
                     ...(isFinite(instBal)?{installmentBalance:instBal}:{}),
                     ...(instSch?{installmentSchedule:instSch}:{}),
                     updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(reqRef,{status:"approved",approvedAt:new Date().toISOString(),approvedBy:S.user, approvedByUid:S.uid||null,
                     ...(paidFrom?{paidFrom}:{})},{merge:true});
      // تُطبَّق على الحالة المحلية فقط بعد نجاح المعاملة
      S._pendingBal={companyBalance:company,revenueBalance:revenue};
    });

    if(S._pendingBal){ S.companyBalance=S._pendingBal.companyBalance; S.revenueBalance=S._pendingBal.revenueBalance; S._pendingBal=null; }
    // العمليات غير المالية التي تمس شهوراً أخرى — بعد نجاح المعاملة فقط
    try{
      if(req.type==="add_unit"){ registerCustomUnit(req.payload.unit,false,req.year,req.month); propagateNewUnit(req.payload.unit,req.year,req.month); }
      else if(req.type==="add_full_unit"){ registerCustomUnit(req.payload.unit,true,req.year,req.month); propagateNewFullUnit(req.payload.unit,req.year,req.month); }
      else if(req.type==="delete_full"){ removeCustomUnit(req.payload.unitId,true,req.year,req.month); propagateRemoveUnit(req.payload.unitId,true,req.year,req.month); }
    }catch(e){}
    memClear(monthKey);
    showMsg(okMsg);
    await loadRequests();
    await loadMonthOnline(req.year,req.month);
    if(req.year!==S.year||req.month!==S.month) await loadMonthOnline(S.year,S.month);
    await loadBalances();
    R();
  }catch(e){
    S._pendingBal=null;
    const m=String(e&&e.message||"");
    if(m==="ALREADY_PROCESSED"){ failMsg="⚠ الطلب تمت معالجته مسبقاً"; }
    else if(m==="REQ_MISSING"){ failMsg="⚠ الطلب غير موجود"; }
    else if(m==="BAD_AMOUNT"){ failMsg="⚠ المبلغ غير صالح — لم يُنفَّذ أي تغيير"; }
    else if(m.startsWith("INSUFFICIENT")){
      const pr=m.split("|"); const nm=pr[1]==="company"?"الشركة":"الإيرادات";
      failMsg="⛔ رصيد "+nm+" غير كافٍ — المتوفر "+Number(pr[2]).toLocaleString()+" د.إ والمطلوب "+Number(pr[3]).toLocaleString()+" د.إ. لم يُنفَّذ أي تغيير.";
    }
    else if(m==="BAD_BOOKING_DATES"){ failMsg="⚠ تواريخ الحجز غير صالحة — لم يُنفَّذ أي تغيير"; }
    else if(m.startsWith("BOOKING_OVERLAP")){
      const p=m.split("|");
      failMsg="⛔ تعارض حجز: البارتشن محجوز لـ"+p[1]+" من "+p[2]+" إلى "+p[3]+" — لم يُنفَّذ أي تغيير.";
    }
    else if(m==="VERSION_CONFLICT"){ failMsg="⚠ تعارض: تغيّرت الوحدة بعد إنشاء الطلب — لم يُنفَّذ أي تغيير. اطلب من الموظف إعادة الإرسال."; }
    else if(m.startsWith("CONFLICT")){
      const f=m.split("|")[1]||"";
      const L={status:"الحالة",rent:"الإيجار",tenant:"المستأجر",paid_amount:"المدفوع",partial:"نوع الدفع",note:"ملاحظة",phone:"الهاتف",deposit:"التأمين",start_date:"بداية",due_date:"استحقاق",contract_end:"نهاية الدورة"};
      const names=f.split(",").map(k=>L[k]||k).join("، ");
      failMsg="⚠ تعارض: تغيّرت هذه الحقول بعد إنشاء الطلب ("+names+") — لم يُنفَّذ أي تغيير حتى لا يُكتب فوق الأحدث.";
    }
    else { failMsg="⚠ فشل الاعتماد — لم يُنفَّذ أي تغيير. حاول مرة أخرى."; console.error(e); }
    showMsg(failMsg);
    // الواجهة ترجع لآخر بيانات مؤكدة من السيرفر
    try{ memClear(monthKey); await loadRequests(); await loadMonthOnline(req.year,req.month); await loadBalances(); }catch(e2){}
    R();
  }
  finally{S.approving=false;}
}

// ===== عكس عملية معتمدة (إلغاء اعتماد / حذف) — ذرّي وبمنع تكرار العكس =====
async function reverseApprovedRequest(req, mode, opts){
  // mode: "revoked" | "deleted"
  if(S.approving){showMsg("⏳ جاري المعالجة...");return;}
  S.approving=true;
  const monthKey=getMonthKey(req.year,req.month);
  try{
    await runTransaction(db, async (tx)=>{
      const reqRef=doc(db,"requests",req.id);
      const monRef=doc(db,"months",monthKey);
      const balRef=doc(db,"config","balances");
      const rs=await tx.get(reqRef);
      if(!rs.exists()) throw new Error("REQ_MISSING");
      const rc=rs.data()||{};
      // منع عكس العملية أكثر من مرة
      if(rc.status!=="approved") throw new Error("NOT_APPROVED|"+(rc.status||"?"));
      // ⛔ العملية المصحّحة: الأصل معكوس أصلاً — العكس هنا يضاعف الأثر
      if(rc.corrected) throw new Error("CORRECTED_REQUEST");
      // بيانات الخادم فقط
      const R_TYPE=rc.type, R_PAY=rc.payload||{};
      const openBal={company:0,revenue:0}; const ledMoves=[];
      const ms=await tx.get(monRef);
      if(!ms.exists()) throw new Error("MONTH_MISSING");
      const msRaw=ms.data();
      const msRev=Number(msRaw._rev)||0;
      const data=normalizeData(msRaw.data||msRaw);
      const bs=await tx.get(balRef);
      const b=balancesFromServer(bs);
      let company=b.company;
      let revenue=b.revenue;
      openBal.company=company; openBal.revenue=revenue;
      // ⛔ لا تخمين: يُبحث في السجل المالي نفسه ثم في الطلب. غير موجود = رفض واختيار صريح.
      const _entryPaidFrom=(()=>{
        if(R_TYPE==="add_expense"){
          const e=(data.expenses||[]).find(x=>x.requestId===req.id||(R_PAY.expense&&x.id===R_PAY.expense.id));
          return e&&e.paidFrom||null;
        }
        if(R_TYPE==="add_unit_maintenance"||R_TYPE==="add_facility_maintenance"){
          const k=R_TYPE==="add_unit_maintenance"?"unitMaintenance":"facilityMaintenance";
          const m=(data[k]||[]).find(x=>x.requestId===req.id||x.id===req.id);
          return m&&m.paidFrom||null;
        }
        return null;
      })();
      const _needsSrc = (R_TYPE==="add_expense"||R_TYPE==="add_unit_maintenance"||R_TYPE==="add_facility_maintenance");
      const paidFrom = _entryPaidFrom || rc.paidFrom || (opts&&opts.paidFrom) || null;
      if(_needsSrc && !paidFrom) throw new Error("PAID_FROM_REQUIRED");

      const _stamp=(rec,acct)=>{
        rec.reversed=true; rec.reversedAt=new Date().toISOString();
        rec.reversedBy=S.user; rec.reversedByUid=S.uid||null;
        rec.reverseReason=(opts&&opts.reason)||(mode==="deleted"?"حذف من المدير":"إلغاء اعتماد");
        rec.reverseOf="approve_"+req.id;
        if(acct) rec.reversedAccount=acct;
      };
      if(R_TYPE==="add_transaction"){
        // ⛔ لا حذف — السجل يبقى موسوماً reversed
        const t0=(data.transactions||[]).find(x=>x.requestId===req.id||(R_PAY.transaction&&x.id===R_PAY.transaction.id));
        if(!t0) throw new Error("ENTRY_MISSING");
        if(t0.reversed) throw new Error("ALREADY_REVERSED");
        const amt=Math.round(Number(t0.amount||0)*100)/100;
        if(amt>revenue) throw new Error("INSUFFICIENT|revenue|"+revenue+"|"+amt);
        revenue=Math.round((revenue-amt)*100)/100;
        ledMoves.push({account:"revenue",direction:"debit",amount:amt});
        _stamp(t0,"revenue");
      } else if(R_TYPE==="add_expense"){
        const e0=(data.expenses||[]).find(x=>x.requestId===req.id||(R_PAY.expense&&x.id===R_PAY.expense.id));
        if(!e0) throw new Error("ENTRY_MISSING");
        if(e0.reversed) throw new Error("ALREADY_REVERSED");
        const src=e0.paidFrom||paidFrom;
        if(!src) throw new Error("PAID_FROM_REQUIRED");
        const amt=Math.round(Number(e0.amount||0)*100)/100;
        if(src==="company") company=Math.round((company+amt)*100)/100;
        else                revenue=Math.round((revenue+amt)*100)/100;
        ledMoves.push({account:src,direction:"credit",amount:amt});
        _stamp(e0,src);
      } else if(R_TYPE==="add_unit_maintenance"||R_TYPE==="add_facility_maintenance"){
        const key=R_TYPE==="add_unit_maintenance"?"unitMaintenance":"facilityMaintenance";
        const m0=(data[key]||[]).find(x=>x.requestId===req.id||x.id===req.id);
        if(!m0) throw new Error("ENTRY_MISSING");
        if(m0.reversed) throw new Error("ALREADY_REVERSED");
        const src=m0.paidFrom||paidFrom;
        if(!src) throw new Error("PAID_FROM_REQUIRED");
        const amt=Math.round(Number(m0.amount||0)*100)/100;
        if(amt>0){
          if(src==="company") company=Math.round((company+amt)*100)/100;
          else                revenue=Math.round((revenue+amt)*100)/100;
          ledMoves.push({account:src,direction:"credit",amount:amt});
        }
        _stamp(m0,src);
      } else if(R_TYPE==="add_daily"){
        const _bk=(data.dailyBookings||[]).find(x=>x.requestId===req.id||x.id===req.id);
        if(_bk && CALC.bookingWasPaid(_bk)) throw new Error("BOOKING_PAID_USE_CANCEL");
        if(_bk){ _bk.reversed=true; _bk.status="cancelled"; _bk.wasPaid=false;
                 _bk.reversedAt=new Date().toISOString(); _bk.reversedBy=S.user;
                 _bk.reverseReason=(opts&&opts.reason)||"إلغاء طلب حجز غير مدفوع"; }
      } else if(R_TYPE==="update_partition"){
        if(!R_PAY.originalFields) throw new Error("NO_ORIGINAL");
        const u=(data.units||[]).find(u=>u.id===R_PAY.unitId);
        if(u){const p=(u.partitions||[]).find(p=>p.id===R_PAY.partId); if(p)Object.assign(p,R_PAY.originalFields);}
      } else if(R_TYPE==="update_full"){
        if(!R_PAY.originalFields) throw new Error("NO_ORIGINAL");
        const u=(data.full||[]).find(u=>u.id===R_PAY.unitId);
        if(u)Object.assign(u,R_PAY.originalFields);
      } else if(R_TYPE==="add_unit"){
        const i=(data.units||[]).findIndex(u=>String(u.id)===String(R_PAY.unit?.id));
        if(i<0)throw new Error("ENTRY_MISSING"); data.units.splice(i,1);
      } else if(R_TYPE==="add_full_unit"){
        const i=(data.full||[]).findIndex(u=>String(u.id)===String(R_PAY.unit?.id));
        if(i<0)throw new Error("ENTRY_MISSING"); data.full.splice(i,1);
      } else if(R_TYPE==="add_partition"){
        const u=(data.units||[]).find(u=>String(u.id)===String(R_PAY.unitId));
        const i=u&&(u.partitions||[]).findIndex(p=>p.createdByRequest===req.id);
        if(!u||i<0) throw new Error("ENTRY_MISSING"); u.partitions.splice(i,1);
      } else if(R_TYPE==="transfer_tenant"){
        const su=(data.units||[]).find(u=>String(u.id)===String(R_PAY.sourceUnitId));
        const tu=(data.units||[]).find(u=>String(u.id)===String(R_PAY.targetUnitId));
        const sp=su&&(su.partitions||[]).find(p=>String(p.id)===String(R_PAY.sourcePartId));
        const tp=tu&&(tu.partitions||[]).find(p=>String(p.id)===String(R_PAY.targetPartId));
        if(!sp||!tp||!R_PAY.sourceOriginal||!R_PAY.targetOriginal) throw new Error("NO_ORIGINAL");
        Object.keys(sp).forEach(k=>delete sp[k]); Object.assign(sp,JSON.parse(JSON.stringify(R_PAY.sourceOriginal)));
        Object.keys(tp).forEach(k=>delete tp[k]); Object.assign(tp,JSON.parse(JSON.stringify(R_PAY.targetOriginal)));
      } else if(R_TYPE==="delete_partition"){
        if(!R_PAY.original) throw new Error("NO_ORIGINAL");
        const u=(data.units||[]).find(u=>String(u.id)===String(R_PAY.unitId)); if(!u)throw new Error("UNIT_MISSING");
        if((u.partitions||[]).some(p=>String(p.id)===String(R_PAY.partId)))throw new Error("TARGET_CHANGED");
        u.partitions.splice(Math.max(0,Math.min(Number(R_PAY.originalIndex)||0,u.partitions.length)),0,JSON.parse(JSON.stringify(R_PAY.original)));
      } else if(R_TYPE==="delete_full"){
        if(!R_PAY.original) throw new Error("NO_ORIGINAL");
        if((data.full||[]).some(u=>String(u.id)===String(R_PAY.unitId)))throw new Error("TARGET_CHANGED");
        data.full.splice(Math.max(0,Math.min(Number(R_PAY.originalIndex)||0,data.full.length)),0,JSON.parse(JSON.stringify(R_PAY.original)));
      } else if(R_TYPE==="add_handover"){
        const h=(data.handovers||[]).find(x=>x.requestId===req.id);if(!h)throw new Error("ENTRY_MISSING");h.status="cancelled";h.reversedAt=new Date().toISOString();h.reversedBy=S.user;
      } else if(R_TYPE==="confirm_handover"||R_TYPE==="reject_handover"){
        const h=(data.handovers||[]).find(x=>String(x.id)===String(R_PAY.handoverId));if(!h)throw new Error("ENTRY_MISSING");
        h.status="pending";delete h.confirmedAt;delete h.confirmedBy;delete h.confirmRequestId;delete h.rejectedAt;delete h.rejectedBy;delete h.rejectRequestId;
      }
      try{ addLog&&addLog(data,(USERS[S.user]?.name||S.user)+(mode==="deleted"?" حذف ":" ألغى اعتماد ")+(req.desc||req.type),
            {target:req.desc||req.type,field:mode==="deleted"?"حذف":"إلغاء اعتماد",oldVal:"معتمد",newVal:mode==="deleted"?"محذوف":"ملغى"}); }catch(e){}
      const _open={company:openBal.company,revenue:openBal.revenue}, _fin={company,revenue}, _agg={};
      ledMoves.forEach(mv=>{_agg[mv.account]=(_agg[mv.account]||0)+(mv.direction==="credit"?mv.amount:-mv.amount);});
      Object.keys(_agg).forEach(acc=>{
        const net=Math.round(_agg[acc]*100)/100;
        if(Math.abs(net)<0.001) return;
        writeLedgerEntry(tx,{
          operationId:"reverse_"+req.id, operationType:"reverse_request:"+R_TYPE,
          account:acc, direction:net>0?"credit":"debit", amount:Math.abs(net),
          balanceBefore:_open[acc], balanceAfter:_fin[acc],
          monthKey, sourceCollection:"requests", sourceId:req.id,
          description:(rc.desc||R_TYPE)+" — "+(mode==="deleted"?"حذف":"إلغاء اعتماد"),
          idempotencyKey:"reverse_"+req.id, reverseOf:"approve_"+req.id
        });
      });
      tx.set(monRef,{data,_rev:msRev+1,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(balRef,{companyBalance:company,revenueBalance:revenue,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(reqRef,{status:mode,[mode==="deleted"?"deletedAt":"revokedAt"]:new Date().toISOString(),reversedBy:S.user, reversedByUid:S.uid||null,reverseOf:req.id},{merge:true});
      S._pendingBal={companyBalance:company,revenueBalance:revenue};
    });
    if(S._pendingBal){S.companyBalance=S._pendingBal.companyBalance;S.revenueBalance=S._pendingBal.revenueBalance;S._pendingBal=null;}
    memClear(monthKey);
    showMsg(mode==="deleted"?"✓ تم الحذف وعكس الأثر المالي":"✓ تم إلغاء الاعتماد وعكس الأثر المالي");
    await loadRequests(); await loadMonthOnline(req.year,req.month);
    if(req.year!==S.year||req.month!==S.month) await loadMonthOnline(S.year,S.month);
    await loadBalances(); R();
  }catch(e){
    S._pendingBal=null;
    const m=String(e&&e.message||"");
    let t="⚠ فشلت العملية — لم يتغير شيء";
    if(m==="CORRECTED_REQUEST") t="⛔ هذه العملية مصحّحة مسبقاً — الأصل معكوس. لإلغاء العملية المصحّحة اعكس السجل الجديد من شاشة الإيداعات/المصاريف.";
    else if(m==="ALREADY_REVERSED") t="⚠ هذا السجل معكوس مسبقاً — لم يتغير شيء";
    else if(m==="PAID_FROM_REQUIRED"){
      S.revNeedSrc=req.id; R();
      t="⚠ هذه العملية قديمة بلا حساب مسجّل — اختر الحساب الأصلي أولاً";
    }
    else if(m==="BOOKING_PAID_USE_CANCEL") t="⛔ هذا حجز مدفوع — لا يُحذف. افتح الحجز في تبويب اليومي واضغط «إلغاء» لتحديد سبب الإلغاء ونوع الاسترداد.";
    else if(m.startsWith("NOT_APPROVED")) t="⚠ العملية غير معتمدة حالياً (تمت معالجتها مسبقاً) — لم يتغير شيء";
    else if(m==="NO_ORIGINAL")      t="⛔ القيم السابقة غير محفوظة لهذا الطلب — لا يمكن الإرجاع بدقة";
    else if(m.startsWith("INSUFFICIENT")){const p=m.split("|");t="⛔ رصيد الإيرادات غير كافٍ لعكس الإيداع — المتوفر "+Number(p[2]).toLocaleString()+" والمطلوب "+Number(p[3]).toLocaleString();}
    else if(m==="MONTH_MISSING")    t="⚠ بيانات الشهر غير موجودة على السيرفر";
    showMsg(t);
    try{await loadRequests();await loadMonthOnline(req.year,req.month);await loadBalances();}catch(e2){}
    R();
  }
  finally{S.approving=false;}
}

// ===== محرّك موحّد للعمليات المالية المباشرة =====
// معاملة ذرّية واحدة: القيد + السجل + الرصيد معاً، أو لا شيء إطلاقاً.
// mutate(ctx) حيث ctx = {data, bal:{company,revenue,installment,schedule}, deduct, add, log}
async function commitMoneyOp(opts){
  const { year, month, mutate, okMsg, needMonth, opType, opId, description, sourceCollection, sourceId, reverseOf } = opts;
  if(S.moneyOp){ showMsg("⏳ جاري التنفيذ..."); return false; }
  S.moneyOp=true;
  const y=(year==null?S.year:year), m=(month==null?S.month:month);
  const monthKey=getMonthKey(y,m);
  const operationId = opId || (opType||"op")+"_"+S.user+"_"+Date.now();
  try{
    let applied=null;
    await runTransaction(db, async (tx)=>{
      const monRef=doc(db,"months",monthKey);
      const balRef=doc(db,"config","balances");
      let data=null, mRev=0;
      if(needMonth!==false){
        const ms=await tx.get(monRef);
        if(!ms.exists()) throw new Error("MONTH_MISSING");
        const raw=ms.data(); mRev=Number(raw._rev)||0;
        data=normalizeData(raw.data||raw);
      }
      const bs=await tx.get(balRef);
      const bal=balancesFromServer(bs);
      // الرصيد الافتتاحي المقروء من الخادم — أساس balanceBefore في القيود
      const opening={company:bal.company,revenue:bal.revenue,installment:bal.installment};
      const moves=[];   // حركات الحسابات لتوليد القيود
      const r2=v=>Math.round(Number(v)*100)/100;
      const chk=(v)=>{ const n=Number(v);
        if(!isFinite(n)||isNaN(n)) throw new Error("BAD_AMOUNT");
        if(n<=0) throw new Error("BAD_AMOUNT");
        return r2(n); };
      const ctx={
        data, bal, r2, chk, monthKey, operationId,
        deduct(acc,amount,note){
          const a=chk(amount);
          if(a>bal[acc]) throw new Error("INSUFFICIENT|"+acc+"|"+bal[acc]+"|"+a);
          bal[acc]=r2(bal[acc]-a);
          moves.push({account:acc,direction:"debit",amount:a,note:note||""});
          return a;
        },
        add(acc,amount,note){
          const a=chk(amount); bal[acc]=r2(bal[acc]+a);
          moves.push({account:acc,direction:"credit",amount:a,note:note||""});
          return a;
        },

        log(text,meta){ try{ if(data&&addLog) addLog(data,text,meta); }catch(e){} },
        ACC:ACC_AR
      };
      mutate(ctx);

      // ===== قيود الدفتر — إلزامية داخل نفس المعاملة =====
      // تُجمّع الحركات لكل حساب لتفادي قيود متضاربة على نفس المفتاح
      const byAcc={};
      moves.forEach(mv=>{
        if(!byAcc[mv.account]) byAcc[mv.account]={net:0,notes:[]};
        byAcc[mv.account].net += (mv.direction==="credit"?mv.amount:-mv.amount);
        if(mv.note) byAcc[mv.account].notes.push(mv.note);
      });
      Object.keys(byAcc).forEach(acc=>{
        const net=r2(byAcc[acc].net);
        if(Math.abs(net)<0.001) return;   // حركة صافيها صفر لا تُقيَّد
        writeLedgerEntry(tx,{
          operationId, operationType: opType||"money_op",
          account: acc, direction: net>0?"credit":"debit", amount: Math.abs(net),
          balanceBefore: opening[acc], balanceAfter: bal[acc],
          monthKey, sourceCollection: sourceCollection||"months", sourceId: sourceId||monthKey,
          description: description || (byAcc[acc].notes.join(" · ") || okMsg || ""),
          idempotencyKey: operationId, reverseOf: reverseOf||null
        });
      });

      // كتابات إضافية داخل نفس المعاملة (مستند الدفعة البنكية المرتبط بالحجز)
      (opts.extraWrites||[]).forEach(w=>{ tx.set(w.ref, w.data, {merge:true}); });
      if(needMonth!==false) tx.set(monRef,{data,_rev:mRev+1,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(balRef,{companyBalance:bal.company,revenueBalance:bal.revenue,
                     installmentBalance:bal.installment,installmentSchedule:bal.schedule,
                     updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      applied=bal;
    });
    if(applied){
      S.companyBalance=applied.company; S.revenueBalance=applied.revenue;
      S.installmentBalance=applied.installment; S.installmentSchedule=applied.schedule;
    }
    memClear(monthKey);
    showMsg(okMsg||"✓ تم التنفيذ");
    if(needMonth!==false) await loadMonthOnline(y,m);
    await loadBalances(); await loadLedger(monthKey); R();
    return true;
  }catch(e){
    const msg=String(e&&e.message||"");
    let t="⚠ فشلت العملية — لم يتغير شيء";
    if(msg==="BAD_AMOUNT")          t="⚠ المبلغ غير صالح — لم يتغير شيء";
    else if(msg==="ENTRY_MISSING")  t="⚠ العنصر غير موجود أو عولج مسبقاً — لم يتغير شيء";
    else if(msg==="BOOKING_OVERLAP")t="⛔ تعارض حجز — البارتشن محجوز في هذه الفترة. لم يُنفَّذ أي تغيير.";
    else if(msg==="MONTH_MISSING")  t="⚠ بيانات الشهر غير موجودة على السيرفر";
    else if(msg.startsWith("REFUND_TOO_BIG")){const p=msg.split("|");t="⛔ الاسترداد ("+Number(p[2]).toLocaleString()+") يتجاوز المبلغ المدفوع ("+Number(p[1]).toLocaleString()+") — لم يُنفَّذ شيء";}
    else if(msg==="REFUND_UNPAID") t="⛔ لا يمكن استرداد حجز غير مدفوع";
    else if(msg.startsWith("LEDGER_")) t="⛔ فشل قيد الدفتر ("+msg+") — أُلغيت العملية بالكامل";
    else if(msg.startsWith("INSUFFICIENT")){
      const p=msg.split("|"); const nm=ACC_AR[p[1]]||p[1];
      t="⛔ رصيد "+nm+" غير كافٍ — المتوفر "+Number(p[2]).toLocaleString()+" د.إ والمطلوب "+Number(p[3]).toLocaleString()+" د.إ. لم يُنفَّذ أي تغيير.";
    }
    else console.error(e);
    showMsg(t);
    try{ memClear(monthKey); if(needMonth!==false) await loadMonthOnline(y,m); await loadBalances(); }catch(e2){}
    R(); return false;
  }
  finally{ S.moneyOp=false; }
}

// ===== إلغاء/استرداد حجز يومي — السجل لا يُحذف =====
async function cancelDailyBooking(bookingId, opts){
  const o=opts||{};
  const refundMode=o.refundMode||"none";
  const reason=String(o.reason||"").trim();
  if(!reason){ showMsg("⚠ سبب الإلغاء إجباري"); return false; }
  if(S.moneyOp){ showMsg("⏳ جاري التنفيذ..."); return false; }
  S.moneyOp=true;
  const monthKey=getMonthKey(S.year,S.month);
  const opId="bookingcancel_"+bookingId;
  try{
    let applied=null;
    await runTransaction(db, async (tx)=>{
      const monRef=doc(db,"months",monthKey);
      const balRef=doc(db,"config","balances");
      // ---- قراءة أحدث نسخة من الشهر ----
      const ms=await tx.get(monRef);
      if(!ms.exists()) throw new Error("MONTH_MISSING");
      const mRaw=ms.data(); const mRev=Number(mRaw._rev)||0;
      const data=normalizeData(mRaw.data||mRaw);
      const bk=(data.dailyBookings||[]).find(x=>String(x.id)===String(bookingId));
      if(!bk) throw new Error("ENTRY_MISSING");
      if(bk.status==="cancelled"||bk.status==="refunded") throw new Error("ENTRY_MISSING");
      // ---- قراءة مستند الدفعة من السيرفر داخل نفس المعاملة (لا من الكاش) ----
      const bpId=bk.bankPaymentId||null;
      let bpRef=null, bpStatus=null;
      if(bpId){
        bpRef=doc(db,"bankPayments",bpId);
        const bs2=await tx.get(bpRef);
        bpStatus = bs2.exists() ? ((bs2.data()||{}).status||null) : null;
      }
      const bs=await tx.get(balRef);
      const bal=balancesFromServer(bs);
      const opening={...bal};
      const r2v=v=>Math.round(Number(v)*100)/100;

      // ---- حساب الاسترداد ----
      const wasPaid = CALC.bookingWasPaid(bk);
      const paid=r2v(bk.total||0);
      let refund=0;
      if(refundMode==="full")         refund=paid;
      else if(refundMode==="partial") refund=r2v(o.refundAmount);
      if(refundMode!=="none"){
        if(!isFinite(refund)||refund<=0) throw new Error("BAD_AMOUNT");
        if(refund>paid+0.01) throw new Error("REFUND_TOO_BIG|"+paid+"|"+refund);
        if(!wasPaid) throw new Error("REFUND_UNPAID");
      }
      let refundFrom=null;
      if(refund>0){
        refundFrom=o.refundFrom||(bk.paymentMethod==="cash"?"custody":"revenue");
        if(refundFrom!=="custody"){
          if(refund>bal[refundFrom]) throw new Error("INSUFFICIENT|"+refundFrom+"|"+bal[refundFrom]+"|"+refund);
          bal[refundFrom]=r2v(bal[refundFrom]-refund);
        }
      }
      // ---- قرار الدفعة البنكية بناءً على حالة السيرفر ----
      // قاعدة متسقة مع مصدر المال:
      // - إلغاء بلا استرداد: الدفعة المعلّقة **تبقى** حتى يعتمدها المدير أو يرفضها،
      //   وإلا اختفى مصدر المبلغ بينما bookingNet ما زال يحتسبه.
      // - استرداد مع دفعة معلّقة: مرفوض — يجب حسم التحويل أولاً.
      let bpAction="none";
      if(bpId){
        if(bpStatus==="pending"){
          if(refund>0) throw new Error("BANK_PENDING_FIRST");
          bpAction="keep_pending";
        }
        else if(bpStatus==="approved")  bpAction="keep";
        else                            bpAction="none";
      }
      // ---- تعديل الحجز: السجل يبقى ----
      bk.wasPaid = wasPaid;                 // يُحفظ قبل تغيير الحالة
      bk.status  = refund>0 ? "refunded" : "cancelled";
      bk.refundAmount = refund;
      bk.refundFrom = refundFrom;
      if(refundFrom==="custody") bk.refundedBy=o.refundedBy||bk.collectedBy||S.user;
      bk.cancelledAt=new Date().toISOString();
      bk.cancelledBy=S.user;
      bk.cancelReason=reason;
      if(bpAction==="keep_pending") bk.bankPendingAtCancel=true;
      try{ addLog&&addLog(data, userName(S.user)+" ألغى حجز "+(bk.guest||"—")+" ("+paid.toLocaleString()+" د.إ)"+
        (refund>0?" — استرداد "+refund.toLocaleString()+" د.إ من "+(refundFrom==="custody"?"العهدة":ACC_AR[refundFrom]):" — بلا استرداد")+
        (bpAction==="keep_pending"?" · التحويل ما زال معلّقاً — اعتمده أو ارفضه":bpAction==="keep"?" · التحويل المعتمد باقٍ":"")+" · السبب: "+reason,
        {target:"الحجوزات",field:"إلغاء حجز",oldVal:paid+" د.إ",newVal:bk.status}); }catch(e){}

      // ---- الكتابات ----
      if(refund>0 && refundFrom!=="custody"){
        writeLedgerEntry(tx,{
          operationId:opId, operationType:"daily_booking_refund",
          account:refundFrom, direction:"debit", amount:refund,
          balanceBefore:opening[refundFrom], balanceAfter:bal[refundFrom],
          monthKey, sourceCollection:"months", sourceId:"dailyBookings:"+bookingId,
          description:"استرداد حجز يومي — "+reason,
          idempotencyKey:opId, reverseOf:"booking_"+bookingId
        });
      }
      tx.set(monRef,{data,_rev:mRev+1,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      if(refund>0 && refundFrom!=="custody"){
        tx.set(balRef,{companyBalance:bal.company,revenueBalance:bal.revenue,
                       installmentBalance:bal.installment,installmentSchedule:bal.schedule,
                       updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      }
      applied={bal,bpAction,refund};
    });
    if(applied&&applied.refund>0&&applied.bal){
      S.companyBalance=applied.bal.company; S.revenueBalance=applied.bal.revenue;
      S.installmentBalance=applied.bal.installment;
    }
    memClear(monthKey);
    showMsg(applied&&applied.refund>0 ? "✓ أُلغي الحجز وسُجّل الاسترداد"
      : (applied&&applied.bpAction==="keep_pending" ? "✓ أُلغي الحجز — التحويل ما زال بانتظار اعتمادك أو رفضك" : "✓ أُلغي الحجز بلا استرداد"));
    await loadMonthOnline(S.year,S.month);
    await Promise.all([loadBankPayments(monthKey),loadBalances(),loadLedger(monthKey)]);
    R();
    return true;
  }catch(e){
    const m=String(e&&e.message||"");
    let t="⚠ فشل الإلغاء — لم يتغير شيء";
    if(m==="ENTRY_MISSING")      t="⚠ الحجز غير موجود أو أُلغي مسبقاً — لم يتغير شيء";
    else if(m==="BAD_AMOUNT")    t="⚠ مبلغ الاسترداد غير صالح";
    else if(m==="REFUND_UNPAID") t="⛔ لا يمكن استرداد حجز غير مدفوع";
    else if(m==="BANK_PENDING_FIRST") t="⛔ التحويل البنكي ما زال معلّقاً — اعتمده أو ارفضه أولاً، ثم نفّذ الاسترداد. (رفض التحويل يجعل صافي الحجز صفراً)";
    else if(m==="MONTH_MISSING") t="⚠ بيانات الشهر غير موجودة على السيرفر";
    else if(m.startsWith("REFUND_TOO_BIG")){const p=m.split("|");t="⛔ الاسترداد ("+Number(p[2]).toLocaleString()+") يتجاوز المدفوع ("+Number(p[1]).toLocaleString()+")";}
    else if(m.startsWith("INSUFFICIENT")){const p=m.split("|");t="⛔ رصيد "+(ACC_AR[p[1]]||p[1])+" غير كافٍ — المتوفر "+Number(p[2]).toLocaleString()+" والمطلوب "+Number(p[3]).toLocaleString();}
    else if(m.startsWith("LEDGER_")) t="⛔ فشل قيد الدفتر — أُلغيت العملية بالكامل";
    else console.error(e);
    showMsg(t);
    try{ memClear(monthKey); await loadMonthOnline(S.year,S.month); await loadBankPayments(monthKey); await loadBalances(); }catch(e2){}
    R(); return false;
  }
  finally{ S.moneyOp=false; }
}

// ================= دفتر القيود (Ledger) =================
// كل تغيير رصيد يكتب قيداً داخل نفس runTransaction. لا كتابة لاحقة، ولا try/catch صامت.
// entryId حتمي من idempotencyKey → إعادة المحاولة لا تنشئ قيداً مكرراً.
const ACC_AR={company:"الشركة",revenue:"الإيرادات",installment:"الاقتطاع",custody:"عهدة الموظفين"};
function balancesFromServer(snap){
  if(!snap||!snap.exists())throw new Error("BALANCES_MISSING");
  const b=snap.data()||{};
  const out={company:Number(b.companyBalance),revenue:Number(b.revenueBalance),installment:Number(b.installmentBalance),schedule:Array.isArray(b.installmentSchedule)?b.installmentSchedule:[]};
  if(!isFinite(out.company)||!isFinite(out.revenue)||!isFinite(out.installment))throw new Error("BALANCES_INVALID");
  return out;
}

function ledgerEntryId(idempotencyKey, account){
  return "led_"+String(idempotencyKey).replace(/[^A-Za-z0-9_-]/g,"")+"_"+account;
}

// tx: كائن المعاملة · op: تفاصيل العملية
// ملاحظة: تُستدعى بعد كل قراءات المعاملة (شرط Firestore: القراءات قبل الكتابات)
function writeLedgerEntry(tx, op){
  if(!tx) throw new Error("LEDGER_NO_TX");
  const amount=Math.round(Number(op.amount)*100)/100;
  if(!isFinite(amount)||isNaN(amount)||amount<=0) throw new Error("LEDGER_BAD_AMOUNT");
  if(["company","revenue","installment","custody"].indexOf(op.account)<0) throw new Error("LEDGER_BAD_ACCOUNT");
  if(["debit","credit"].indexOf(op.direction)<0) throw new Error("LEDGER_BAD_DIRECTION");
  if(!op.idempotencyKey) throw new Error("LEDGER_NO_IDEM");
  if(!op.operationType) throw new Error("LEDGER_NO_TYPE");
  const before=Math.round(Number(op.balanceBefore)*100)/100;
  const after =Math.round(Number(op.balanceAfter)*100)/100;
  if(!isFinite(before)||!isFinite(after)) throw new Error("LEDGER_BAD_BALANCE");
  // التحقق الحسابي: الاتجاه يجب أن يطابق فرق الرصيد
  const delta=Math.round((after-before)*100)/100;
  const expect=op.direction==="credit"?amount:-amount;
  if(Math.abs(delta-expect)>0.01) throw new Error("LEDGER_MISMATCH|"+delta+"|"+expect);
  const entryId=ledgerEntryId(op.idempotencyKey, op.account);
  tx.set(doc(db,"ledger",entryId),{
    entryId,
    operationId:    op.operationId||op.idempotencyKey,
    operationType:  op.operationType,
    account:        op.account,
    direction:      op.direction,         // credit = زيادة · debit = نقص
    amount,
    balanceBefore:  before,
    balanceAfter:   after,
    monthKey:       op.monthKey||"",
    sourceCollection: op.sourceCollection||"",
    sourceId:       String(op.sourceId||""),
    description:    op.description||"",
    createdBy:      op.createdBy||S.user||"",
    createdByUid:   S.uid||null,
    createdByName:  userName(S.user),
    createdAt:      new Date().toISOString(),
    reverseOf:      op.reverseOf||null,
    idempotencyKey: op.idempotencyKey
  });
  return entryId;
}

// قراءة قيود الشهر (للتقرير والمطابقة)
const LEDGER_MEM={key:null,list:[]};
async function loadLedger(monthKey){
  try{
    const { getDocsFromServer } = await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
    const q=query(collection(db,"ledger"), where("monthKey","==",monthKey));
    let snap; try{ snap=await getDocsFromServer(q); }catch(e){ snap=await getDocs(q); }
    LEDGER_MEM.key=monthKey;
    LEDGER_MEM.list=snap.docs.map(d=>({entryId:d.id,...d.data()}));
  }catch(e){ console.error("loadLedger",e); LEDGER_MEM.key=monthKey; LEDGER_MEM.list=[]; }
  return LEDGER_MEM.list;
}
// صافي حركة حساب من القيود
function ledgerNet(account){
  return Math.round((LEDGER_MEM.list||[]).filter(x=>x.account===account)
    .reduce((s,x)=>s+(x.direction==="credit"?Number(x.amount||0):-Number(x.amount||0)),0)*100)/100;
}

// ================= تسويات الأرصدة (Balance Adjustments) =================
// عملية مستقلة تعدّل الرصيد بسبب موثّق. ليست مصروفاً ولا إيداع إيجار،
// ولا تدخل في المستهدف ولا المحصّل ولا أي تقرير تحصيل.
// المستند غير قابل للتعديل أو الحذف — التصحيح بعملية عكسية مرتبطة بالأصل.
const ADJ_MEM = { key:null, list:[] };

function adjId(monthKey, idem){ return "adj_"+monthKey+"_"+String(idem).replace(/[^A-Za-z0-9_-]/g,""); }

async function loadAdjustments(monthKey){
  try{
    const { getDocsFromServer } = await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
    const q = query(collection(db,"balanceAdjustments"), where("monthKey","==",monthKey));
    let snap; try{ snap=await getDocsFromServer(q); }catch(e){ snap=await getDocs(q); }
    ADJ_MEM.key=monthKey;
    ADJ_MEM.list=snap.docs.map(d=>({ adjustmentId:d.id, ...d.data() }));
  }catch(e){ console.error("loadAdjustments",e); ADJ_MEM.key=monthKey; ADJ_MEM.list=[]; }
  return ADJ_MEM.list;
}

// إنشاء تسوية — الحساب + النوع + المبلغ + السبب (إجباري)
async function createAdjustment(o){
  const amount=Math.round(Number(o.amount)*100)/100;
  if(!isFinite(amount)||isNaN(amount)||amount<=0){ showMsg("⚠ المبلغ غير صالح"); return false; }
  if(!o.reason||!String(o.reason).trim()){ showMsg("⚠ السبب إجباري — اكتب سبب التسوية"); return false; }
  if(["company","revenue","installment"].indexOf(o.account)<0){ showMsg("⚠ حساب غير معروف"); return false; }
  if(["add","withdraw"].indexOf(o.type)<0){ showMsg("⚠ نوع العملية غير معروف"); return false; }
  if(S.moneyOp){ showMsg("⏳ جاري التنفيذ..."); return false; }
  S.moneyOp=true;
  const monthKey=getMonthKey(S.year,S.month);
  const idem=o.idempotencyKey||(S.user+"_"+Date.now());
  const aid=adjId(monthKey,idem);
  const ACCN={company:"الشركة",revenue:"الإيرادات",installment:"الاقتطاع"};
  try{
    await runTransaction(db, async (tx)=>{
      const adjRef=doc(db,"balanceAdjustments",aid);
      const monRef=doc(db,"months",monthKey);
      const balRef=doc(db,"config","balances");
      const as=await tx.get(adjRef);
      if(as.exists()) throw new Error("DUPLICATE");     // معرّف المستند = حارس التكرار
      const ms=await tx.get(monRef);
      if(!ms.exists()) throw new Error("MONTH_MISSING");
      const mRaw=ms.data(); const mRev=Number(mRaw._rev)||0;
      const data=normalizeData(mRaw.data||mRaw);
      const bs=await tx.get(balRef);
      const bal=balancesFromServer(bs);
      const r2=v=>Math.round(v*100)/100;
      const _adjBefore=bal[o.account];
      if(o.type==="withdraw"){
        if(amount>bal[o.account]) throw new Error("INSUFFICIENT|"+o.account+"|"+bal[o.account]+"|"+amount);
        bal[o.account]=r2(bal[o.account]-amount);
      } else bal[o.account]=r2(bal[o.account]+amount);
      writeLedgerEntry(tx,{
        operationId:aid, operationType:o.reverseOf?"adjustment_reversal":"balance_adjustment",
        account:o.account, direction:o.type==="add"?"credit":"debit", amount,
        balanceBefore:_adjBefore, balanceAfter:bal[o.account],
        monthKey, sourceCollection:"balanceAdjustments", sourceId:aid,
        description:"تسوية رصيد: "+String(o.reason).trim(),
        idempotencyKey:idem, reverseOf:o.reverseOf||null
      });

      try{ addLog&&addLog(data,(USERS[S.user]?.name||S.user)+" نفّذ تسوية رصيد: "+(o.type==="add"?"إضافة":"سحب")+" "+amount.toLocaleString()+" د.إ "+(o.type==="add"?"إلى":"من")+" حساب "+ACCN[o.account]+" — السبب: "+o.reason,
            {target:"تسويات الأرصدة",field:o.type==="add"?"إضافة":"سحب",oldVal:"—",newVal:amount+" د.إ"}); }catch(e){}

      tx.set(adjRef,{
        account:o.account, type:o.type, amount, reason:String(o.reason).trim(),
        notes:o.notes||"", date:o.date||todayISO(), monthKey,
        idempotencyKey:idem, createdBy:S.user, createdByUid:S.uid||null, createdAt:new Date().toISOString(),
        status:"active", reverseOf:o.reverseOf||null, reversedBy:null, reversedAt:null
      });
      tx.set(monRef,{data,_rev:mRev+1,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(balRef,{companyBalance:bal.company,revenueBalance:bal.revenue,installmentBalance:bal.installment,
                     updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      S._pendingBal=bal;
    });
    if(S._pendingBal){ S.companyBalance=S._pendingBal.company; S.revenueBalance=S._pendingBal.revenue; S.installmentBalance=S._pendingBal.installment; S._pendingBal=null; }
    memClear(monthKey);
    showMsg("✓ نُفّذت التسوية");
    await loadAdjustments(monthKey); await loadMonthOnline(S.year,S.month); await loadBalances(); R();
    return true;
  }catch(e){
    S._pendingBal=null;
    const m=String(e&&e.message||"");
    let t="⚠ فشلت التسوية — لم يتغير شيء";
    if(m==="DUPLICATE") t="⚠ هذه التسوية منفّذة مسبقاً";
    else if(m.startsWith("INSUFFICIENT")){const p=m.split("|");t="⛔ رصيد "+ACCN[p[1]]+" غير كافٍ — المتوفر "+Number(p[2]).toLocaleString()+" د.إ والمطلوب "+Number(p[3]).toLocaleString()+" د.إ";}
    else if(m==="MONTH_MISSING") t="⚠ بيانات الشهر غير موجودة على السيرفر";
    else console.error(e);
    showMsg(t);
    try{ memClear(monthKey); await loadAdjustments(monthKey); await loadBalances(); }catch(e2){}
    R(); return false;
  }
  finally{ S.moneyOp=false; }
}

// عكس تسوية — معاملة ذرّية واحدة: قراءة الأصل + إنشاء المضادة + الرصيد + Ledger + وسم الأصل
async function reverseAdjustment(adjustmentId){
  if(S.moneyOp){ showMsg("⏳ جاري التنفيذ..."); return false; }
  S.moneyOp=true;
  const monthKey=getMonthKey(S.year,S.month);
  const revId="adj_"+monthKey+"_rev_"+String(adjustmentId).replace(/[^A-Za-z0-9_-]/g,"");
  try{
    await runTransaction(db, async (tx)=>{
      const origRef=doc(db,"balanceAdjustments",adjustmentId);
      const revRef =doc(db,"balanceAdjustments",revId);
      const monRef =doc(db,"months",monthKey);
      const balRef =doc(db,"config","balances");
      // ---- كل القراءات أولاً ----
      const os=await tx.get(origRef);
      if(!os.exists()) throw new Error("ADJ_MISSING");
      const orig=os.data()||{};
      if(orig.reverseOf)            throw new Error("IS_REVERSAL");
      if(orig.status!=="active")    throw new Error("NOT_ACTIVE|"+(orig.status||"?"));
      const rs=await tx.get(revRef);
      if(rs.exists())               throw new Error("ALREADY_REVERSED"); // مستند العكس هو الحارس
      const ms=await tx.get(monRef);
      if(!ms.exists()) throw new Error("MONTH_MISSING");
      const mRaw=ms.data(); const mRev=Number(mRaw._rev)||0;
      const data=normalizeData(mRaw.data||mRaw);
      const bs=await tx.get(balRef);
      const bal=balancesFromServer(bs);
      // ---- الحساب ----
      const acc=orig.account;
      const amount=Math.round(Number(orig.amount||0)*100)/100;
      if(!isFinite(amount)||amount<=0) throw new Error("BAD_AMOUNT");
      const revType = orig.type==="add" ? "withdraw" : "add";
      const before=bal[acc];
      if(revType==="withdraw"){
        if(amount>bal[acc]) throw new Error("INSUFFICIENT|"+acc+"|"+bal[acc]+"|"+amount);
        bal[acc]=Math.round((bal[acc]-amount)*100)/100;
      } else bal[acc]=Math.round((bal[acc]+amount)*100)/100;

      try{ addLog&&addLog(data,(USERS[S.user]?.name||S.user)+" عكس تسوية رصيد: "+amount.toLocaleString()+" د.إ على حساب "+(ACC_AR[acc]||acc)+" — الأصل: "+(orig.reason||""),
            {target:"تسويات الأرصدة",field:"عكس تسوية",oldVal:orig.type==="add"?"إضافة":"سحب",newVal:amount+" د.إ"}); }catch(e){}

      // ---- كل الكتابات ----
      writeLedgerEntry(tx,{
        operationId:revId, operationType:"adjustment_reversal",
        account:acc, direction:revType==="add"?"credit":"debit", amount,
        balanceBefore:before, balanceAfter:bal[acc],
        monthKey, sourceCollection:"balanceAdjustments", sourceId:revId,
        description:"عكس تسوية سابقة: "+(orig.reason||""),
        idempotencyKey:"rev_"+adjustmentId, reverseOf:adjustmentId
      });
      tx.set(revRef,{
        account:acc, type:revType, amount, reason:"عكس تسوية سابقة: "+(orig.reason||""),
        notes:"مرتبطة بالتسوية "+adjustmentId, date:todayISO(), monthKey,
        idempotencyKey:"rev_"+adjustmentId, createdBy:S.user, createdByUid:S.uid||null, createdAt:new Date().toISOString(),
        status:"active", reverseOf:adjustmentId, reversedBy:null, reversedAt:null
      });
      tx.set(origRef,{status:"reversed",reversedBy:S.user, reversedByUid:S.uid||null,reversedAt:new Date().toISOString(),reversalId:revId},{merge:true});
      tx.set(monRef,{data,_rev:mRev+1,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(balRef,{companyBalance:bal.company,revenueBalance:bal.revenue,installmentBalance:bal.installment,
                     updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      S._pendingBal=bal;
    });
    if(S._pendingBal){ S.companyBalance=S._pendingBal.company; S.revenueBalance=S._pendingBal.revenue; S.installmentBalance=S._pendingBal.installment; S._pendingBal=null; }
    memClear(monthKey);
    showMsg("✓ أُنشئت التسوية العكسية");
    await loadAdjustments(monthKey); await loadMonthOnline(S.year,S.month); await loadBalances(); await loadLedger(monthKey); R();
    return true;
  }catch(e){
    S._pendingBal=null;
    const m=String(e&&e.message||"");
    let t="⚠ فشل العكس — لم يتغير شيء";
    if(m==="ADJ_MISSING")            t="⚠ التسوية غير موجودة";
    else if(m==="IS_REVERSAL")       t="⚠ لا يمكن عكس عملية عكسية";
    else if(m==="ALREADY_REVERSED")  t="⚠ هذه التسوية معكوسة مسبقاً";
    else if(m.startsWith("NOT_ACTIVE")) t="⚠ التسوية ليست نشطة — لم يتغير شيء";
    else if(m.startsWith("INSUFFICIENT")){const p=m.split("|");t="⛔ رصيد "+(ACC_AR[p[1]]||p[1])+" غير كافٍ لعكس التسوية — المتوفر "+Number(p[2]).toLocaleString()+" والمطلوب "+Number(p[3]).toLocaleString();}
    else if(m.startsWith("LEDGER_")) t="⛔ فشل قيد الدفتر — أُلغيت العملية بالكامل";
    else console.error(e);
    showMsg(t);
    try{ memClear(monthKey); await loadAdjustments(monthKey); await loadBalances(); }catch(e2){}
    R(); return false;
  }
  finally{ S.moneyOp=false; }
}

// ================= نظام الدفعات البنكية (bankPayments) =================
// كل دفعة مستند مستقل. معرّف المستند نفسه = مفتاح منع التكرار:
// createBankPayment يستخدم tx.get على المعرّف ويرفض إن كان موجوداً، فلا يمكن
// إنشاء مستندين بنفس المفتاح مهما تكرر الضغط أو تعددت الأجهزة.
const BANK_PAY_MEM = { key:null, list:[] };

function bankPayId(monthKey, unitRef, idem){
  // معرّف حتمي: نفس المدخلات = نفس المستند = استحالة التكرار
  return "bp_" + monthKey + "_" + String(unitRef).replace(/[^A-Za-z0-9_-]/g,"") + "_" + idem;
}
function bankUnitRef(u, p){ return p ? ("u"+u.id+"p"+p.id) : ("full"+u.id); }

async function loadBankPayments(monthKey){
  try{
    const { getDocsFromServer } = await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
    const q = query(collection(db,"bankPayments"), where("monthKey","==",monthKey));
    let snap;
    try{ snap = await getDocsFromServer(q); }catch(e){ snap = await getDocs(q); }
    BANK_PAY_MEM.key = monthKey;
    BANK_PAY_MEM.list = snap.docs.map(d=>({ paymentId:d.id, ...d.data() }));
  }catch(e){ console.error("loadBankPayments",e); BANK_PAY_MEM.key=monthKey; BANK_PAY_MEM.list=[]; }
  return BANK_PAY_MEM.list;
}
function bankPaymentsFor(unitRef, statuses){
  const st = statuses || ["pending","approved"];
  return (BANK_PAY_MEM.list||[]).filter(x=>x.unitRef===unitRef && st.indexOf(x.status)>=0);
}
function bankPaidTotal(unitRef){   // معتمد فقط
  return Math.round(bankPaymentsFor(unitRef,["approved"]).reduce((s,x)=>s+Number(x.amount||0),0)*100)/100;
}
function bankPendingTotal(unitRef){
  return Math.round(bankPaymentsFor(unitRef,["pending"]).reduce((s,x)=>s+Number(x.amount||0),0)*100)/100;
}
function bankRemaining(unitRef, dueAmount){
  const d=Math.round(Number(dueAmount||0)*100)/100;
  return Math.round((d - bankPaidTotal(unitRef) - bankPendingTotal(unitRef))*100)/100;
}

// إنشاء دفعة — الموظف يسجّلها، تبقى pending حتى يعتمدها المدير
async function createBankPayment(opts){
  const amount=Math.round(Number(opts.amount)*100)/100;
  if(!isFinite(amount)||isNaN(amount)||amount<=0){ showMsg("⚠ مبلغ الدفعة غير صالح"); return false; }
  const monthKey=getMonthKey(S.year,S.month);
  const idem = opts.idempotencyKey || (S.user+"_"+Date.now());
  const pid  = bankPayId(monthKey, opts.unitRef, idem);
  try{
    await runTransaction(db, async (tx)=>{
      const ref=doc(db,"bankPayments",pid);
      const snap=await tx.get(ref);
      if(snap.exists()) throw new Error("DUPLICATE"); // معرّف المستند هو الحارس
      tx.set(ref,{
        idempotencyKey:idem, unitRef:opts.unitRef, unitLabel:opts.unitLabel||"",
        unitId:String(opts.unitId||""), partId:(opts.partId==null?null:String(opts.partId)),
        tenant:opts.tenant||"", contractCycle:opts.contractCycle||"", monthKey,
        amount, method:"bank", bankReference:opts.bankReference||"",
        paymentDate:opts.paymentDate||todayISO(),
        status:"pending", createdBy:S.user, createdByUid:S.uid||null, createdAt:new Date().toISOString(),
        approvedBy:null, approvedAt:null, cancelledAt:null, cancelReason:null
      });
    });
    await loadBankPayments(monthKey);
    showMsg("✓ سُجّلت الدفعة البنكية — بانتظار اعتماد المدير");
    R(); return true;
  }catch(e){
    const m=String(e&&e.message||"");
    showMsg(m==="DUPLICATE" ? "⚠ هذه الدفعة مسجّلة مسبقاً" : "⚠ تعذّر تسجيل الدفعة — لم يُحفظ شيء");
    if(m!=="DUPLICATE") console.error(e);
    return false;
  }
}

// اعتماد دفعة واحدة — معاملة ذرّية: حالة الدفعة + قيد الإيداع + رصيد الإيرادات
async function approveBankPayment(paymentId){
  if(S.approving){showMsg("⏳ جاري المعالجة...");return false;}
  S.approving=true;
  const monthKey=getMonthKey(S.year,S.month);
  try{
    await runTransaction(db, async (tx)=>{
      const payRef=doc(db,"bankPayments",paymentId);
      const monRef=doc(db,"months",monthKey);
      const balRef=doc(db,"config","balances");
      const ps=await tx.get(payRef);
      if(!ps.exists()) throw new Error("PAY_MISSING");
      const pay=ps.data()||{};
      if(pay.status!=="pending") throw new Error("NOT_PENDING|"+(pay.status||"?"));
      const amount=Math.round(Number(pay.amount||0)*100)/100;
      if(!isFinite(amount)||amount<=0) throw new Error("BAD_AMOUNT");

      const ms=await tx.get(monRef);
      if(!ms.exists()) throw new Error("MONTH_MISSING");
      const mRaw=ms.data(); const mRev=Number(mRaw._rev)||0;
      const data=normalizeData(mRaw.data||mRaw);
      // منع مزدوج ثانٍ: القيد نفسه لا يُضاف مرتين
      if((data.transactions||[]).some(t=>t.bankPaymentId===paymentId)) throw new Error("ALREADY_POSTED");

      const bs=await tx.get(balRef);
      const b=balancesFromServer(bs);
      let revenue=b.revenue;
      const company=b.company;

      data.transactions.push({
        id:"bp_"+paymentId, type:"تحويل بنكي",
        desc:"تحويل بنكي — "+(pay.unitLabel||pay.unitRef)+(pay.tenant?" ("+pay.tenant+")":"")+(pay.bankReference?" · مرجع "+pay.bankReference:""),
        amount, date:pay.paymentDate||todayISO(), by:pay.createdBy||S.user,
        bankPaymentId:paymentId, bankRef:pay.unitRef,
        approvedBy:S.user, approvedByUid:S.uid||null, approvedAt:new Date().toISOString()
      });
      const _revBefore=revenue;
      revenue=Math.round((revenue+amount)*100)/100;
      writeLedgerEntry(tx,{
        operationId:"bankapprove_"+paymentId, operationType:"bank_payment_approved",
        account:"revenue", direction:"credit", amount,
        balanceBefore:_revBefore, balanceAfter:revenue,
        monthKey, sourceCollection:"bankPayments", sourceId:paymentId,
        description:"اعتماد تحويل بنكي — "+(pay.unitLabel||pay.unitRef)+(pay.bankReference?" · مرجع "+pay.bankReference:""),
        idempotencyKey:"bankapprove_"+paymentId
      });
      try{ addLog&&addLog(data,(USERS[S.user]?.name||S.user)+" اعتمد تحويلاً بنكياً "+amount.toLocaleString()+" د.إ — "+(pay.unitLabel||pay.unitRef),
            {target:pay.unitLabel||pay.unitRef,field:"اعتماد تحويل بنكي",oldVal:"معلّق",newVal:amount+" د.إ"}); }catch(e){}

      tx.set(monRef,{data,_rev:mRev+1,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(balRef,{revenueBalance:revenue,...(isFinite(company)?{companyBalance:company}:{}),updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(payRef,{status:"approved",approvedBy:S.user, approvedByUid:S.uid||null,approvedAt:new Date().toISOString()},{merge:true});
      S._pendingBal={revenueBalance:revenue};
    });
    if(S._pendingBal){ S.revenueBalance=S._pendingBal.revenueBalance; S._pendingBal=null; }
    memClear(monthKey);
    showMsg("✓ اعتُمدت الدفعة وأُضيفت للإيداعات");
    await loadBankPayments(monthKey); await loadMonthOnline(S.year,S.month); await loadBalances(); R();
    return true;
  }catch(e){
    S._pendingBal=null;
    const m=String(e&&e.message||"");
    let t="⚠ فشل الاعتماد — لم يتغير شيء";
    if(m.startsWith("NOT_PENDING")) t="⚠ الدفعة ليست معلّقة (عولجت مسبقاً) — لم يتغير شيء";
    else if(m==="ALREADY_POSTED")  t="⚠ الدفعة مُرحّلة للإيداعات مسبقاً — لم يتغير شيء";
    else if(m==="PAY_MISSING")     t="⚠ الدفعة غير موجودة";
    else if(m==="MONTH_MISSING")   t="⚠ بيانات الشهر غير موجودة على السيرفر";
    else if(m==="BAD_AMOUNT")      t="⚠ مبلغ الدفعة غير صالح";
    else console.error(e);
    showMsg(t);
    try{ memClear(monthKey); await loadBankPayments(monthKey); await loadMonthOnline(S.year,S.month); await loadBalances(); }catch(e2){}
    R(); return false;
  }
  finally{S.approving=false;}
}

// إلغاء دفعة واحدة — بلا أي أثر على بقية دفعات الوحدة
async function cancelBankPayment(paymentId, reason){
  if(S.approving){showMsg("⏳ جاري المعالجة...");return false;}
  S.approving=true;
  const monthKey=getMonthKey(S.year,S.month);
  try{
    await runTransaction(db, async (tx)=>{
      const payRef=doc(db,"bankPayments",paymentId);
      const monRef=doc(db,"months",monthKey);
      const balRef=doc(db,"config","balances");
      const ps=await tx.get(payRef);
      if(!ps.exists()) throw new Error("PAY_MISSING");
      const pay=ps.data()||{};
      if(pay.status==="cancelled") throw new Error("ALREADY_CANCELLED");
      const amount=Math.round(Number(pay.amount||0)*100)/100;
      const wasApproved = pay.status==="approved";

      const ms=await tx.get(monRef);
      if(!ms.exists()) throw new Error("MONTH_MISSING");
      const mRaw=ms.data(); const mRev=Number(mRaw._rev)||0;
      const data=normalizeData(mRaw.data||mRaw);
      const bs=await tx.get(balRef);
      const b=balancesFromServer(bs);
      let revenue=b.revenue;

      if(wasApproved){
        // ⛔ لا حذف — القيد يبقى موسوماً reversed
        const t0=(data.transactions||[]).find(t=>t.bankPaymentId===paymentId);
        if(t0 && !t0.reversed){
          if(amount>revenue) throw new Error("INSUFFICIENT|revenue|"+revenue+"|"+amount);
          const _rb=revenue;
          revenue=Math.round((revenue-amount)*100)/100;
          writeLedgerEntry(tx,{
            operationId:"bankcancel_"+paymentId, operationType:"bank_payment_cancelled",
            account:"revenue", direction:"debit", amount,
            balanceBefore:_rb, balanceAfter:revenue,
            monthKey, sourceCollection:"bankPayments", sourceId:paymentId,
            description:"إلغاء تحويل بنكي معتمد — "+(pay.unitLabel||pay.unitRef),
            idempotencyKey:"bankcancel_"+paymentId, reverseOf:"bankapprove_"+paymentId
          });
          t0.reversed=true; t0.reversedAt=new Date().toISOString();
          t0.reversedBy=S.user; t0.reversedByUid=S.uid||null;
          t0.reverseReason=reason||"إلغاء تحويل بنكي معتمد";
          t0.reverseOf="bankapprove_"+paymentId; t0.reversedAccount="revenue";
        }
      }
      // التحويل المعلّق المرتبط بحجز: رفضه يعني أن المال لم يصل — صافي الحجز صفر
      if(!wasApproved && pay.bookingId){
        const _lbk=(data.dailyBookings||[]).find(x=>String(x.id)===String(pay.bookingId));
        if(_lbk){
          _lbk.wasPaid=false; _lbk.paidAt=null;
          if(_lbk.status!=="refunded") _lbk.status="cancelled";
          _lbk.bankRejected=true; _lbk.bankRejectedAt=new Date().toISOString();
          _lbk.cancelReason=(_lbk.cancelReason||"")+" · رُفض التحويل البنكي (لم يصل)";
        }
      }
      try{ addLog&&addLog(data,(USERS[S.user]?.name||S.user)+" ألغى دفعة بنكية "+amount.toLocaleString()+" د.إ — "+(pay.unitLabel||pay.unitRef),
            {target:pay.unitLabel||pay.unitRef,field:"إلغاء دفعة بنكية",oldVal:pay.status,newVal:"ملغاة"}); }catch(e){}

      tx.set(monRef,{data,_rev:mRev+1,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      if(wasApproved) tx.set(balRef,{revenueBalance:revenue,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(payRef,{status:"cancelled",cancelledAt:new Date().toISOString(),cancelledBy:S.user,cancelReason:reason||""},{merge:true});
      S._pendingBal=wasApproved?{revenueBalance:revenue}:null;
    });
    if(S._pendingBal){ S.revenueBalance=S._pendingBal.revenueBalance; S._pendingBal=null; }
    memClear(monthKey);
    showMsg("✓ أُلغيت الدفعة وعُكس أثرها");
    await loadBankPayments(monthKey); await loadMonthOnline(S.year,S.month); await loadBalances(); R();
    return true;
  }catch(e){
    S._pendingBal=null;
    const m=String(e&&e.message||"");
    let t="⚠ فشل الإلغاء — لم يتغير شيء";
    if(m==="ALREADY_CANCELLED") t="⚠ الدفعة ملغاة مسبقاً";
    else if(m.startsWith("INSUFFICIENT")){const p=m.split("|");t="⛔ رصيد الإيرادات غير كافٍ لعكس الدفعة — المتوفر "+Number(p[2]).toLocaleString()+" والمطلوب "+Number(p[3]).toLocaleString();}
    else console.error(e);
    showMsg(t);
    try{ memClear(monthKey); await loadBankPayments(monthKey); await loadBalances(); }catch(e2){}
    R(); return false;
  }
  finally{S.approving=false;}
}

// ===== تصحيح عملية مالية معتمدة: عكس الأصل + تسجيل الصحيحة، في معاملة واحدة =====
// الأصل يبقى في السجل موسوماً corrected، والجديدة مرتبطة به بـcorrectedFrom.
async function correctApprovedFinancial(req, newAmount, newDesc, srcPick){
  if(S.moneyOp){ showMsg("⏳ جاري التنفيذ..."); return false; }
  const amt=Math.round(Number(newAmount)*100)/100;
  if(!isFinite(amt)||isNaN(amt)||amt<=0){ showMsg("⚠ المبلغ الجديد غير صالح"); return false; }
  S.moneyOp=true;
  const monthKey=getMonthKey(req.year,req.month);
  const opId="correct_"+req.id;
  try{
    let applied=null;
    await runTransaction(db, async (tx)=>{
      const reqRef=doc(db,"requests",req.id);
      const monRef=doc(db,"months",monthKey);
      const balRef=doc(db,"config","balances");
      const rs=await tx.get(reqRef);
      if(!rs.exists()) throw new Error("REQ_MISSING");
      const rc=rs.data()||{};
      if(rc.status!=="approved") throw new Error("NOT_APPROVED|"+(rc.status||"?"));
      if(rc.corrected) throw new Error("ALREADY_CORRECTED");     // يمنع التصحيح مرتين
      const R_TYPE=rc.type, R_PAY=rc.payload||{};
      if(R_TYPE!=="add_transaction" && R_TYPE!=="add_expense") throw new Error("UNSUPPORTED");

      const ms=await tx.get(monRef);
      if(!ms.exists()) throw new Error("MONTH_MISSING");
      const mRaw=ms.data(); const mRev=Number(mRaw._rev)||0;
      const data=normalizeData(mRaw.data||mRaw);
      const bs=await tx.get(balRef);
      const b=balancesFromServer(bs);
      let company=b.company;
      let revenue=b.revenue;
      const open={company,revenue};
      const r2v=v=>Math.round(Number(v)*100)/100;

      let acc=null, oldAmt=0;
      if(R_TYPE==="add_transaction"){
        acc="revenue";
        const t0=(data.transactions||[]).find(x=>x.requestId===req.id||(R_PAY.transaction&&x.id===R_PAY.transaction.id));
        if(!t0) throw new Error("ENTRY_MISSING");
        if(t0.reversed) throw new Error("ALREADY_CORRECTED");
        oldAmt=r2v(t0.amount||0);
        // عكس الأصل: سحب المبلغ القديم
        if(oldAmt>revenue) throw new Error("INSUFFICIENT|revenue|"+revenue+"|"+oldAmt);
        revenue=r2v(revenue-oldAmt);
        t0.reversed=true; t0.correctedAt=new Date().toISOString(); t0.correctedBy=S.user;
        // العملية الصحيحة الجديدة
        data.transactions.push({id:opId, opId:opId, desc:(newDesc||t0.desc||"")+" (مصحّحة)",
          amount:amt, date:t0.date||todayISO(), type:t0.type||"عام", by:t0.by||S.user,
          correctedFrom:String(t0.id), createdBy:S.user, createdByUid:S.uid||null,
          approvedBy:S.user, approvedAt:new Date().toISOString()});
        revenue=r2v(revenue+amt);
      } else {
        const e0=(data.expenses||[]).find(x=>x.requestId===req.id||(R_PAY.expense&&x.id===R_PAY.expense.id));
        if(!e0) throw new Error("ENTRY_MISSING");
        if(e0.reversed) throw new Error("ALREADY_CORRECTED");
        acc = e0.paidFrom || rc.paidFrom || srcPick || null;
        if(!acc) throw new Error("PAID_FROM_REQUIRED");           // لا تخمين
        oldAmt=r2v(e0.amount||0);
        // عكس الأصل: إرجاع المبلغ القديم للحساب
        if(acc==="company") company=r2v(company+oldAmt); else revenue=r2v(revenue+oldAmt);
        e0.reversed=true; e0.correctedAt=new Date().toISOString(); e0.correctedBy=S.user;
        // خصم المبلغ الصحيح
        const cur=acc==="company"?company:revenue;
        if(amt>cur) throw new Error("INSUFFICIENT|"+acc+"|"+cur+"|"+amt);
        if(acc==="company") company=r2v(company-amt); else revenue=r2v(revenue-amt);
        data.expenses.push({id:opId, opId:opId, desc:(newDesc||e0.desc||"")+" (مصحّحة)",
          amount:amt, date:e0.date||todayISO(), category:e0.category||"", paidFrom:acc,
          correctedFrom:String(e0.id), by:e0.by||S.user, createdBy:S.user, createdByUid:S.uid||null,
          approvedBy:S.user, approvedAt:new Date().toISOString()});
      }
      const fin={company,revenue};
      try{ addLog&&addLog(data, userName(S.user)+" صحّح عملية: "+(rc.desc||R_TYPE)+" — من "+oldAmt.toLocaleString()+" إلى "+amt.toLocaleString()+" د.إ",
        {target:rc.desc||R_TYPE,field:"تصحيح عملية",oldVal:oldAmt+" د.إ",newVal:amt+" د.إ"}); }catch(e){}

      // ---- قيدان: عكس الأصل + العملية الجديدة ----
      const revDir = R_TYPE==="add_transaction" ? "debit" : "credit";   // عكس الأصل
      const midBal = R_TYPE==="add_transaction" ? r2v(open.revenue-oldAmt)
                                                : (acc==="company"?r2v(open.company+oldAmt):r2v(open.revenue+oldAmt));
      writeLedgerEntry(tx,{
        operationId:opId+"_rev", operationType:"correction_reverse:"+R_TYPE,
        account:acc, direction:revDir, amount:oldAmt,
        balanceBefore:open[acc], balanceAfter:midBal,
        monthKey, sourceCollection:"requests", sourceId:req.id,
        description:"عكس العملية الأصلية قبل التصحيح", idempotencyKey:opId+"_rev",
        reverseOf:"approve_"+req.id
      });
      writeLedgerEntry(tx,{
        operationId:opId, operationType:"correction_new:"+R_TYPE,
        account:acc, direction:R_TYPE==="add_transaction"?"credit":"debit", amount:amt,
        balanceBefore:midBal, balanceAfter:fin[acc],
        monthKey, sourceCollection:"requests", sourceId:req.id,
        description:"العملية المصحّحة — "+(newDesc||""), idempotencyKey:opId,
        reverseOf:null
      });

      tx.set(monRef,{data,_rev:mRev+1,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(balRef,{companyBalance:company,revenueBalance:revenue,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
      tx.set(reqRef,{corrected:true, correctedAt:new Date().toISOString(), correctedBy:S.user,
                     correctedAmount:amt, correctedDesc:newDesc||"",
                     correctedOperationId:opId},{merge:true});
      applied={company,revenue};
    });
    if(applied){ S.companyBalance=applied.company; S.revenueBalance=applied.revenue; }
    memClear(monthKey);
    showMsg("✓ عُكست العملية الأصلية وسُجّلت المصحّحة");
    await loadRequests(); await loadMonthOnline(req.year,req.month);
    if(req.year!==S.year||req.month!==S.month) await loadMonthOnline(S.year,S.month);
    await loadBalances(); await loadLedger(monthKey); R();
    return true;
  }catch(e){
    const m=String(e&&e.message||"");
    let t="⚠ فشل التصحيح — لم يتغير شيء";
    if(m==="ALREADY_CORRECTED")      t="⚠ هذه العملية مصحّحة مسبقاً — لم يتغير شيء";
    else if(m.startsWith("NOT_APPROVED")) t="⚠ العملية غير معتمدة — لم يتغير شيء";
    else if(m==="ENTRY_MISSING")     t="⚠ القيد غير موجود في الشهر";
    else if(m==="UNSUPPORTED")       t="⚠ هذا النوع لا يدعم التصحيح — استخدم الإلغاء";
    else if(m==="PAID_FROM_REQUIRED"){ S.corrNeedSrc=req.id; R(); t="⚠ عملية قديمة بلا حساب مسجّل — اختر الحساب أولاً"; }
    else if(m.startsWith("INSUFFICIENT")){const p=m.split("|");t="⛔ رصيد "+(ACC_AR[p[1]]||p[1])+" غير كافٍ — المتوفر "+Number(p[2]).toLocaleString()+" والمطلوب "+Number(p[3]).toLocaleString();}
    else if(m.startsWith("LEDGER_")) t="⛔ فشل قيد الدفتر — أُلغيت العملية بالكامل";
    else console.error(e);
    showMsg(t);
    try{ memClear(monthKey); await loadRequests(); await loadMonthOnline(req.year,req.month); await loadBalances(); }catch(e2){}
    R(); return false;
  }
  finally{ S.moneyOp=false; }
}
