async function rejectRequest(req){
  if(S.approving){showMsg("⏳ جاري المعالجة...");return;}
  S.approving=true;
  try{
    await runTransaction(db, async (tx)=>{
      const reqRef=doc(db,"requests",req.id);
      const snap=await tx.get(reqRef);
      if(!snap.exists()) throw new Error("REQ_MISSING");
      if((snap.data()||{}).status!=="pending") throw new Error("ALREADY_PROCESSED");
      tx.set(reqRef,{status:"rejected",rejectedAt:new Date().toISOString(),rejectedBy:S.user},{merge:true});

}


// ================= Cache جلسة مؤقت للشهور (المصدر الدائم Firestore) =================
// قاعدة: Firestore هو المصدر الوحيد. لا نسخة مستقلة على الجهاز.
// MONTHS_MEM يحمل فقط ما قُرئ من الخادم في هذه الجلسة، مع رقم مراجعة (_rev)
// يُستخدم لرفض الكتابة فوق تعديل جهاز آخر.
const MONTHS_MEM = Object.create(null);
function memGet(k){ return MONTHS_MEM[k] || null; }
function memPut(k, data, rev){ MONTHS_MEM[k] = { data, rev: Number(rev)||0, at: Date.now() }; return MONTHS_MEM[k]; }
function memRev(k){ const e=MONTHS_MEM[k]; return e ? e.rev : null; }
function memHas(k){ return !!MONTHS_MEM[k]; }
function memClear(k){ if(k) delete MONTHS_MEM[k]; else Object.keys(MONTHS_MEM).forEach(x=>delete MONTHS_MEM[x]); }

// ===== نشر الوحدات على الشهور القادمة — عبر Firestore وبمعاملة لكل شهر =====
// لا يعتمد على وجود نسخة محلية. يمس فقط الشهور الموجودة فعلاً على الخادم.
async function _mutateMonthTx(y, m, mutate){
  const k=getMonthKey(y,m);
  const ref=doc(db,"months",k);
  let touched=false;
  await runTransaction(db, async (tx)=>{
    const snap=await tx.get(ref);
    if(!snap.exists()) return;               // الشهر غير منشأ — لا ننشئه هنا
    const raw=snap.data();
    const data=normalizeData(raw.data||raw);
    const rev=Number(raw._rev)||0;
    if(mutate(data)===false) return;         // لا تغيير مطلوب
    touched=true;
    tx.set(ref,{data,_rev:rev+1,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
  });
  if(touched) memClear(k);                    // الذاكرة صارت قديمة لهذا الشهر
  return touched;
}

async function propagateNewUnit(unit, fromYear, fromMonth){
  let m=fromMonth+1, y=fromYear;
  for(let i=0;i<12;i++){
    if(m>11){m=0;y++;}
    try{
      await _mutateMonthTx(y,m,(d)=>{
        if((d.units||[]).find(u=>u.id===unit.id)) return false;
        const fresh=JSON.parse(JSON.stringify(unit));
        fresh.partitions=(fresh.partitions||[]).map(p=>({...p,status:"vacant",tenant:"",note:"فارغ",partial:false,paid_amount:0}));
        d.units.push(fresh);
      });
    }catch(e){ console.error("propagateNewUnit",getMonthKey(y,m),e); }
    m++;
  }
}

async function propagateRemoveUnit(unitId, isFull, fromYear, fromMonth){
  let m=fromMonth, y=fromYear;
  for(let i=0;i<13;i++){
    try{
      await _mutateMonthTx(y,m,(d)=>{
        const list=isFull?(d.full||[]):(d.units||[]);
        const ix=list.findIndex(u=>u.id===unitId);
        if(ix<0) return false;
        list.splice(ix,1);
      });
    }catch(e){ console.error("propagateRemoveUnit",getMonthKey(y,m),e); }
    m++;if(m>11){m=0;y++;}
  }
}

async function propagateNewFullUnit(unit, fromYear, fromMonth){
  let m=fromMonth+1, y=fromYear;
  for(let i=0;i<12;i++){
    if(m>11){m=0;y++;}
    try{
      await _mutateMonthTx(y,m,(d)=>{
        if((d.full||[]).find(u=>u.id===unit.id)) return false;
        d.full.push(initFull({...unit}));
      });
    }catch(e){ console.error("propagateNewFullUnit",getMonthKey(y,m),e); }
    m++;
  }
}

function isBeforeFirstMonth(y,m){ return Number(y)<2026 || (Number(y)===2026 && Number(m)<3); }

// انتهت مدة الدورة ولم يُتخذ إجراء (مستمر/غادر).
// لا تُعد فارغة ولا مستمرة — تبقى ظاهرة حتى يقرر الموظف.
function needsAction(x){
  if(!x)return false;
  if(x.status==="vacant"||x.status==="staff")return false;
  if(rentType(x)==="daily")return false;
  const end=x.contract_end||"";
  if(!end)return false;
  return todayISO()>=end;
}

function paidValue(x){
  const rent=Number(x?.rent||0), paid=Number(x?.paid_amount||0);
  if(x?.status==="staff"||x?.status==="vacant")return 0;
  if(x?.partial)return Math.max(0,Math.min(paid,rent||paid));
  if(x?.status==="collected")return rent || paid;
  return 0;
}
function remainingValue(x){return Math.max(0,Number(x?.rent||0)-paidValue(x));}
// التسليم بين الموظفين يُحتسب فقط بعد تأكيد المستلم.
// السجلات القديمة بدون حقل status تُعتبر مؤكدة (توافق رجعي).
function hvConfirmed(x){return (x&&(x.status||"confirmed"))==="confirmed";}
function isPartialPaid(x){return !!x?.partial && (Number(x?.rent||0)>0 || Number(x?.paid_amount||0)>0) && remainingValue(x)>0;}
function moneyText(n){return Number(n||0).toLocaleString();}
function todayISO(){return new Date().toISOString().slice(0,10);}
function addMonthsISO(dateStr, months=1){
  if(!dateStr)return "";
  const d=new Date(dateStr+"T00:00:00");
  if(isNaN(d))return "";
  const day=d.getDate();
  d.setMonth(d.getMonth()+months);
  if(d.getDate()<day)d.setDate(0);
  return d.toISOString().slice(0,10);
}
function isDatePast(dateStr){
  if(!dateStr)return false;
  return dateStr < todayISO();
}
function rentType(x){
  return x?.rent_type || x?.rentType || (x?.note==="يومي" ? "daily" : "monthly");
}
function rentTypeText(x){return rentType(x)==="daily"?"يومي":"شهري";}
function dueDateOf(x){
  // الدفع مقدّم: الإيجار اليومي يُستحق من تاريخ الدخول وليس تاريخ الخروج
  if(rentType(x)==="daily")return x?.start_date || x?.due_date || "";
  // الاستحقاق الدائم: يوم الدخول هو "يوم الرسو" — يُحتسب لنفس اليوم من الشهر المعروض تلقائياً
  // مثال: دخل 12-06 → استحقاقه 12 من كل شهر للأبد بدون تعديل يدوي
  const anchor=x?.start_date || x?.due_date || "";
  if(!anchor)return x?.due_date || "";
  const anchorDay=Number(anchor.slice(8,10))||1;
  const lastDay=new Date(S.year,S.month+1,0).getDate();
  const day=Math.min(anchorDay,lastDay);
  const mm=(S.month+1)<10?"0"+(S.month+1):""+(S.month+1);
  const dd=day<10?"0"+day:""+day;
  return S.year+"-"+mm+"-"+dd;
}
function dateInfoText(x){
  if(rentType(x)==="daily"){
    if(x?.start_date||x?.end_date)return "يومي: "+(x.start_date||"—")+" إلى "+(x.end_date||"—");
    return "إيجار يومي";
  }
  const due=dueDateOf(x);
  if(x?.start_date||due)return "شهري: من "+(x.start_date||"—")+" · الاستحقاق "+(due||"—");
  return "إيجار شهري";
}

function displayStatus(x){
  const st=x?.status || "late";
  // فارغ/موظفين لهما الأولوية المطلقة
  if(st==="vacant"||st==="staff")return st;
  // دفعة جزئية حقيقية (مبلغ مسجّل فعلاً ومتبقٍ > 0) تتقدّم على وسم "محصّل" اليدوي
  // حتى لا يختفي المتبقي من شاشات المتابعة.
  // شرط paid>0 يحمي البيانات القديمة المتناقضة (محصّل + partial بدون مبلغ) من التغيّر.
  if(isPartialPaid(x) && Number(x?.paid_amount||0)>0)return "partial";
  if(st==="collected")return "collected";
  if(isPartialPaid(x))return "partial";
  // انتهت الدورة ولم يُتخذ إجراء — لا متأخر ولا لم يحل عليه
  if(needsAction(x))return "expired";
  // تلقائي حسب تاريخ الاستحقاق: لم يصل الموعد = "لم يحل عليه"، تجاوزه = "متأخر"
  // شهر انتهى فعلاً لا يمكن أن يحتوي "لم يحل عليه" — كل غير محصّل فيه = متأخر
  const _monthEnded=(S.year<NOW_Y)||(S.year===NOW_Y&&S.month<NOW_M);
  if(_monthEnded)return "late";
  const due=dueDateOf(x);
  if(due && !isDatePast(due))return "pending";
  return "late";
}

// ===== لقطة القيم قبل التعديل + بناء الفروق فقط =====
// الهدف: إرسال الحقول المتغيّرة فقط مع قيمها القديمة، ليصح إلغاء الاعتماد لاحقاً.
function _snapFor(key, obj){
  if(S._snapKey!==key){ S._snapKey=key; try{ S._snap=JSON.parse(JSON.stringify(obj)); }catch(e){ S._snap={...obj}; } }
  return S._snap||{};
}
function _diffFields(cur, snap){
  const fields={}, originalFields={};
  const keys=new Set([...Object.keys(cur||{}), ...Object.keys(snap||{})]);
  keys.forEach(k=>{
    if(k==="partitions"||k==="version") return;
    const a=cur?cur[k]:undefined, b=snap?snap[k]:undefined;
    const na=(a===undefined||a===null)?"":a, nb=(b===undefined||b===null)?"":b;
    if(typeof na==="object"||typeof nb==="object"){ if(JSON.stringify(na)!==JSON.stringify(nb)){fields[k]=a;originalFields[k]=b;} return; }
    if(String(na)!==String(nb)){ fields[k]=a; originalFields[k]=b; }
  });
  return {fields, originalFields, count:Object.keys(fields).length};
}

// ===== تحقق الحجوزات اليومية =====
// يمنع: نهاية قبل البداية · تداخل حجزين لنفس البارتشن · الحجز على وحدة مؤجرة شهرياً
function _bookingOverlap(a,b){ return a.startDate < b.endDate && b.startDate < a.endDate; }
function validateBooking(data, booking, allParts){
  if(!booking.startDate||!booking.endDate) return "أدخل تاريخي البداية والنهاية";
  if(booking.endDate<=booking.startDate)   return "تاريخ النهاية يجب أن يكون بعد البداية";
  const amt=Number(booking.total);
  if(!isFinite(amt)||amt<=0)               return "المبلغ غير صالح";
  // تداخل مع حجز قائم على نفس البارتشن (الملغى والمسترجع لا يحجزان التاريخ)
  const clash=((data&&data.dailyBookings)||[]).find(x=>
    String(x.partId)===String(booking.partId) &&
    String(x.id)!==String(booking.id) &&
    x.status!=="cancelled" && x.status!=="refunded" &&
    _bookingOverlap(x,booking));
  if(clash) return "تعارض مع حجز قائم: "+(clash.guest||"—")+" ("+clash.startDate+" إلى "+clash.endDate+")";
  // البارتشن مؤجّر شهرياً وغير فارغ
  const src=(allParts||[]).find(p=>String(p.id)===String(booking.partId));
  const obj=src&&src.obj;
  if(obj){
    const ds=displayStatus(obj);
    const isDailyUnit=(obj.note==="يومي")||(obj.rent_type==="daily");
    if(!isDailyUnit && ds!=="vacant") return "هذا البارتشن مؤجّر شهرياً — لا يمكن الحجز اليومي عليه";
  }
  return null;
}

// ================= طبقة الحساب المركزية (CALC) =================
// مصدر واحد للحقيقة لكل رقم مالي. أي شاشة تحسب بنفسها = مصدر خلل.
// التعريفات هنا منقولة حرفياً من المنطق المقصود القائم — لم يُغيَّر أي تعريف.
const CALC = (function(){
  const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
  const r2  = v => Math.round(num(v)*100)/100;
  const allItems = d => [
    ...((d&&d.units)||[]).flatMap(u=>(u.partitions||[]).map(p=>p)),
    ...(((d&&d.full)||[]).map(u=>u))
  ];
  // المبلغ المقبوض فعلياً على وحدة واحدة
  function received(x){
    const ds = displayStatus(x);
    const paid = num(x.paid_amount), rent = num(x.rent);
    if(x.partial && paid>0 && paid<rent) return paid;
    if(ds==="collected") return rent;
    if(ds==="partial")   return paid;
    return 0;
  }
  // هل تدخل الوحدة في المستهدف؟ (القاعدة المقصودة: يُستثنى الفارغ والموظفون والدورة المنتهية)
  function inTarget(x){
    const ds = displayStatus(x);
    return ds!=="vacant" && ds!=="staff" && ds!=="expired";
  }
  // الحجوزات تُدفع مقدماً: المؤكد/المدفوع فقط يدخل الدخل والمحصّل.
  // pending (غير مدفوع) و cancelled و refunded لا تدخل إطلاقاً.
  // الحجز يُدفع مقدماً. الحالة وحدها لا تحدد الرقم المالي:
  // ما استلمناه فعلاً = paid − refund. الإلغاء بلا استرداد يبقي الإيراد كاملاً.
  // الدفع مثبت بـwasPaid المحفوظ عند الإلغاء أو بـpaidAt — **لا يُستدل بالمبلغ**.
  // حجز pending بمبلغ 1000 أُلغي بلا استرداد يبقى صفراً، لأنه لم يُدفع أصلاً.
  function bookingWasPaid(b){
    if(!b) return false;
    const st=b.status;
    if(st==="pending") return false;
    if(st==="paid"||st==="confirmed") return !!b.paidAt;
    if(st==="cancelled"||st==="refunded"){
      if(typeof b.wasPaid==="boolean") return b.wasPaid;   // المحفوظ لحظة الإلغاء
      return !!b.paidAt;                                    // ولا شيء غيره
    }
    return true;   // حجز قديم بلا حالة = مدفوع (توافق رجعي)
  }
  // صافي ما بقي عندنا من الحجز
  function bookingNet(b){
    if(!bookingWasPaid(b)) return 0;
    return Math.max(0, r2(num(b.total) - num(b.refundAmount)));
  }
  function dailyTotal(d){
    return r2(((d&&d.dailyBookings)||[]).reduce((s,b)=>s+bookingNet(b),0));
  }
  function dailyGross(d){
    return r2(((d&&d.dailyBookings)||[]).filter(bookingWasPaid).reduce((s,b)=>s+num(b.total),0));
  }
  function dailyPendingTotal(d){
    return r2(((d&&d.dailyBookings)||[]).filter(b=>b&&b.status==="pending").reduce((s,b)=>s+num(b.total),0));
  }
  function dailyRefunded(d){
    return r2(((d&&d.dailyBookings)||[]).reduce((s,b)=>s+num(b&&b.refundAmount),0));
  }


  function target(d){
    let t=0; allItems(d).forEach(x=>{ if(inTarget(x)) t+=num(x.rent); });
    return r2(t + dailyTotal(d));
  }
  function collected(d){
    let c=0; allItems(d).forEach(x=>{ c+=received(x); });
    return r2(c + dailyTotal(d));
  }
  // الإيداعات المعتمدة المسجّلة في transactions (تشمل التحويلات البنكية بعد اعتمادها)
  function deposited(d){ return r2((((d&&d.transactions)||[]).filter(t=>!t.reversed).reduce((s,t)=>s+num(t.amount),0))); }
  // تحويلات بنكية محصّلة لكن لم يعتمدها المدير بعد — ليست كاشاً بيد أحد
  function bankPending(d){
    let b=0;
    if(typeof BANK_PAY_MEM!=="undefined")
      b+=(BANK_PAY_MEM.list||[]).filter(x=>x.status==="pending").reduce((s,x)=>s+num(x.amount),0);
    return r2(b);
  }
  function bankApproved(d){
    let b=0;
    if(typeof BANK_PAY_MEM!=="undefined")
      b+=(BANK_PAY_MEM.list||[]).filter(x=>x.status==="approved").reduce((s,x)=>s+num(x.amount),0);
    return r2(b);
  }
  // الإيداع المعتمد فقط. التحويل البنكي المعلّق ليس إيداعاً ولا يرفع الرصيد،
  // ويُعرض في بطاقة مستقلة "تحويلات بنكية بانتظار الاعتماد".
  function depositedTotal(d){ return deposited(d); }
  function gap(d){ return r2(target(d) - depositedTotal(d)); }
  function remaining(d){ return Math.max(0, gap(d)); }
  function surplus(d){ return Math.max(0, -gap(d)); }
  function late(d){
    let v=0; allItems(d).forEach(x=>{ if(displayStatus(x)==="late") v+=num(x.rent); });
    return r2(v);
  }
  function notDue(d){
    let v=0; allItems(d).forEach(x=>{ if(displayStatus(x)==="pending") v+=num(x.rent); });
    return r2(v);
  }
  function partialRemaining(d){
    let v=0; allItems(d).forEach(x=>{
      const ds=displayStatus(x), paid=num(x.paid_amount), rent=num(x.rent);
      if(ds==="expired") return;
      if((x.partial && paid>0 && paid<rent) || ds==="partial") v+=Math.max(0, rent-paid);
    });
    return r2(v);
  }
  function expiredTotal(d){
    let v=0; allItems(d).forEach(x=>{ if(displayStatus(x)==="expired") v+=num(x.rent); });
    return r2(v);
  }
  function vacantTotal(d){
    let v=0; allItems(d).forEach(x=>{ if(displayStatus(x)==="vacant") v+=num(x.rent); });
    return r2(v);
  }
  // محصّل لم يودع — كاش بيد الفريق
  // ===== مصادر KPI المركزية =====
  // الاستردادات: من حساب (revenue/company) تُطرح من المودع.
  // الاسترداد من العهدة لا يُطرح هنا لأنه ينقص العهدة أصلاً — وإلا طُرح مرتين.
  function grossDeposited(d){ return deposited(d); }
  function collectionRefunds(d){
    return r2(((d&&d.dailyBookings)||[])
      .filter(b=>b && b.refundFrom && b.refundFrom!=="custody")
      .reduce((s,b)=>s+num(b.refundAmount),0));
  }
  function custodyRefunds(d){
    return r2(((d&&d.dailyBookings)||[])
      .filter(b=>b && b.refundFrom==="custody")
      .reduce((s,b)=>s+num(b.refundAmount),0));
  }
  function netDepositedForKPI(d){ return r2(grossDeposited(d) - collectionRefunds(d)); }
  // «محصّل لم يودع» = العهدة الحقيقية فقط. لا collected−deposited.
  function undeposited(d){ return employeeHoldingTotal(d); }
  function expenses(d){
    const e=(d&&d.expenses)||[], um=(d&&d.unitMaintenance)||[], fm=(d&&d.facilityMaintenance)||[];
    return r2([...e,...um,...fm].filter(x=>!x.reversed).reduce((s,x)=>s+num(x.amount),0));
  }
  function liquidity(bal){ return r2(num(bal.companyBalance)+num(bal.revenueBalance)+num(bal.installmentBalance)); }
  // عهدة موظف: (ما حصّله كاشاً) + (استلم من زملاء) - (سلّم لزملاء) - (ما أودعه)
  function custody(d, user){
    // كل المقارنات عبر userKeyOf: مفاتيح البيانات القديمة وUID كلاهما يُطابق
    const U=(typeof userKeyOf==="function")?userKeyOf(user):user;
    const eq=(v)=>{ const k=(typeof userKeyOf==="function")?userKeyOf(v):v; return !!k && k===U; };
    let recv=0;
    allItems(d).forEach(x=>{ if(eq(x.collectedBy) && x.collectionMethod!=="bank") recv+=received(x); });
    // الحجز الكاش يدخل عهدة من استلمه بمبلغه الكامل،
    // ولا يُخصم منه إلا ما رُدّ فعلاً من العهدة — لا يُمسح بمجرد الإلغاء.
    ((d&&d.dailyBookings)||[]).forEach(b=>{
      if(!bookingWasPaid(b)) return;
      if(b.paymentMethod==="bank") return;
      if(!eq(b.collectedBy||b.by)) return;
      recv+=num(b.total);
      if(b.refundFrom==="custody") recv-=num(b.refundAmount);
    });
    const hv=((d&&d.handovers)||[]).filter(x=>x.status==="confirmed");
    const hvIn  = hv.filter(x=>eq(x.to)).reduce((s,x)=>s+num(x.amount),0);
    const hvOut = hv.filter(x=>eq(x.from)).reduce((s,x)=>s+num(x.amount),0);
    // الإيداع البنكي المعتمد لا يمر بعهدة أحد — يُستثنى بـbankRef أو bankPaymentId
    const dep   = ((d&&d.transactions)||[])
                    .filter(t=>eq(t.by) && !t.bankRef && !t.bankPaymentId && !t.reversed)
                    .reduce((s,t)=>s+num(t.amount),0);
    return { received:r2(recv), handoverIn:r2(hvIn), handoverOut:r2(hvOut), deposited:r2(dep),
             remaining:r2(recv+hvIn-hvOut-dep) };
  }

  // ===== المعادلة الأساسية: المحصّل الفعلي = المودع + عهدة الموظفين =====
  // التحويل البنكي المعلّق خارج الطرفين، ويُعرض في بطاقة مستقلة.
  function staffKeys(){ return Object.keys(USERS).filter(k=>USERS[k]&&USERS[k].role!=="owner"); }
  // ===== محصّل ولم يودع — رقم واحد للفريق بلا نسبة لأي موظف =====
  // = ما استُلم فعلاً − ما أُودع − التحويلات البنكية المعلّقة (ليست كاشاً بيد أحد).
  // لا يعتمد على collectedBy إطلاقاً، فالمبلغ بلا اسم موظف يُحتسب أيضاً.
  function employeeHoldingTotal(d){
    return r2(Math.max(0, collected(d) - deposited(d) - bankPending(d)));
  }
  function actualCollected(d){ return r2(netDepositedForKPI(d) + employeeHoldingTotal(d)); }
  function collectionRate(d){
    const T=target(d);
    if(!(T>0)) return 0;
    return Math.round((actualCollected(d)/T)*1000)/10;
  }

  // معادلة التوازن — نفس البنود المقصودة، بلا قص
  function balanceCheck(d){
    // بنود منفصلة من مصادر مركزية فقط — bankPending ليس ضمن «عند الموظفين»
    const T=target(d);
    const DEP=netDepositedForKPI(d);
    const HOLD=employeeHoldingTotal(d);
    const BANKP=bankPending(d);
    const L=late(d), P=notDue(d), PR=partialRemaining(d);
    const sum=r2(DEP+HOLD+BANKP+L+P+PR);
    return { target:T, deposited:DEP, holding:HOLD, bankPending:BANKP,
             late:L, notDue:P, partialRem:PR, undeposited:HOLD,
             sum:sum, diff:r2(T-sum), balanced:Math.abs(r2(T-sum))<1 };
  }

  return { num, r2, received, inTarget, allItems, target, collected, deposited, depositedTotal,
           bookingWasPaid, bookingNet, dailyGross, dailyPendingTotal, dailyRefunded,
           employeeHoldingTotal, actualCollected, collectionRate, staffKeys,
           grossDeposited, collectionRefunds, custodyRefunds, netDepositedForKPI,
           bankPending, bankApproved, gap, remaining, surplus, late, notDue, partialRemaining,
           expiredTotal, vacantTotal, undeposited, expenses, liquidity, custody, balanceCheck, dailyTotal };
})();

// ========== المستخدمون والأدوار ==========
// لا أسماء ولا أدوار ولا أرقام PIN ثابتة في HTML.
// قائمة شاشة الدخول تأتي من listPinUsers، والملف الكامل يأتي من users/{uid} بعد المصادقة.
const USERS={};
// خريطة UID → userKey تُبنى من users/{uid}
const UID_TO_KEY={};

// ===== الدالة المركزية: تقبل UID أو مفتاحاً قديماً وترجع المفتاح الصحيح =====
// تُستخدم في العهدة والإيداعات والتسليمات وكل مقارنة مستخدم.
function userKeyOf(value){
  if(!value) return null;
  const v=String(value);
  if(USERS[v]) return v;
  if(UID_TO_KEY[v]) return UID_TO_KEY[v];
  return v;                            // مجهول — يُعاد كما هو بدل إسقاطه
}
function sameUser(a,b){ const x=userKeyOf(a), y=userKeyOf(b); return !!x && x===y; }
function userName(value){ const k=userKeyOf(value); return (USERS[k]&&USERS[k].name)||k||"—"; }
function canonicalValue(v){
  if(Array.isArray(v))return v.map(canonicalValue);
  if(v&&typeof v==="object")return Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonicalValue(v[k])]));
  return v;
}
function sameSnapshot(a,b){return JSON.stringify(canonicalValue(a))===JSON.stringify(canonicalValue(b));}
function hasCapability(name,key){
  const k=key||S.user, c=USERS[k]?.capabilities||{};
  return c[name]===true || (name==="monthWindow" && Number(c.monthWindow)>0);
}

async function loadUserProfile(uid){
  const snap=await getDoc(doc(db,"users",uid));
  if(!snap.exists()) throw new Error("NO_PROFILE");
  const p=snap.data()||{};
  if(p.active===false) throw new Error("INACTIVE");
  if(!p.userKey || !/^[A-Za-z0-9_-]{1,40}$/.test(String(p.userKey))) throw new Error("NO_USERKEY");
  USERS[p.userKey]={name:p.name||p.userKey,role:p.role==="owner"?"owner":"emp",firebaseRole:p.role||"employee",capabilities:p.capabilities||{}};
  return p;
}
async function loadUidMap(){
  try{
    const snap=await getDocs(collection(db,"users"));
    snap.docs.forEach(d=>{ const v=d.data()||{};
      if(v.userKey) UID_TO_KEY[d.id]=v.userKey;
      if(v.userKey) USERS[v.userKey]={name:v.name||v.userKey,role:v.role==="owner"?"owner":"emp",firebaseRole:v.role||"employee",capabilities:v.capabilities||{}}; });
  }catch(e){ console.error("loadUidMap",e); }
}
async function afterSignIn(uid, prof){
  const systemSnap=await getDoc(doc(db,"config","system"));
  if(!systemSnap.exists()||systemSnap.data()?.financialMigrationV11?.completed!==true)throw new Error("MIGRATION_REQUIRED");
  S.uid=uid;
  S.userKey=prof.userKey;
  S.user=prof.userKey;                 // كل الكود القديم يقرأ S.user — يبقى المفتاح القديم
  S.role=prof.role||"employee";
  await loadUidMap();
  S.screen="app";
  S.tab=S.role==="owner"?"overview":"emphome";
  S.selUnit=null; S.editPart=null;
  loadPermissions(); loadUnlock(); loadRequests(); loadCustomUnits();
  R();
  await loadMonthOnline(S.year,S.month);
  const mk=getMonthKey(S.year,S.month);
  await Promise.all([loadBankPayments(mk),loadAdjustments(mk),loadLedger(mk)]);
  await loadBalances();
  R();
}
async function loadPinUsers(){
  S.loginUsersLoading=true; S.loginUsersError=false; R();
  try{
    const call=httpsCallable(functions,"listPinUsers");
    const result=await call({});
    const rows=Array.isArray(result.data?.users)?result.data.users:[];
    S.loginUsers=rows.filter(x=>x&&x.userKey&&x.name);
    S.loginUsers.forEach(x=>{USERS[x.userKey]={name:x.name,role:"emp"};});
    if(!S.loginUsers.length) throw new Error("NO_LOGIN_USERS");
  }catch(e){
    console.error("loadPinUsers",e); S.loginUsersError=true;
  }finally{S.loginUsersLoading=false;R();}
}
async function doPinSignIn(userKey,pin){
  if(S.signingIn) return;
  S.signingIn=true; S.pinErr=false; R();
  try{
    const call=httpsCallable(functions,"pinLogin");
    const result=await call({userKey:String(userKey||""),pin:String(pin||"")});
    const token=result.data&&result.data.token;
    if(!token) throw new Error("NO_TOKEN");
    const cred=await signInWithCustomToken(auth,token);
    const prof=await loadUserProfile(cred.user.uid);
    await afterSignIn(cred.user.uid, prof);
  }catch(e){
    const c=String(e&&e.code||e&&e.message||"");
    let t="⚠ تعذّر تسجيل الدخول";
    if(c.includes("invalid-argument")||c.includes("permission-denied")||c.includes("PIN_INVALID")) t="⚠ الرقم السري غير صحيح";
    else if(c.includes("resource-exhausted")||c.includes("PIN_LOCKED")) t="⚠ محاولات كثيرة — انتظر قليلاً";
    else if(c==="NO_PROFILE") t="⚠ لا يوجد ملف صلاحيات لهذا الحساب — راجع المدير";
    else if(c==="NO_USERKEY") t="⚠ الحساب بلا userKey صحيح — راجع المدير";
    else if(c==="INACTIVE")   t="⚠ هذا الحساب موقوف";
    else if(c==="MIGRATION_REQUIRED") t="⛔ لم يكتمل ترحيل البيانات المالية — لن يفتح النظام حتى لا تختفي البيانات القديمة";
    else console.error(e);
    S.pin=""; S.pinErr=true; showMsg(t); R();
  }
  finally{ S.signingIn=false; R(); }
}
async function doSignOut(){
  try{ await signOut(auth); }catch(e){}
  S.uid=null; S.user=null; S.userKey=null; S.role=null; S.pendingUser=null; S.pin=""; S.screen="home"; memClear(); R();
}
onAuthStateChanged(auth, async (u)=>{
  if(!u){ if(S.screen==="app"){ S.uid=null;S.user=null;S.userKey=null;S.role=null;S.screen="home"; R(); } return; }
  if(S.signingIn) return; // doPinSignIn يتولى التحميل؛ يمنع تشغيل afterSignIn مرتين
  if(S.uid===u.uid) return;
  try{ const prof=await loadUserProfile(u.uid); await afterSignIn(u.uid, prof); }
  catch(e){ const c=String(e&&e.message||""); await doSignOut(); showMsg(c==="MIGRATION_REQUIRED"?"⛔ لم يكتمل ترحيل البيانات المالية":"⚠ حسابك بلا صلاحيات مسجّلة"); }
});

let CUSTOM_UNITS_MEM=null; // يُملأ من Firestore فقط
function getCustomUnits(){
  return CUSTOM_UNITS_MEM || {units:[],full:[]};
}


function registerCustomUnit(unit,isFull,fromYear,fromMonth){
  const cu=getCustomUnits();
  const entry={...unit,_fromY:fromYear,_fromM:fromMonth,_removedY:null,_removedM:null};
  if(isFull){
    if(!cu.full.find(u=>u.id===unit.id))cu.full.push(entry);
  } else {
    if(!cu.units.find(u=>u.id===unit.id))cu.units.push(entry);
  }
  CUSTOM_UNITS_MEM=cu;
  return setDoc(doc(db,"config","customUnits"),{data:cu,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true})
    .catch(e=>{ console.error(e); showMsg("⚠ تعذّر حفظ الوحدات المخصّصة على السيرفر"); });
}

// Mark a custom unit as removed from a specific month onwards
function removeCustomUnit(unitId,isFull,fromYear,fromMonth){
  const cu=getCustomUnits();
  const list=isFull?cu.full:cu.units;
  const entry=list.find(u=>u.id===unitId);
  if(entry){
    entry._removedY=fromYear;
    entry._removedM=fromMonth;
    CUSTOM_UNITS_MEM=cu;
    return setDoc(doc(db,"config","customUnits"),{data:cu,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true})
      .catch(e=>{ console.error(e); showMsg("⚠ تعذّر حفظ الوحدات المخصّصة على السيرفر"); });
  }
}

// Check if a custom unit should appear in a given month
function customUnitActiveIn(entry,y,m){
  const monthVal=y*12+m;
  const fromVal=(entry._fromY!=null)?entry._fromY*12+entry._fromM:0;
  if(monthVal<fromVal)return false; // before it was added
  if(entry._removedY!=null){
    const remVal=entry._removedY*12+entry._removedM;
    if(monthVal>=remVal)return false; // removed from this month onwards
  }
  return true;
}

    if(snap.exists()){
      const data=snap.data().data||snap.data();
      if(data&&data.units)CUSTOM_UNITS_MEM=data;
    }
  }catch(e){}
}

// ========== الترحيل من الشهر السابق (carry-v1) ==========
// الهدف: بقاء "تاريخ الدخول" (المرساة) وبيانات المستأجر، فيحتسب dueDateOf استحقاق كل شهر تلقائياً.
// قاعدة صارمة: لا يُرحَّل أي مبلغ أو حالة تحصيل — كل شهر يبدأ بمقبوض صفر.
function prevMonthYM(y,m){ return m===0 ? [y-1,11] : [y,m-1]; }
function prevMonthKeyOf(y,m){ const a=prevMonthYM(y,m); return getMonthKey(a[0],a[1]); }
// بيانات الساكن والعقد فقط — لا شيء مالي
const CARRY_FIELDS=["tenant","phone","deposit","note","rent","rent_type","start_date","due_date","contract_end","collectionMethod","elec_amount","cycle_anchor","cycle_i","renewStamp"];
// بند فارغ تماماً = لا أثر عمل فيه. شرط عدم المساس بأي بيانات موجودة.
function _isBlankItem(x){
  if(!x)return true;
  return !x.tenant && !x.start_date && !Number(x.paid_amount||0) && !x.collectedBy;
}
// شهر فارغ تماماً: لا مستأجرين ولا أي عملية مالية
function isBlankMonth(d){
  if(!d)return false;
  if((d.transactions||[]).length||(d.expenses||[]).length||(d.profits||[]).length||
     (d.installments||[]).length||(d.dailyBookings||[]).length||
     (d.unitMaintenance||[]).length||(d.facilityMaintenance||[]).length)return false;
  const all=(d.units||[]).flatMap(u=>u.partitions||[]).concat(d.full||[]);
  if(all.length===0)return false;
  return all.every(function(x){return _isBlankItem(x);});
}
// ✓ مستمر: يتقدّم بالدورة شهراً واحداً ويصفّر تحصيل الفترة الجديدة.
// idempotent: لو ضُغط مرتين لا تتقدّم الدورة مرتين (renewStamp يحمل نهاية الدورة المعتمدة).
function renewCycle(x){
  if(!x)return false;
  const anchor=x.cycle_anchor||x.start_date||"";
  if(!anchor)return false;
  // منع الترحيل المكرر: لا تجديد إلا لدورة انتهت فعلاً.
  // بعد أول ضغطة تصير النهاية في المستقبل، فالضغطة الثانية تُرفض تلقائياً.
  if(!needsAction(x))return false;
  const i=(Number(x.cycle_i)||0)+1;
  const newStart=addMonthsISO(anchor,i);
  x.cycle_anchor=anchor;
  x.cycle_i=i;
  x.start_date=newStart;
  x.contract_end=addMonthsISO(anchor,i+1);
  x.due_date=x.contract_end;   // الاستحقاق = موعد التجديد القادم
  x.renewStamp=newStart;
  // تصفير تحصيل الفترة الجديدة
  x.status="late"; x.paid_amount=0; x.partial=false;
  x.collectedBy=""; x.collectedAt=""; x.elec_paid=false;
  return true;
}

// رقم الدورة الموافق لشهر معيّن — يُحسب من المرساة الأصلية لا بالتراكم،
// فلا ينجرف التاريخ في الأشهر القصيرة ولا عند تخطّي شهر كامل.
function cycleIndexFor(anchor,y,m){
  if(!anchor)return 0;
  const ay=Number(anchor.slice(0,4)), am=Number(anchor.slice(5,7))-1;
  if(!ay)return 0;
  return Math.max(0,(Number(y)-ay)*12+(Number(m)-am));
}
// ينسخ بيانات المستأجر والسعر من prev إلى data. يعيد true إن تم.
function applyCarryForward(data,prev,y,m){
  if(!prev||!Array.isArray(prev.units))return false;
  const apply=function(dst,src){
    if(!src||!dst)return;
    if(!_isBlankItem(dst))return;                     // فيه عمل فعلي — لا نقترب إطلاقاً
    // السعر ينتقل دائماً (حتى للفارغة) — يبقى آخر سعر محفوظ في Firestore
    if(src.rent!=null)dst.rent=Number(src.rent)||0;
    if(src.rent_type)dst.rent_type=src.rent_type;
    if(src.status==="staff"){ dst.status="staff"; dst.note=src.note||dst.note||"موظفين"; return; }
    if(src.status==="vacant"){ dst.status="vacant"; dst.tenant=""; dst.note=src.note||""; return; }
    CARRY_FIELDS.forEach(function(f){ if(src[f]!==undefined&&src[f]!=="")dst[f]=src[f]; });
    // تقدّم الدورة تلقائياً: بداية الدورة الجديدة = نهاية السابقة، والنهاية = بعدها بشهر
    // الدورة تُنقل كما هي — لا تتقدّم تلقائياً.
    // التقدّم يحدث فقط بضغطة "✓ مستمر" (renewCycle)، فلا يُرحَّل مَن غادر بالخطأ.
    if((src.rent_type||rentType(src))!=="daily"){
      dst.cycle_anchor=src.cycle_anchor||src.start_date||"";
      dst.cycle_i=Number(src.cycle_i)||0;
    }
    // التحصيل يبدأ من صفر — لا يُرحَّل أبداً
    dst.status="late"; dst.paid_amount=0; dst.partial=false;
    dst.collectedBy=""; dst.collectedAt=""; dst.elec_paid=false;
    delete dst.lastRenewedKey;
  };
  (data.units||[]).forEach(function(u){
    const pu=(prev.units||[]).find(function(x){return String(x.id)===String(u.id);});
    if(!pu)return;
    (u.partitions||[]).forEach(function(p){
      apply(p,(pu.partitions||[]).find(function(x){return String(x.id)===String(p.id);}));
    });
  });
  (data.full||[]).forEach(function(f){
    apply(f,(prev.full||[]).find(function(x){return String(x.id)===String(f.id);}));
  });
  data.monthInitMode="carry-v1";
  data.carriedFrom=prev._key||"";
  return true;
}
// يقرأ وثيقة شهر من Firebase (أدق من نسخة الجهاز)
async function fetchMonthDoc(y,m){
  try{
    const s=await getDoc(doc(db,"months",getMonthKey(y,m)));
    if(s.exists()){
      const d=normalizeData(s.data().data||s.data());
      d._key=getMonthKey(y,m);
      return d;
    }
  }catch(e){}
  return null;
}
// يبحث عن أقرب شهر سابق فيه بيانات فعلية (يتخطى الأشهر الفارغة، حتى 3 أشهر للخلف)
async function fetchPrevForCarry(y,m){
  let py=y, pm=m;
  for(let i=0;i<3;i++){
    if(pm===0){pm=11;py--;}else{pm--;}
    if(isBeforeFirstMonth(py,pm))return null;
    const d=await fetchMonthDoc(py,pm);
    if(d&&!isBlankMonth(d))return d;
  }
  return null;
}

function createZeroMonthData(y,m){
  // هيكل عرض فقط عند عدم تحميل الشهر. لا يحتوي أي وحدة أو سعر أو مستأجر ثابت في الكود.
  return {
    monthInitMode:"zero-v2",
    units:[], full:[],
    expenses:[],
    transactions:[],
    profits:[],
    installments:[],
    logs:[]
  };
}

function createMonthFromPrevious(prev,y,m){
  if(!prev||!Array.isArray(prev.units)||!Array.isArray(prev.full))throw new Error("NO_MONTH_SOURCE");
  const resetItem=(src)=>{
    const x=JSON.parse(JSON.stringify(src||{}));
    x.paid_amount=0; x.partial=false; x.collectedBy=""; x.collectedAt=""; x.elec_paid=false;
    x.status=src.status==="staff"?"staff":src.status==="vacant"?"vacant":"late";
    delete x.lastRenewedKey;
    return x;
  };
  const data={
    monthInitMode:"carry-v2-firestore",
    carriedFrom:prev._key||prevMonthKeyOf(y,m),
    units:(prev.units||[]).map(u=>({...JSON.parse(JSON.stringify(u)),partitions:(u.partitions||[]).map(resetItem)})),
    full:(prev.full||[]).map(resetItem),
    expenses:[],transactions:[],profits:[],installments:[],logs:[],
    unitMaintenance:[],facilityMaintenance:[],dailyBookings:[],handovers:[]
  };
  return normalizeData(data);
}

function getMonthData(y,m){
  // يقرأ فقط ما قُرئ من الخادم في هذه الجلسة. لا يقرأ نسخة قديمة من الجهاز إطلاقاً.
  // إن لم يكن الشهر محمّلاً، يُعاد هيكل فارغ للعرض فقط ولا يُحفظ.
  const k=getMonthKey(y,m);
  const e=memGet(k);
  if(e&&e.data)return e.data;
  return createZeroMonthData(y,m);
}

function isMonthLoaded(y,m){ return memHas(getMonthKey(y,m)); }


function normalizeData(data){
  data.units=data.units||[];
  data.units.forEach(u=>{
    u.partitions=(u.partitions||[]).map(p=>{
      if(!p.rent_type)p.rent_type=rentType(p);
      if(p.start_date===undefined)p.start_date="";
      if(p.end_date===undefined)p.end_date="";
      if(p.due_date===undefined)p.due_date=p.start_date?addMonthsISO(p.start_date,1):"";
      return p;
    });
  });
  data.full=(data.full||[]).map(f=>{
    if(f.start_date===undefined)f.start_date="";
    if(f.due_date===undefined)f.due_date=f.start_date?addMonthsISO(f.start_date,1):"";
    return f;
  });
  data.expenses=data.expenses||[];
  data.transactions=data.transactions||[];
  data.profits=data.profits||[];
  data.installments=data.installments||[];
  data.logs=data.logs||[];
  return data;
}

function addLog(data, text, details){
  if(!S.user || !data)return;
  data.logs=data.logs||[];
  const entry={id:Date.now()+Math.random(),user:S.user,name:USERS[S.user]?.name||S.user,text,at:new Date().toISOString()};
  // details = {target, field, oldVal, newVal} for structured audit
  if(details){
    if(details.target!=null)entry.target=details.target;
    if(details.field!=null)entry.field=details.field;
    if(details.oldVal!=null)entry.oldVal=String(details.oldVal);
    if(details.newVal!=null)entry.newVal=String(details.newVal);
  }
  data.logs.unshift(entry);
  data.logs=data.logs.slice(0,200);
}

function timeAgo(iso){
  try{
    const d=new Date(iso), diff=Math.floor((Date.now()-d.getTime())/1000);
    if(diff<60)return "الآن";
    if(diff<3600)return Math.floor(diff/60)+" دقيقة";
    if(diff<86400)return Math.floor(diff/3600)+" ساعة";
    return d.toLocaleDateString("ar-AE");
  }catch(e){return "";}
}

function mergeCustomUnits(data, y, m){
  // دمج غير هدّام: يضيف الوحدات النشطة الناقصة فقط.
  // لا يحذف وحدة موجودة تلقائياً بسبب اختلاف سجل customUnits؛ الحذف الصريح له مساره الموثق.
  const cu=getCustomUnits();
  let changed=false;
  // Add active custom partition-units
  cu.units.forEach(u=>{
    const active=customUnitActiveIn(u,y,m);
    const existing=data.units.find(x=>x.id===u.id);
    if(active && !existing){
      const fresh=JSON.parse(JSON.stringify(u));
      delete fresh._fromY;delete fresh._fromM;delete fresh._removedY;delete fresh._removedM;
      fresh.partitions=(fresh.partitions||[]).map(p=>({...p,status:"vacant",tenant:"",note:"فارغ",partial:false,paid_amount:0,start_date:"",end_date:"",due_date:""}));
      data.units.push(fresh);changed=true;
    }
  });
  // Add active custom full-units
  cu.full.forEach(u=>{
    const active=customUnitActiveIn(u,y,m);
    const existing=data.full.find(x=>x.id===u.id);
    if(active && !existing){
      const fresh=JSON.parse(JSON.stringify(u));
      delete fresh._fromY;delete fresh._fromM;delete fresh._removedY;delete fresh._removedM;
      data.full.push(initFull(fresh));changed=true;
    }
  });
  return changed;
}

async function loadMonthOnline(y,m){
  const k=getMonthKey(y,m);
  S.syncMsg="جاري المزامنة...";
  if(!memHas(k)){S.loading=true;}
  R();
  try{
    // قاعدة حفظ البيانات: أي مستند شهر موجود يُقرأ كما هو ولا يُعاد بناؤه أو تصفيره تلقائياً.
    // البناء والترحيل التلقائي مسموحان فقط عند غياب المستند بالكامل.
    let snap;
    try{
      const {getDocFromServer}=await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
      snap=await getDocFromServer(doc(db,"months",k));
    }catch(e){ snap=await getDoc(doc(db,"months",k)); }

    if(snap.exists()){
      const raw=snap.data()||{};
      const finalData=normalizeData(raw.data||raw);
      const finalRev=Number(raw._rev)||0;
      memPut(k,finalData,finalRev);
      S.syncMsg="متصل — البيانات الأصلية محفوظة";
      S.loading=false; R(); return;
    }

    // الشهر غير موجود: عندها فقط نبنيه من أقرب شهر سابق، داخل معاملة تمنع السباق.
    let prev=null;
    if(!isAprilMonth(y,m)&&!isBeforeFirstMonth(y,m))prev=await fetchPrevForCarry(y,m);
    let finalData=null, finalRev=0, note="تم إنشاء شهر جديد من الصفر";
    await runTransaction(db,async(tx)=>{
      const ref=doc(db,"months",k);
      const cur=await tx.get(ref);
      if(cur.exists()){
        const raw=cur.data()||{};
        finalData=normalizeData(raw.data||raw);
        finalRev=Number(raw._rev)||0;
        note="متصل — أنشأه جهاز آخر";
        return;
      }
      if(!prev)throw new Error("NO_MONTH_SOURCE");
      const data=createMonthFromPrevious(prev,y,m);
      note="تم بناء الشهر من بيانات Firebase للشهر السابق";
      finalData=data; finalRev=1;
      tx.set(ref,{data,_rev:1,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),updatedBy:S.user},{merge:false});
    });
    memPut(k,finalData,finalRev);
    S.syncMsg=note;
  }catch(e){
    console.error(e);
    S.syncMsg="⚠ تعذّر الاتصال — لا تُجرِ تعديلات";
    if(!memHas(k)) showMsg("⚠ تعذّر تحميل الشهر من السيرفر — لا تعدّل حتى يعود الاتصال");
  }
  S.loading=false;
  R();
}

// ===== الحفظ: معاملة ذرّية مع فحص المراجعة — يرفض الكتابة فوق تعديل جهاز آخر =====
async function saveMonthData(y,m,data,quiet=false){
  const k=getMonthKey(y,m);
  const baseRev=memRev(k);
  if(baseRev===null){
    showMsg("⚠ هذا الشهر غير محمَّل من السيرفر — أعد التحميل قبل التعديل");
    return false;
  }
  const payload=normalizeData(data);
  S.syncMsg="جاري الحفظ...";
  if(!quiet)R();
  try{
    let newRev=baseRev+1;
    await runTransaction(db, async (tx)=>{
      const ref=doc(db,"months",k);
      const snap=await tx.get(ref);
      const serverRev=snap.exists()?(Number(snap.data()._rev)||0):0;
      // النسخة التي عُدِّلت ليست الأحدث — رفض بدل الكتابة فوق جهاز آخر
      if(serverRev!==baseRev) throw new Error("STALE|"+serverRev+"|"+baseRev);
      newRev=serverRev+1;
      tx.set(ref,{data:payload,_rev:newRev,updatedAt:serverTimestamp(),updatedBy:S.user},{merge:true});
    });
    memPut(k,payload,newRev);
    S.syncMsg="تم الحفظ أونلاين";
    if(!quiet)R();
    return true;
  }catch(e){
    const msg=String(e&&e.message||"");
    if(msg.startsWith("STALE")){
      S.syncMsg="⚠ تعارض — أُعيد تحميل الأحدث";
      showMsg("⚠ عُدِّلت البيانات من جهاز آخر — لم يُحفظ تعديلك. أُعيد تحميل النسخة الأحدث، راجعها وأعد التعديل.");
    }else{
      console.error(e);
      S.syncMsg="⚠ لم يُحفظ على السيرفر";
      showMsg("⚠ فشل الحفظ على السيرفر — لم يُطبَّق أي تغيير");
    }
    // لا يبقى تغيير وهمي: نُسقط الذاكرة ونعيد القراءة من الخادم
    memClear(k);
    await loadMonthOnline(y,m);
    return false;
  }
}

// ========== DOM HELPER ==========
function h(tag,a,c){
  const e=document.createElement(tag);
  if(a)for(const[k,v]of Object.entries(a)){
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="class")e.className=v;
    else e.setAttribute(k,v);
  }
  for(const x of(c||[])){
    if(x==null||x===false)continue;
    e.appendChild(typeof x==="string"||typeof x==="number"?document.createTextNode(String(x)):x);
  }
  return e;
}

function renderApp(){

  // allMonths توسّع نطاق الشهور المتاحة للتصفح والتعديل فقط، ولا تمنح حفظاً مالياً مباشراً.

  const dailyBlockInfo=(unitId,partId)=>{

      h("div",{style:{fontSize:"13px",fontWeight:"600",color:"#fff",marginBottom:"10px"}},["صيانة مرافق جديدة"]),
      (()=>{
        const fm={facility:"المصاعد",desc:"",amount:0,date:S.year+"-"+(S.month+1<10?"0"+(S.month+1):S.month+1)+"-01",contractor:""};
        const facSel=h("select",{style:{marginBottom:"8px"}},FACILITIES.map(f=>{const o=h("option",{value:f},[f]);if(f===fm.facility)o.selected=true;return o;}));
        facSel.addEventListener("change",e=>fm.facility=e.target.value);
        const descInp=h("input",{type:"text",placeholder:"وصف الصيانة",style:{marginBottom:"8px"}});
        descInp.addEventListener("input",e=>fm.desc=e.target.value);
        const row=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"8px"}},[
          (()=>{const i=h("input",{type:"number",placeholder:"التكلفة"});i.addEventListener("input",e=>fm.amount=Number(e.target.value));return i;})(),
          (()=>{const i=h("input",{type:"text",placeholder:"المقاول/الشركة"});i.addEventListener("input",e=>fm.contractor=e.target.value);return i;})()]);
        const dateInp=h("input",{type:"date",value:fm.date,style:{marginBottom:"8px"}});
        dateInp.addEventListener("input",e=>fm.date=e.target.value);
        const btns=h("div",{style:{display:"flex",gap:"8px"}},[
          h("button",{class:"btn",style:{flex:"1",background:"#fff",color:"#000",borderRadius:"8px",padding:"9px",fontSize:"13px",fontWeight:"700"},
            onClick:()=>{
              if(!fm.desc)return showMsg("أدخل وصف الصيانة");
              if(!(Number(fm.amount)>0))return showMsg("أدخل تكلفة صالحة");
              if(!isOwner){submitRequest("add_facility_maintenance","صيانة مرافق: "+fm.desc+" - "+Number(fm.amount).toLocaleString()+" د.إ",{maintenance:{...fm,id:"fm_"+Date.now()}}).then(ok=>{if(ok)set({showAddFacMaint:false});});return;}
              const _src=S.maintSrc||"revenue"; const _mid="fm_"+Date.now();
              commitMoneyOp({
                okMsg:"✓ سُجّلت الصيانة وخُصمت من حساب "+(_src==="company"?"الشركة":"الإيرادات"),
                mutate(ctx){
                  const a=ctx.deduct(_src, fm.amount);
                  ctx.data.facilityMaintenance=ctx.data.facilityMaintenance||[];
                  if(ctx.data.facilityMaintenance.some(x=>x.opId===_mid)) return;
                  ctx.data.facilityMaintenance.push({...fm,amount:a,id:_mid,opId:_mid,paidFrom:_src,
                                                     createdBy:S.user, createdByUid:S.uid||null,createdAt:new Date().toISOString()});
                  ctx.log((USERS[S.user]?.name||S.user)+" أضاف صيانة مرافق: "+fm.desc+" ("+a.toLocaleString()+" د.إ من "+ctx.ACC[_src]+")",
                          {target:"صيانة المرافق",field:"صيانة مباشرة",oldVal:"—",newVal:a+" د.إ"});
                }
              }).then(ok=>{ if(ok) set({showAddFacMaint:false}); });
            }},["حفظ"]),
          h("button",{class:"btn",style:{flex:"1",background:"#1a1a1a",border:"1px solid #2a2a2a",color:"#777",borderRadius:"8px",padding:"9px",fontSize:"13px"},
            onClick:()=>set({showAddFacMaint:false})},["إلغاء"])]);
        const srcRow=h("div",{style:{marginBottom:"8px"}},[
          h("div",{style:{fontSize:"12px",color:"#555",marginBottom:"4px"}},["يُخصم من:"]),
          h("div",{style:{display:"flex",gap:"6px"}},[
            h("button",{class:"btn",style:{flex:"1",padding:"8px",borderRadius:"8px",fontSize:"13px",fontWeight:"700",
              background:(S.maintSrc||"revenue")==="revenue"?"#a78bfa":"#1a1a1a",color:(S.maintSrc||"revenue")==="revenue"?"#000":"#555",
              border:(S.maintSrc||"revenue")==="revenue"?"none":"1px solid #2a2a2a"},
              onClick:()=>set({maintSrc:"revenue"})},["💜 الإيرادات | "+Number(S.revenueBalance||0).toLocaleString()]),
            h("button",{class:"btn",style:{flex:"1",padding:"8px",borderRadius:"8px",fontSize:"13px",fontWeight:"700",
              background:S.maintSrc==="company"?"#fff":"#1a1a1a",color:S.maintSrc==="company"?"#000":"#555",
              border:S.maintSrc==="company"?"none":"1px solid #2a2a2a"},
              onClick:()=>set({maintSrc:"company"})},["🏢 الشركة | "+Number(S.companyBalance||0).toLocaleString()])])]);
        return h("div",{},[facSel,descInp,row,dateInp,srcRow,btns]);
      })()]):null;

    const totalUnitMaintCost=unitMaint.reduce((s,m)=>s+m.amount,0);
    const totalFacMaintCost=facMaint.reduce((s,m)=>s+m.amount,0);

    // ===== تعديل/حذف الصيانة — ذرّي، بمصدر الدفع الأصلي =====
    const _maintSrcOf=(m)=> m.paidFrom || (S.maintFixSrc||{})[m.id] || null;
    const editMaintAmount=(listKey,m,newVal)=>{
      if(!canEdit()){showMsg("🔒 شهر مقفل");return;}
      const src=_maintSrcOf(m);
      if(!src){ set({maintNeedSrc:m.id}); showMsg("⚠ صيانة قديمة بلا حساب مسجّل — اختر الحساب أولاً"); return; }
      const newAmt=Math.round(Number(newVal)*100)/100;
      if(!isFinite(newAmt)||newAmt<=0){ showMsg("⚠ المبلغ غير صالح"); return; }
      const _cid="mtcorr_"+m.id+"_"+Date.now();
      commitMoneyOp({
        okMsg:"✓ عُكست التكلفة القديمة وسُجّلت المصحّحة",
        opType:"maintenance_correction", opId:_cid,
        sourceCollection:"months", sourceId:listKey+":"+m.id,
        reverseOf:listKey+":"+m.id,
        mutate(ctx){
          const it=(ctx.data[listKey]||[]).find(x=>String(x.id)===String(m.id));
          if(!it) throw new Error("ENTRY_MISSING");
          if(it.reversed) throw new Error("ALREADY_REVERSED");
          const oldAmt=Math.round(Number(it.amount||0)*100)/100;
          ctx.add(src,oldAmt,"عكس صيانة قبل التصحيح");
          ctx.deduct(src,newAmt,"الصيانة المصحّحة");
          it.reversed=true; it.reversedAt=new Date().toISOString();
          it.reversedBy=S.user; it.reverseReason="تصحيح التكلفة";
          ctx.data[listKey].push({...it, id:_cid, opId:_cid, amount:newAmt,
            reversed:false, reversedAt:null, reversedBy:null, reverseReason:null,
            correctedFrom:String(it.id), paidFrom:src,
            createdBy:S.user, createdByUid:S.uid||null, createdAt:new Date().toISOString()});
          ctx.log(userName(S.user)+" صحّح تكلفة صيانة: "+(it.desc||"صيانة")+" من "+oldAmt.toLocaleString()+" إلى "+newAmt.toLocaleString(),
                  {target:listKey==="unitMaintenance"?"صيانة الوحدات":"صيانة المرافق",field:"تصحيح التكلفة",oldVal:String(oldAmt),newVal:String(newAmt)});
        }
      });
    };
    const delMaint=(listKey,m)=>{
      if(!canEdit()){showMsg("🔒 شهر مقفل");return;}
      const src=_maintSrcOf(m);
      if(!src){ set({maintNeedSrc:m.id}); showMsg("⚠ صيانة قديمة بلا حساب مسجّل — اختر الحساب قبل الحذف"); return; }
      if(S.confirmDelMaint!==m.id){ set({confirmDelMaint:m.id}); showMsg("اضغط 🗑 مرة أخرى لعكس الصيانة وإرجاع المبلغ"); return; }
      S.confirmDelMaint=null;
      commitMoneyOp({
        okMsg:"✓ عُكست الصيانة وأُعيد المبلغ للحساب",
        opType:"maintenance_reverse", opId:"mtrev_"+m.id,
        sourceCollection:"months", sourceId:listKey+":"+m.id,
        reverseOf:listKey+":"+m.id,
        mutate(ctx){
          // ⛔ لا splice
          const it=(ctx.data[listKey]||[]).find(x=>String(x.id)===String(m.id));
          if(!it) throw new Error("ENTRY_MISSING");
          if(it.reversed) throw new Error("ALREADY_REVERSED");
          const amt=Math.round(Number(it.amount||0)*100)/100;
          if(amt>0) ctx.add(src,amt,"عكس صيانة");
          it.reversed=true; it.reversedAt=new Date().toISOString();
          it.reversedBy=S.user; it.reversedByUid=S.uid||null;
          it.reverseReason="حذف من الشاشة"; it.reversedAccount=src;
          ctx.log(userName(S.user)+" عكس صيانة: "+(it.desc||"صيانة")+" - "+amt.toLocaleString()+" د.إ (أُعيد إلى "+ctx.ACC[src]+")",
                  {target:listKey==="unitMaintenance"?"صيانة الوحدات":"صيانة المرافق",field:"عكس صيانة",oldVal:amt+" د.إ",newVal:"معكوس"});
        }
      });
    };
    const maintSrcPicker=(m)=>(S.maintNeedSrc===m.id)?h("div",{style:{marginTop:"8px",padding:"8px",borderRadius:"8px",background:"#1a1505",border:"1px solid #a16207"}},[
      h("div",{style:{fontSize:"11px",color:"#fbbf24",marginBottom:"5px"}},["صيانة مسجّلة قبل تتبّع الحساب — من أي حساب دُفعت؟"]),
      h("div",{style:{display:"flex",gap:"6px"}},[
        h("button",{class:"btn",style:{flex:"1",background:"#a78bfa",color:"#000",borderRadius:"6px",padding:"6px",fontSize:"11px",fontWeight:"700"},
          onClick:()=>{S.maintFixSrc=S.maintFixSrc||{};S.maintFixSrc[m.id]="revenue";set({maintNeedSrc:null});showMsg("✓ حُدِّد الحساب — أعد العملية");}},["💜 الإيرادات"]),
        h("button",{class:"btn",style:{flex:"1",background:"#fff",color:"#000",borderRadius:"6px",padding:"6px",fontSize:"11px",fontWeight:"700"},
          onClick:()=>{S.maintFixSrc=S.maintFixSrc||{};S.maintFixSrc[m.id]="company";set({maintNeedSrc:null});showMsg("✓ حُدِّد الحساب — أعد العملية");}},["🏢 الشركة"])])]):null;
    const maintRow=(listKey,m)=>h("div",{style:{marginTop:"8px",borderTop:"1px solid #1a1a1a",paddingTop:"8px"}},[
      h("div",{style:{fontSize:"11px",color:"#555",marginBottom:"5px"}},["💳 خُصم من: "+(m.paidFrom==="company"?"🏢 الشركة":m.paidFrom==="revenue"?"💜 الإيرادات":"— غير مسجّل (بيانات قديمة)")]),
      (isOwner&&canEdit())?h("div",{style:{display:"flex",gap:"6px",alignItems:"center"}},[
        (()=>{const inp=h("input",{type:"number",value:m.amount||0,style:{flex:"1",fontSize:"13px"}});
          inp.addEventListener("change",ev=>editMaintAmount(listKey,m,ev.target.value));return inp;})(),
        h("button",{class:"btn",style:{background:"#450a0a",border:"1px solid #7f1d1d",color:"#f87171",borderRadius:"6px",padding:"6px 10px",fontSize:"12px",fontWeight:"700"},
          onClick:()=>delMaint(listKey,m)},["🗑"])]):null,
      maintSrcPicker(m)]);

    const unitCard=(m,i)=>{
      const unit=units.find(u=>u.id===m.unitId)||{name:m.unitId};
      return h("div",{class:"card",style:{padding:"12px",marginBottom:"8px"}},[
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},[
          h("div",{},[
            h("div",{style:{fontSize:"11px",color:"#60a5fa",marginBottom:"2px"}},[unit.name||m.unitId]),
            h("div",{style:{fontSize:"13px",color:"#fff",fontWeight:"500"}},[m.desc]),
            h("div",{style:{fontSize:"11px",color:"#555",marginTop:"2px"}},[m.date+(m.contractor?" · "+m.contractor:"")])]),
          h("div",{style:{fontSize:"14px",fontWeight:"700",color:"#f87171",flexShrink:"0"}},[m.amount>0?m.amount.toLocaleString()+" د.إ":"—"])]),
        maintRow("unitMaintenance",m)]);
    };

    const facCard=(m,i)=>h("div",{class:"card",style:{padding:"12px",marginBottom:"8px"}},[
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},[
        h("div",{},[
          h("div",{style:{fontSize:"11px",color:"#a78bfa",marginBottom:"2px"}},[m.facility]),
          h("div",{style:{fontSize:"13px",color:"#fff",fontWeight:"500"}},[m.desc]),
          h("div",{style:{fontSize:"11px",color:"#555",marginTop:"2px"}},[m.date+(m.contractor?" · "+m.contractor:"")])]),
        h("div",{style:{fontSize:"14px",fontWeight:"700",color:"#f87171",flexShrink:"0"}},[m.amount>0?m.amount.toLocaleString()+" د.إ":"—"])]),
      maintRow("facilityMaintenance",m)]);
    content=h("div",{},[
      monthNav(),
      // Summary
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}},[
        h("div",{class:"card",style:{padding:"14px"}},[
          h("div",{style:{fontSize:"11px",color:"#555",marginBottom:"4px"}},["صيانة الشقق"]),
          h("div",{style:{fontSize:"20px",fontWeight:"900",color:"#f87171"}},[totalUnitMaintCost.toLocaleString()]),
          h("div",{style:{fontSize:"10px",color:"#444"}},["د.إ"])]),
        h("div",{class:"card",style:{padding:"14px"}},[
          h("div",{style:{fontSize:"11px",color:"#555",marginBottom:"4px"}},["صيانة المرافق"]),
          h("div",{style:{fontSize:"20px",fontWeight:"900",color:"#f87171"}},[totalFacMaintCost.toLocaleString()]),
          h("div",{style:{fontSize:"10px",color:"#444"}},["د.إ"])])]),

      // Unit maintenance section
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}},[
        h("div",{style:{fontSize:"13px",fontWeight:"700",color:"#60a5fa"}},["🔧 صيانة الشقق"]),
        h("button",{class:"btn",style:{background:"#111",border:"1px solid #2a2a2a",color:"#888",borderRadius:"8px",padding:"5px 12px",fontSize:"12px"},
          onClick:()=>set({showAddUnitMaint:true})},["+ إضافة"])]),
      unitMaintForm,
      unitMaint.length>0?h("div",{},unitMaint.map(unitCard)):
        h("div",{style:{textAlign:"center",padding:"16px",color:"#555",fontSize:"12px"}},["لا توجد صيانة شقق هذا الشهر"]),

      // Facility maintenance section
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"16px 0 10px"}},[
        h("div",{style:{fontSize:"13px",fontWeight:"700",color:"#a78bfa"}},["⚙️ صيانة المرافق العامة"]),
        h("button",{class:"btn",style:{background:"#111",border:"1px solid #2a2a2a",color:"#888",borderRadius:"8px",padding:"5px 12px",fontSize:"12px"},
          onClick:()=>set({showAddFacMaint:true})},["+ إضافة"])]),
      facMaintForm,
      facMaint.length>0?h("div",{},facMaint.map(facCard)):
        h("div",{style:{textAlign:"center",padding:"16px",color:"#555",fontSize:"12px"}},["لا توجد صيانة مرافق هذا الشهر"])]);
  }

  // Build global alert bar
  const allLate=units.flatMap(u=>u.partitions.filter(p=>displayStatus&&displayStatus(p)==="late"||(!displayStatus&&p.status==="late")).map(p=>u.name+"/"+p.id));
  const allVacant=units.flatMap(u=>u.partitions.filter(p=>p.status==="vacant").map(p=>u.name+"/"+p.id));
  const alertStrip=(allLate.length>0||allVacant.length>0)?h("div",{style:{
    background:"#0a0a0a",
    borderBottom:"1px solid #1a1a1a",
    padding:"8px 14px",
    overflowX:"auto",
    WebkitOverflowScrolling:"touch",
    display:"flex",
    gap:"6px",
    alignItems:"center",
    flexWrap:"nowrap",
    scrollbarWidth:"none"
  }},[
    ...allLate.map(i=>{
      const parts=i.split("/");
      const unitName=parts[0];
      const partId=parseInt(parts[1]);
      const unit=units.find(u=>u.name===unitName);
      return h("span",{class:"btn",style:{
        background:"#450a0a",border:"1px solid #7f1d1d",
        color:"#fca5a5",borderRadius:"6px",
        padding:"3px 9px",fontSize:"11px",fontWeight:"600",
        flexShrink:"0",whiteSpace:"nowrap",cursor:"pointer"
      },onClick:()=>{
        if(unit)set({tab:"units",selUnit:unit.id,editPart:unit.id+"-"+partId});
      }},["⚠ "+i]);
    }),
    ...allVacant.map(i=>{
      const parts=i.split("/");
      const unitName=parts[0];
      const partId=parseInt(parts[1]);
      const unit=units.find(u=>u.name===unitName);
      return h("span",{class:"btn",style:{
        background:"#1c1917",border:"1px solid #44403c",
        color:"#a8a29e",borderRadius:"6px",
        padding:"3px 9px",fontSize:"11px",
        flexShrink:"0",whiteSpace:"nowrap",cursor:"pointer"
      },onClick:()=>{
        if(unit)set({tab:"units",selUnit:unit.id,editPart:unit.id+"-"+partId});
      }},["○ "+i]);
    })
  ]):null;
  return h("div",{},[hdr,alertStrip,h("div",{style:{padding:"14px 14px 48px"}},[content])]);
}

function R(){
  const root=document.getElementById("root");
  root.innerHTML="";
  if(S.screen==="home")root.appendChild(renderHome());
  else if(S.screen==="pin")root.appendChild(renderPin());
  else root.appendChild(renderApp());
}


window.addEventListener("DOMContentLoaded",()=>{R();loadPinUsers();});
</script>
</body>
</html>
