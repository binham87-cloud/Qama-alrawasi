const AUTH_PASS_SUFFIX="-Qama#2026!Sec";
const PIN_LEN=4;

async function secureLogin(userKey,pin){
  const email=AUTH_EMAILS[userKey];
  if(!email)return{ok:false,err:"NO_EMAIL"};
  try{
    if(auth.currentUser&&auth.currentUser.email===email)return{ok:true};
    if(auth.currentUser&&auth.currentUser.email!==email){try{await signOut(auth);}catch(e){}}
    await signInWithEmailAndPassword(auth,email,pin+AUTH_PASS_SUFFIX);
    return{ok:true};
  }catch(e){
    return{ok:false,err:(e&&e.code)||String(e)};
  }
}

// بصمة محلية مشفّرة (SHA-256) تسمح بالدخول بدون إنترنت بعد أول دخول ناجح
async function pinHash(userKey,pin){
  const enc=new TextEncoder().encode("qama|"+userKey+"|"+pin+"|v1");
  const buf=await crypto.subtle.digest("SHA-256",enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

    // استخدم getDoc من module-level imports — بدون dynamic import
    const snap=await getDoc(doc(db,"config","locks"));
    if(snap.exists()){

      S.lockedMonths={};
      try{localStorage.setItem("qama_locks","{}");} catch(e){}
    }
  }catch(e){
    console.error("loadLocksFromServer error:",e);
  }
}
function isMonthLocked(y,m){return !!(S.lockedMonths&&S.lockedMonths[getMonthKey(y,m)]);}

async function submitRequest(type, desc, payload){
  if(!S.user)return;
  // منع الضغط المزدوج على الزر — set flag before any await
  if(S.submitting){showMsg("⏳ جاري الإرسال...");return;}
  S.submitting=true;
  try{
  if(USERS[S.user]?.role!=="owner" && isMonthLocked(S.year,S.month)){
    showMsg("🔒 الشهر مقفل — لا يمكن إرسال طلبات");return;
  }
  // Refresh before identity check so hard-refresh/relogin cannot double-create.
  try { if (typeof loadRequests === "function") await loadRequests(); } catch(_e) {}
  // منع تكرار الطلبات المعلقة
  const dupe=S.pendingRequests.find(r=>r.status==="pending"&&r.by===S.user&&r.type===type&&(
    (type==="update_partition"&&r.payload?.partId===payload?.partId&&r.payload?.unitId===payload?.unitId)||
    (type==="update_full"&&r.payload?.unitId===payload?.unitId)||
    // منع تكرار طلبات الإيداع بنفس المبلغ والتاريخ والوصف
    (type==="add_transaction"&&
      r.payload?.transaction?.amount===payload?.transaction?.amount&&
      r.payload?.transaction?.date===payload?.transaction?.date&&
      (r.payload?.transaction?.desc||r.desc)===(payload?.transaction?.desc||desc))||
    (type==="add_expense"&&
      Number(r.payload?.expense?.amount)===Number(payload?.expense?.amount)&&
      String(r.payload?.expense?.desc||"")===String(payload?.expense?.desc||""))
  ));
  if(dupe){showMsg("⏳ لديك طلب معلق بنفس البيانات بالفعل");return;}
  R(); // تعطيل الزر فوراً
  const req={
    id:"req_"+Date.now(),
    type, desc, payload,
    by:S.user,
    byName:USERS[S.user].name,
    month:S.month, year:S.year,
    status:"pending",
    createdAt:new Date().toISOString()
  };
  try{
    await setDoc(doc(db,"requests",req.id),req);
    // Keep request visible immediately in طلباتي (pending) before refresh settles.
    if(!Array.isArray(S.pendingRequests)) S.pendingRequests=[];
    if(!S.pendingRequests.some(r=>r&&r.id===req.id)) S.pendingRequests=[req,...S.pendingRequests];
    showMsg("تم إرسال الطلب — قيد الاعتماد");
  }catch(e){
    const msg=String((e&&(e.message||e.code))||e);
    if(/DUPLICATE_PENDING_REQUEST/i.test(msg)) showMsg("⏳ لديك طلب معلق بنفس البيانات بالفعل");
    else showMsg("⚠ تعذر إرسال الطلب");
  }
  await loadRequests();
  // After refresh, switch employee to myrequests so they see قيد الاعتماد.
  if(USERS[S.user]?.role==="emp" && (S.tab==="expenses"||S.tab==="transactions"||S.tab==="units")){
    try{ set({tab:"myrequests"}); }catch(_e){}
  }
  }finally{
    S.submitting=false;
    try{R();}catch(_e){}
  }
}

/** True if a request belongs to the signed-in user (handles by / byKey / mig:user ids). */
function isMyRequest(r){
  if(!r || !S.user) return false;
  const uid = (typeof NEW_UID!=="undefined" && NEW_UID[S.user]) || (S._actor && S._actor.userId) || null;
  const keys = new Set([S.user, uid, r.by, r.byKey, r.byUid].filter(Boolean).map(String));
  if(keys.has(String(S.user))) return true;
  if(uid && keys.has(String(uid))) return true;
  if(typeof UID_TO_KEY!=="undefined"){
    const mapped = UID_TO_KEY[String(r.by||"")] || UID_TO_KEY[String(r.byUid||"")];
    if(mapped && mapped===S.user) return true;
  }
  return String(r.by||"")===String(S.user) || String(r.byKey||"")===String(S.user) || String(r.byUid||"")===String(S.user);
}

function enrichDepositRequestFields(r, dash){
  if(!r) return r;
  const p = r.payload || {};
  const tx = p.transaction || {};
  const depId = p.depositId || tx.depositId || r.depositId || null;
  const deps = (dash && dash.deposits) || [];
  const dep = depId ? deps.find((d) => d && d.id === depId) : null;
  if(dep){
    r._sourceKind = dep.sourceKind || r._sourceKind || tx.sourceKind || "holding";
    r._sourceLabel = dep.sourceLabel || r._sourceLabel || null;
    r._depositDate = dep.depositDate || r._depositDate || tx.date || null;
    r._note = dep.note || r._note || tx.notes || tx.desc || null;
    r._reference = dep.reference || r._reference || null;
    r._accountName = dep.accountName || r._accountName || null;
    r._employeeName = dep.employeeName || r._employeeName || r.byName || null;
    r.amountFils = dep.amountFils != null ? dep.amountFils : r.amountFils;
    r._depositId = dep.id;
    r._depositState = dep.state;
    r._approvedAt = dep.approvedAt || r.approvedAt || r.resolvedAt || null;
    if(r.status === "pending" && (dep.state === "approved" || dep.state === "rejected")){
      // Engine decision landed before work-request status flip — keep history terminal.
      r.status = dep.state === "approved" ? "approved" : "rejected";
    }
  } else {
    r._sourceKind = r._sourceKind || tx.sourceKind || "holding";
    r._depositDate = r._depositDate || tx.date || null;
    r._depositId = depId;
    r._approvedAt = r.approvedAt || r.resolvedAt || null;
  }
  if(dash && dash.summary && r._sharedHoldingFils == null){
    r._sharedHoldingFils = dash.summary.sharedEmployeeHoldingFils ?? dash.summary.holdingFils ?? null;
  }
  return r;
}

async function loadRequests(){
  try{
    // Queue instead of drop — a submit that overlaps login refresh must not vanish.
    if (S._loadingRequests) { S._loadRequestsQueued = true; return; }
    S._loadingRequests = true;
    try {
      if (typeof refreshEngine === "function") await refreshEngine(S.year, S.month, true);
    } catch (e) { console.error(e); }
    const dash = S._dash;
    const reqs = (dash && dash.ui && dash.ui.requests) || [];
    // Canonical identity: one card per requestId; deposits also collapse by depositId.
    const byReqId = new Map();
    const byDepositId = new Map();
    for (const r of reqs) {
      if (!r || !r.id) continue;
      if (byReqId.has(r.id)) continue;
      const p = r.payload || {};
      const depId = p.depositId || (p.transaction && p.transaction.depositId) || r.depositId || null;
      if (depId && r.status === "pending" && byDepositId.has(depId)) continue;
      // Enrich deposit work requests — pending + terminal — so history never loses detail.
      if (r.type === "add_transaction") {
        if (r.status === "pending") {
          const match = (dash && dash.pendingApprovals || []).find((pa) =>
            pa.approveCommand === "approveDeposit" && (
              (pa.approvePayload && pa.approvePayload.depositId && (pa.approvePayload.depositId === depId || pa.approvePayload.depositId === pa.id))
              || pa.id === depId
            )
          );
          if (match) {
            r._sourceKind = match.sourceKind || (p.transaction && p.transaction.sourceKind) || "holding";
            r._sourceLabel = match.sourceLabel || null;
            r._depositDate = match.depositDate || (p.transaction && p.transaction.date) || null;
            r._note = match.note || null;
            r._reference = match.reference || null;
            r._accountName = match.accountName || null;
            r._employeeName = match.employeeName || r.byName || null;
            r._sharedHoldingFils = match.sharedHoldingFils ?? (dash && dash.summary && (dash.summary.sharedEmployeeHoldingFils ?? dash.summary.holdingFils)) ?? null;
            r.amountFils = match.amountFils != null ? match.amountFils : r.amountFils;
          }
        }
        enrichDepositRequestFields(r, dash);
      }
      byReqId.set(r.id, r);
      if (depId && r.status === "pending") byDepositId.set(depId, r.id);
      if (depId && (r.status === "approved" || r.status === "rejected")) byDepositId.set(depId, r.id);
    }
    // Orphan engine approvals (bank/deposit/expense) with NO linked work request.
    const linkedDep = new Set(byDepositId.keys());
    const linkedExp = new Set();
    for (const r of byReqId.values()) {
      const p = r.payload || {};
      const eid = p.expenseId || (p.expense && (p.expense._engineId || p.expense.expenseId));
      if (eid) linkedExp.add(eid);
    }
    const enginePending = (dash && dash.pendingApprovals || [])
      .filter((p) => {
        const id = p.id;
        const depId = (p.approvePayload && p.approvePayload.depositId) || id;
        const expId = (p.approvePayload && p.approvePayload.expenseId) || id;
        const recId = (p.approvePayload && p.approvePayload.receiptId) || id;
        if (p.approveCommand === "approveDeposit" && (linkedDep.has(depId) || linkedDep.has(id))) return false;
        if (p.approveCommand === "approveExpense" && (linkedExp.has(expId) || linkedExp.has(id))) return false;
        // Bank receipts created outside work-requests still need a Manager card.
        if (p.approveCommand === "approveBankReceipt") return true;
        if (p.approveCommand === "approveDeposit" || p.approveCommand === "approveExpense") return true;
        return false;
      })
      .map((p) => ({
        id: "eng:" + p.id,
        type: "engine_approval",
        desc: p.title,
        by: "engine",
        byName: p.employeeName || p.subtitle || "",
        month: S.month,
        year: S.year,
        status: "pending",
        createdAt: "",
        payload: {
          depositId: p.approvePayload?.depositId,
          expenseId: p.approvePayload?.expenseId,
          receiptId: p.approvePayload?.receiptId,
          amount: typeof p.amountFils === "number" ? (p.amountFils / 100) : null,
          sourceKind: p.sourceKind || null,
          sourceLabel: p.sourceLabel || null,
          depositDate: p.depositDate || null,
          note: p.note || null,
          reference: p.reference || null,
          accountName: p.accountName || null,
          employeeName: p.employeeName || null,
          sharedHoldingFils: p.sharedHoldingFils ?? null,
        },
        _approveCommand: p.approveCommand,
        _approvePayload: p.approvePayload,
        _rejectCommand: p.rejectCommand,
        _rejectPayload: p.rejectPayload,
        amountFils: p.amountFils,
        _canonicalId: p.id,
        _kind: p.kind || null,
        _sourceKind: p.sourceKind || null,
        _sourceLabel: p.sourceLabel || null,
        _depositDate: p.depositDate || null,
        _note: p.note || null,
        _reference: p.reference || null,
        _accountName: p.accountName || null,
        _employeeName: p.employeeName || null,
        _sharedHoldingFils: p.sharedHoldingFils ?? null,
      }));
    // Permanent bank history cards — approve/reject must not erase visible detail.
    // Display-only: linked by receipt ID; never creates a second financial effect.
    // Do not suppress bankhist just because a prior eng:<id> pending card existed —
    // after reject/approve the pending card is gone and history must remain.
    const pendingEngIds = new Set(enginePending.map((p) => p._canonicalId || (p.payload && p.payload.receiptId)).filter(Boolean));
    const terminalBank = ((dash && dash.deposits) || [])
      .filter((d) => d && d.fromBankReceipt === true && (d.state === "approved" || d.state === "rejected"))
      .filter((d) => !byReqId.has("bankhist:" + d.id))
      .filter((d) => !pendingEngIds.has(d.id) && !pendingEngIds.has(d.receiptId))
      .map((d) => ({
        id: "bankhist:" + d.id,
        type: "bank_history",
        desc: d.note || d.reference || "تحويل بنكي",
        by: (typeof UID_TO_KEY !== "undefined" && UID_TO_KEY[d.employeeId]) || d.employeeId || "engine",
        byKey: (typeof UID_TO_KEY !== "undefined" && UID_TO_KEY[d.employeeId]) || null,
        byUid: d.employeeId || null,
        byName: d.employeeName || "",
        month: S.month,
        year: S.year,
        status: d.state === "rejected" ? "rejected" : "approved",
        createdAt: d.depositDate || d.approvedAt || d.rejectedAt || "",
        approvedAt: d.state === "approved" ? (d.approvedAt || null) : null,
        rejectedAt: d.state === "rejected" ? (d.rejectedAt || null) : null,
        resolvedAt: d.approvedAt || d.rejectedAt || null,
        amountFils: d.amountFils,
        payload: {
          receiptId: d.receiptId || d.id,
          amount: typeof d.amountFils === "number" ? d.amountFils / 100 : null,
          sourceKind: "bank",
          sourceLabel: "تحويل بنكي",
          depositDate: d.depositDate,
          note: d.note,
          reference: d.reference,
          employeeName: d.employeeName,
        },
        _kind: "bank",
        _sourceKind: "bank",
        _sourceLabel: "تحويل بنكي",
        _depositDate: d.depositDate,
        _note: d.note,
        _reference: d.reference,
        _employeeName: d.employeeName,
        _receiptId: d.receiptId || d.id,
        _approvedAt: d.approvedAt || null,
      }));
    // bank_history first so Manager "السابقة" / employee "طلباتي" never lose rejected bank cards.
    S.pendingRequests = [...terminalBank, ...byReqId.values(), ...enginePending];
    S.notifCount = S.pendingRequests.filter((r) => r.status === "pending").length;
    R();
  }catch(e){console.error(e);}
  finally{
    S._loadingRequests=false;
    if(S._loadRequestsQueued){
      S._loadRequestsQueued=false;
      try{ await loadRequests(); }catch(_e){}
    }
  }
}

async function approveRequest(req){
  if(req&&req.type==="engine_approval"){
    if(S.approvingReqId){showMsg("⏳ جاري اعتماد طلب آخر...");return;}
    S.approvingReqId=req.id; R();
    try{
      await engineCommand(req._approveCommand,req._approvePayload,"engap-"+(req._canonicalId||req.id));
      showMsg("✓ تم اعتماد الطلب");
      await loadMonthOnline(S.year,S.month);
      await loadRequests();
    }catch(e){showMsg("⚠ خطأ في الاعتماد");console.error(e);}
    finally{S.approvingReqId=null;R();}
    return;
  }
  // FIX 4: منع الضغط المزدوج من نفس الجهاز
  if(S.approvingReqId){showMsg("⏳ جاري اعتماد طلب آخر...");return;}
  S.approvingReqId=req.id; R();
  try{
    // Deposit/expense: commitWorkRequest only — no local month mutate / double path.
    if(req&&(req.type==="add_transaction"||req.type==="add_expense")){
      await setDoc(doc(db,"requests",req.id),{...req,status:"approved",approvedAt:new Date().toISOString()});
      showMsg("✓ تم اعتماد الطلب");
      await loadRequests();
      await loadMonthOnline(S.year,S.month);
      R();
      return;
    }
    // ============================================================
    // حماية atomic من التكرار باستخدام Firebase runTransaction
    // runTransaction يضمن: اقرأ الطلب + تحقق status + اكتب processing
    // كل ذلك في عملية واحدة لا تقبل التنفيذ المتزامن من جهازين
    // ============================================================
    const {doc:fbDoc,getDoc:fbGetDoc,setDoc:fbSetDoc,serverTimestamp:fbSTS,runTransaction:fbRunTx}=
      await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
    const reqRef=fbDoc(db,"requests",req.id);
    let reqLive=null;
    try{
      await fbRunTx(db,async(tx)=>{
        const snap=await tx.get(reqRef);
        if(!snap.exists()) throw new Error("NOT_FOUND");
        const d=snap.data();
        if(d.status!=="pending") throw new Error("NOT_PENDING:"+d.status);
        // اكتب processing داخل نفس الـ transaction — atomic
        tx.update(reqRef,{status:"processing",processingAt:new Date().toISOString()});
        reqLive=d;
      });
    }catch(txErr){
      const msg=txErr.message||"";
      if(msg==="NOT_FOUND"){showMsg("⚠ الطلب غير موجود");return;}
      if(msg.startsWith("NOT_PENDING")){
        const st=msg.split(":")[1]||"";
        showMsg(st==="approved"?"✓ الطلب مُعتمد مسبقاً":"⏳ الطلب قيد المعالجة أو مرفوض");
        await loadRequests();R();return;
      }
      throw txErr; // خطأ غير متوقع
    }
    // بعد runTransaction نستخدم reqLive (النسخة الحقيقية من Firebase) وليس req (نسخة الواجهة)
    const R_=reqLive; // اختصار واضح — R_ هي المصدر الموثوق
    const data=getMonthData(R_.year,R_.month);
    if(R_.type==="update_partition"){
      const unit=data.units.find(u=>u.id===R_.payload.unitId);
      if(unit){const p=unit.partitions.find(p=>p.id===R_.payload.partId);if(p)Object.assign(p,R_.payload.fields);}
    } else if(R_.type==="update_full"){
      const u=data.full.find(u=>u.id===R_.payload.unitId);
      if(u)Object.assign(u,R_.payload.fields);
    } else if(R_.type==="add_expense"){
      // Engine commitWorkRequest creates the expense + Revenue debit. No local double write.
    } else if(R_.type==="add_transaction"){
      // Handled above via commitWorkRequest — keep branch for safety no-op
    } else if(R_.type==="add_unit"){
      data.units.push(R_.payload.unit);
      registerCustomUnit(R_.payload.unit,false,R_.year,R_.month);
      propagateNewUnit(R_.payload.unit,R_.year,R_.month);
    } else if(R_.type==="add_full_unit"){
      data.full.push(R_.payload.unit);
      registerCustomUnit(R_.payload.unit,true,R_.year,R_.month);
      propagateNewFullUnit(R_.payload.unit,R_.year,R_.month);
    } else if(R_.type==="delete_partition"){
      const unit=data.units.find(u=>u.id===R_.payload.unitId);
      if(unit){const pi=unit.partitions.findIndex(p=>p.id===R_.payload.partId);if(pi>-1)unit.partitions.splice(pi,1);}
    } else if(R_.type==="delete_full"){
      const fi=data.full.findIndex(u=>u.id===R_.payload.unitId);
      if(fi>-1)data.full.splice(fi,1);
      try{removeCustomUnit(R_.payload.unitId,true,R_.year,R_.month);}catch(e){}
      try{propagateRemoveUnit(R_.payload.unitId,true,R_.year,R_.month);}catch(e){}
    }
    if(R_.type==="add_daily"){
      if(!data.dailyBookings)data.dailyBookings=[];
      data.dailyBookings.push({...R_.payload.booking,id:R_.id});
    } else if(R_.type==="add_unit_maintenance"){
      if(!data.unitMaintenance)data.unitMaintenance=[];
      data.unitMaintenance.push({...R_.payload.maintenance,id:R_.id});
      // Revenue debit comes from linked engine expense — do not bump client balance.
    } else if(R_.type==="add_facility_maintenance"){
      if(!data.facilityMaintenance)data.facilityMaintenance=[];
      data.facilityMaintenance.push({...R_.payload.maintenance,id:R_.id});
    }
    // Audit Log
    try{
      const RTL={update_partition:"تعديل بارتشن",update_full:"تعديل شقة",add_transaction:"إيداع",add_expense:"مصروف",add_unit_maintenance:"صيانة شقة",add_facility_maintenance:"صيانة مرافق",add_daily:"حجز يومي",delete_partition:"حذف بارتشن",delete_full:"حذف شقة"};
      addLog&&addLog(data,(USERS[S.user]?.name||S.user)+" اعتمد طلب "+(RTL[R_.type]||R_.type)+" من "+(USERS[R_.by]?.name||R_.by||"موظف"),{target:R_.desc||(RTL[R_.type]||R_.type),field:"اعتماد",oldVal:"معلّق",newVal:"معتمد"});
    }catch(e){}
    // كتابة واحدة لـ Firebase للشهر
    const monthKey=getMonthKey(R_.year,R_.month);
    const finalData=normalizeData(data);
    try{localStorage.setItem("qama_month_"+monthKey,JSON.stringify(finalData));}catch(e){}
    await fbSetDoc(fbDoc(db,"months",monthKey),{data:finalData,updatedAt:fbSTS()},{merge:true});
    // approved — يحوّل status من processing إلى approved
    await fbSetDoc(fbDoc(db,"requests",R_.id),{...R_,status:"approved",approvedAt:new Date().toISOString()});
    showMsg("✓ تم اعتماد الطلب");
    await loadRequests();
    await loadMonthOnline(R_.year,R_.month);
    if(R_.year!==S.year||R_.month!==S.month) await loadMonthOnline(S.year,S.month);
    await loadBalances();
    R();
  }catch(e){
    showMsg("⚠ خطأ في الاعتماد — راجع السجل");
    console.error(e);
  }finally{
    // FIX 4: نُعيد تفعيل الزر دائماً سواء نجح أو فشل
    S.approvingReqId=null; R();
  }
}

async function rejectRequest(req){
  // Bank/deposit/expense engine cards must use canonical reject* — never resolveWorkRequest via setDoc.
  if(req&&req.type==="engine_approval"){
    try{
      if(!req._rejectCommand){showMsg("⚠ لا يمكن رفض هذا الطلب");return;}
      const payload=Object.assign({},req._rejectPayload||{},{reason:"رفض من الشاشة"});
      await engineCommand(req._rejectCommand,payload,"engrej-"+(req._canonicalId||req.id)+"-"+Date.now());
      showMsg("✓ تم رفض الطلب");
      await loadMonthOnline(S.year,S.month);
      await loadRequests();
    }catch(e){showMsg("⚠ خطأ");console.error(e);}
    return;
  }
  try{
    await setDoc(doc(db,"requests",req.id),{...req,status:"rejected",rejectedAt:new Date().toISOString()});
    showMsg("✓ تم رفض الطلب");
    await loadRequests();
  }catch(e){showMsg("⚠ خطأ");}
}

function propagateNewUnit(unit, fromYear, fromMonth){
  // Add unit to all future months that exist in localStorage
  let m=fromMonth+1, y=fromYear;
  for(let i=0;i<12;i++){
    if(m>11){m=0;y++;}
    const k=getMonthKey(y,m);
    const existing=localStorage.getItem("qama_month_"+k);
    if(existing){
      try{
        const d=JSON.parse(existing);
        if(!d.units.find(u=>u.id===unit.id)){
          const freshUnit=JSON.parse(JSON.stringify(unit));
          freshUnit.partitions=freshUnit.partitions.map(p=>({...p,status:"vacant",tenant:"",note:"فارغ",partial:false,paid_amount:0}));
          d.units.push(freshUnit);
          localStorage.setItem("qama_month_"+k,JSON.stringify(d));
        }
      }catch(e){}
    }
    m++;
  }
}

function propagateRemoveUnit(unitId, isFull, fromYear, fromMonth){
  // Remove from current + future months that exist in localStorage
  let m=fromMonth, y=fromYear;
  for(let i=0;i<13;i++){
    const k=getMonthKey(y,m);
    const existing=localStorage.getItem("qama_month_"+k);
    if(existing){
      try{
        const d=JSON.parse(existing);
        if(isFull){
          const ix=d.full.findIndex(u=>u.id===unitId);
          if(ix>-1)d.full.splice(ix,1);
        } else {
          const ix=d.units.findIndex(u=>u.id===unitId);
          if(ix>-1)d.units.splice(ix,1);
        }
        localStorage.setItem("qama_month_"+k,JSON.stringify(d));
      }catch(e){}
    }
    m++;if(m>11){m=0;y++;}
  }
}

function propagateNewFullUnit(unit, fromYear, fromMonth){
  let m=fromMonth+1, y=fromYear;
  for(let i=0;i<12;i++){
    if(m>11){m=0;y++;}
    const k=getMonthKey(y,m);
    const existing=localStorage.getItem("qama_month_"+k);
    if(existing){
      try{
        const d=JSON.parse(existing);
        if(!d.full.find(u=>u.id===unit.id)){
          d.full.push(initFull({...unit}));
          localStorage.setItem("qama_month_"+k,JSON.stringify(d));
        }
      }catch(e){}
    }
    m++;
  }
}

async function loadBalances(){
  try{
    const {getDocFromServer}=await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
    const snap=await getDocFromServer(doc(db,"config","balances")).catch(()=>getDoc(doc(db,"config","balances")));
    if(snap.exists()){
      const d=snap.data();
      if(d.companyBalance!=null&&!S.showEditCompany)S.companyBalance=d.companyBalance;
      if(d.revenueBalance!=null&&!S.showEditRevenue)S.revenueBalance=d.revenueBalance;
      if(d.installmentBalance!=null)S.installmentBalance=d.installmentBalance;
      S.installmentSchedule=ensureInstallmentSchedule(d.installmentSchedule);
      R();
    }
  }catch(e){}
}

function loadPermissions(){
  try{
    const p=localStorage.getItem("qama_permissions");
    if(p)S.permissions=JSON.parse(p);
  }catch(e){}
  // Also fetch from Firebase to get latest permissions set by owner
  try{
    getDoc(doc(db,"config","permissions")).then(snap=>{
      if(snap.exists()){
        const data=snap.data().data||snap.data();
        if(data&&typeof data==="object"){
          S.permissions=data;
          localStorage.setItem("qama_permissions",JSON.stringify(data));
          R();
        }
      }
    }).catch(()=>{});
  }catch(e){}
}

function paidValue(x){
  const rent=Number(x?.rent||0), paid=Number(x?.paid_amount||0);
  const enginePaid=Number(x?._enginePaid||0);
  if(x?.status==="staff"||x?.status==="vacant")return 0;
  // Unconfirmed collect/partial draft must not enter collected KPIs.
  // If engine money already exists and a draft increase sits on top, show confirmed only.
  if(x?._collectDraft){
    if(!(enginePaid>0)) return 0;
    return Math.max(0,Math.min(enginePaid,rent||enginePaid));
  }
  if(x?.partial)return Math.max(0,Math.min(paid,rent||paid));
  if(x?.status==="collected")return paid>0?paid:rent;
  return 0;
}
function remainingValue(x){return Math.max(0,Number(x?.rent||0)-paidValue(x));}
function isPartialPaid(x){
  // Draft-only partial (no recognized engine money) is form state, not confirmed partial.
  if(x?._collectDraft && !(Number(x?._enginePaid||0)>0)) return false;
  return !!x?.partial && (Number(x?.rent||0)>0 || Number(x?.paid_amount||0)>0) && remainingValue(x)>0;
}
function moneyText(n){return Number(n||0).toLocaleString();}

/**
 * Canonical money for UI cards. Prefer engine periodSummary (S._dash.summary).
 * Display-only bank history / pending / rejected / reversed never contribute.
 * Fallback sums only financially effective custody deposit rows (approved, not display-only).
 */
function financiallyEffectiveTxAed(t){
  if(!t) return 0;
  if(t._displayOnly || t._fromBankReceipt || t.sourceKind==="bank") return 0;
  const st=String(t._state||"");
  if(st==="pending"||st==="rejected"||st==="reversed") return 0;
  if(st && st!=="approved" && st!=="recognized") return 0;
  return Number(t.amount)||0;
}
function engineSummary(){
  return (typeof S!=="undefined" && S._dash && S._dash.summary) ? S._dash.summary : null;
}
function canonicalIncomeAed(eng, txList){
  if(eng){
    if(eng.incomeFils!=null) return (Number(eng.incomeFils)||0)/100;
    return (Number(eng.companyCollectedFils ?? eng.depositedFils)||0)/100;
  }
  return (txList||[]).reduce((s,t)=>s+financiallyEffectiveTxAed(t),0);
}
function canonicalExpensesAed(eng, expList){
  if(eng && eng.expensesFils!=null) return (Number(eng.expensesFils)||0)/100;
  return (expList||[])
    .filter((e)=>e && e._state!=="pending" && e._state!=="rejected" && e._state!=="reversed")
    .reduce((s,e)=>s+Number(e.amount||0),0);
}
function canonicalCollectedAed(eng, fallbackAed){
  if(eng) return (Number(eng.collectedFils ?? eng.tenantPaidFils)||0)/100;
  return Number(fallbackAed)||0;
}
function canonicalDepositedAed(eng, txList){
  if(eng) return (Number(eng.companyCollectedFils ?? eng.depositedFils)||0)/100;
  return (txList||[]).reduce((s,t)=>s+financiallyEffectiveTxAed(t),0);
}
function todayISO(){return new Date().toISOString().slice(0,10);}
function addMonthsISO(dateStr, months=1){
  if(!dateStr)return "";
  const d=new Date(dateStr+"T00:00:00");
  if(isNaN(d))return "";
  const day=d.getDate();
  d.setMonth(d.getMonth()+months);
  if(d.getDate()<day)d.setDate(0);
  return d.toISOString().slice(0,10);
}
function isDatePast(dateStr){
  if(!dateStr)return false;
  return dateStr < todayISO();
}
function rentType(x){
  return x?.rent_type || x?.rentType || (x?.note==="يومي" ? "daily" : "monthly");
}
function rentTypeText(x){return rentType(x)==="daily"?"يومي":"شهري";}
function dueDateOf(x){
  if(rentType(x)==="daily")return x?.end_date || "";
  // Definitive rule: first due date = contract start; recurring = same day-of-month.
  // Never fall back to start+1 month.
  if(x?.due_date) return x.due_date;
  return x?.start_date || "";
}
function dateInfoText(x){
  if(rentType(x)==="daily"){
    if(x?.start_date||x?.end_date)return "يومي: "+(x.start_date||"—")+" إلى "+(x.end_date||"—");
    return "إيجار يومي";
  }
  const due=dueDateOf(x);
  if(x?.start_date||due)return "شهري: من "+(x.start_date||"—")+" · الاستحقاق "+(due||"—");
  return "إيجار شهري";
}

function calculateDueDate(startDate){
  // Contract start IS the first due date (same calendar day).
  if(!startDate) return null;
  return String(startDate).slice(0,10);
}

function displayStatus(x){
  // Confirmed «محصّل» only when money is recognized — draft collect stays unpaid look on cards.
  if(x?._collectDraft && !(Number(x?._enginePaid||0)>0) && (x?.status==="collected" || !x?.status)){
    if(isPartialPaid(x)) return "partial";
    const due=dueDateOf(x);
    if(due && !isDatePast(due)) return "pending";
    return "late";
  }
  const st=x?.status || "late";
  if(isPartialPaid(x))return "partial";
  if(st==="collected"||st==="vacant"||st==="staff")return st;
  if(st==="late")return "late";
  const due=dueDateOf(x);
  if(due && !isDatePast(due))return "pending";
  return "late";
}

function cloneInstallmentSchedule(src){

    date:String(x.date||""),
    amount:Number(x.amount)||0,
    paid:!!x.paid
  }));

function ensureInstallmentSchedule(fromServer){
  if(Array.isArray(fromServer) && fromServer.length>0){
    return cloneInstallmentSchedule(fromServer);
  }
  // Never wipe a local schedule that already has paid flags with an empty server array.
  if(Array.isArray(S.installmentSchedule) && S.installmentSchedule.length>0){
    return S.installmentSchedule;
  }
  return cloneInstallmentSchedule(DEFAULT_INSTALLMENT_SCHEDULE);
}

/** If server schedule is empty, persist the UI defaults so payInstallment can find rows. */
async function ensureInstallmentScheduleOnServer(){
  const sched=ensureInstallmentSchedule(S.installmentSchedule);
  S.installmentSchedule=sched;
  let serverSched=[];
  try{
    const dash=S._dash || await refreshEngine(S.year,S.month,true);
    const b=(dash && dash.ui && dash.ui.config && dash.ui.config.balances) || {};
    const obj=b.data || b || {};
    serverSched=Array.isArray(obj.installmentSchedule)?obj.installmentSchedule:[];
    if(obj.installmentBalance!=null) S.installmentBalance=Number(obj.installmentBalance);
  }catch(_e){}
  if(serverSched.length>0){
    S.installmentSchedule=cloneInstallmentSchedule(serverSched);
    return S.installmentSchedule;
  }
  await setDoc(doc(db,"config","balances"),{
    companyBalance:S.companyBalance,
    revenueBalance:S.revenueBalance,
    installmentBalance:S.installmentBalance,
    installmentSchedule:sched,
    updatedAt:serverTimestamp()
  },{merge:true});
  return sched;
}

/** Client-side intent check before owner save / employee submit — never wipe form. */
function validateRentCollectIntent(item, opts){
  opts=opts||{};
  clearFieldErrors();
  const renting=item && item.status!=="vacant" && item.status!=="staff";
  const collecting=!!(item && (item.status==="collected" || item.partial || item._collectDraft) && item.collectionMethod);
  if(renting || collecting || opts.requireTenant){
    if(!tenantNameOk(item&&item.tenant)){
      setFieldError(opts.tenantTestId||"partition-tenant","اسم المستأجر مطلوب");
      return false;
    }
  }
  if(renting && !(Number(item.rent)>0) && opts.requireRent!==false){
    // Allow draft mid-edit with rent 0 only when not collecting.
    if(collecting){
      setFieldError(opts.rentTestId||"partition-rent","قيمة الإيجار مطلوبة");
      return false;
    }
  }
  if(item && item.partial && collecting){
    const paid=Number(item.paid_amount||0);
    const rem=Math.max(0, Number(item.rent||0)-Number(item._enginePaid||0));
    if(!(paid>0)){
      setFieldError(opts.paidTestId||"partition-paid-amount","مبلغ الدفع الجزئي مطلوب وأكبر من صفر");
      return false;
    }
    if(rem>0 && paid>rem+0.001){
      setFieldError(opts.paidTestId||"partition-paid-amount","المبلغ يتجاوز المتبقي ("+rem.toLocaleString()+" د.إ)");
      return false;
    }
  }
  return true;
}

function requireTenantBeforeRent(item,actionLabel){
  if(tenantNameOk(item && item.tenant)) return true;
  setFieldError("partition-tenant","أدخل اسم المستأجر قبل "+(actionLabel||"التأجير أو التحصيل")+" — الإيجار يبقى مسودة");
  return false;
}

function registerCustomUnit(unit,isFull,fromYear,fromMonth){
  const cu=getCustomUnits();
  const entry={...unit,_fromY:fromYear,_fromM:fromMonth,_removedY:null,_removedM:null};
  if(isFull){
    if(!cu.full.find(u=>u.id===unit.id))cu.full.push(entry);
  } else {

}

// Mark a custom unit as removed from a specific month onwards
function removeCustomUnit(unitId,isFull,fromYear,fromMonth){
  const cu=getCustomUnits();
  const list=isFull?cu.full:cu.units;
  const entry=list.find(u=>u.id===unitId);
  if(entry){
    entry._removedY=fromYear;
    entry._removedM=fromMonth;
    try{localStorage.setItem("qama_custom_units",JSON.stringify(cu));}catch(e){}
    try{setDoc(doc(db,"config","customUnits"),{data:cu,updatedAt:serverTimestamp()},{merge:true});}catch(e){}
  }
}

async function archiveEngineUnit(unitId){

  }catch(e){
    const c=String((e&&(e.message||e.code))||e);
    if(!/UNIT_NOT_FOUND|UNIT_HAS_ACTIVE_RENTAL/.test(c)) console.error(e);
    if(/UNIT_HAS_ACTIVE_RENTAL/.test(c)) throw e;
  }
}

// Check if a custom unit should appear in a given month
function customUnitActiveIn(entry,y,m){
  const monthVal=y*12+m;
  const fromVal=(entry._fromY!=null)?entry._fromY*12+entry._fromM:0;
  if(monthVal<fromVal)return false; // before it was added
  if(entry._removedY!=null){
    const remVal=entry._removedY*12+entry._removedM;
    if(monthVal>=remVal)return false; // removed from this month onwards
  }
  return true;
}

function createZeroMonthData(y,m){
  const data = {
    monthInitMode:"zero-v2",
    units: JSON.parse(JSON.stringify(BASE_UNITS)).map(u=>({
      ...u,
      partitions:u.partitions.map(p=>({
        ...p,
        status: initialPartitionStatus(p),
        tenant:p.tenant||"",
        note:initialPartitionNote(p),
        rent_type:(p.note==="يومي"?"daily":"monthly"),
        start_date:"",
        end_date:"",
        due_date:"",
        partial:false,
        paid_amount:0
      }))
    })),
    full: JSON.parse(JSON.stringify(BASE_FULL)).map(u=>initFull(u)),
    expenses:[],
    transactions:[],
    profits:[],
    installments:[],
    logs:[]
  };
  // Merge custom units (only in months >= when added, and before removal)
  const cu=getCustomUnits();
  cu.units.forEach(u=>{
    if(customUnitActiveIn(u,y,m) && !data.units.find(x=>x.id===u.id)){
      const fresh=JSON.parse(JSON.stringify(u));
      delete fresh._fromY;delete fresh._fromM;delete fresh._removedY;delete fresh._removedM;
      fresh.partitions=fresh.partitions.map(p=>({...p,status:"vacant",tenant:"",note:"فارغ",partial:false,paid_amount:0,start_date:"",end_date:"",due_date:""}));
      data.units.push(fresh);
    }
  });
  cu.full.forEach(u=>{
    if(customUnitActiveIn(u,y,m) && !data.full.find(x=>x.id===u.id)){
      const clean={...u};
      delete clean._fromY;delete clean._fromM;delete clean._removedY;delete clean._removedM;
      data.full.push(initFull(clean));
    }
  });
  if(isAprilMonth(y,m))return applyAprilImportedRevenue(data,false);
  return data;
}

function getMonthData(y,m){
  const k=getMonthKey(y,m);

    const d=localStorage.getItem("qama_month_"+k);

      // Ensure custom units are reflected
      if(typeof mergeCustomUnits==="function"){
        const changed=mergeCustomUnits(data,y,m);
        if(changed)localStorage.setItem("qama_month_"+k,JSON.stringify(data));
      }
      return data;
    }
  }catch(e){}
  return createZeroMonthData(y,m);
}

function isOldAutoFilledMonth(data){
  if(!data || data.monthInitMode==="zero-v2")return false;
  const hasOps=(data.expenses&&data.expenses.length)||(data.transactions&&data.transactions.length)||(data.profits&&data.profits.length)||(data.installments&&data.installments.length)||(data.logs&&data.logs.length);
  if(hasOps)return false;
  const parts=(data.units||[]).flatMap(u=>u.partitions||[]);
  const full=data.full||[];
  const collectedParts=parts.filter(p=>p.status==="collected").length;
  const collectedFull=full.filter(u=>u.status==="collected").length;
  const vacantParts=parts.filter(p=>p.status==="vacant").length;
  // أي شهر قديم تم إنشاؤه آلياً قبل قاعدة "لا شواغر إلا بتعديل"، نعيد إنشاءه من الصفر
  return collectedParts+collectedFull+vacantParts>0 || data.monthInitMode!=="zero-v2";
}

function normalizeData(data){
  data.units=data.units||[];
  data.units.forEach(u=>{
    u.partitions=(u.partitions||[]).map(p=>{
      if(!p.rent_type)p.rent_type=rentType(p);
      if(p.start_date===undefined)p.start_date="";
      if(p.end_date===undefined)p.end_date="";
      if(p.due_date===undefined)p.due_date=p.start_date||"";
      return p;
    });
  });
  data.full=(data.full||[]).map(f=>{
    if(f.start_date===undefined)f.start_date="";
    if(f.due_date===undefined)f.due_date=f.start_date||"";
    return f;
  });
  data.expenses=data.expenses||[];
  data.transactions=data.transactions||[];
  data.profits=data.profits||[];
  data.installments=data.installments||[];
  data.logs=data.logs||[];
  return data;
}

function addLog(data, text, details){
  if(!S.user || !data)return;
  data.logs=data.logs||[];
  const entry={id:Date.now()+Math.random(),user:S.user,name:USERS[S.user]?.name||S.user,text,at:new Date().toISOString()};
  // details = {target, field, oldVal, newVal} for structured audit
  if(details){
    if(details.target!=null)entry.target=details.target;
    if(details.field!=null)entry.field=details.field;
    if(details.oldVal!=null)entry.oldVal=String(details.oldVal);
    if(details.newVal!=null)entry.newVal=String(details.newVal);
  }
  data.logs.unshift(entry);
  data.logs=data.logs.slice(0,200);
}

function timeAgo(iso){
  try{
    const d=new Date(iso), diff=Math.floor((Date.now()-d.getTime())/1000);
    if(diff<60)return "الآن";
    if(diff<3600)return Math.floor(diff/60)+" دقيقة";
    if(diff<86400)return Math.floor(diff/3600)+" ساعة";
    return d.toLocaleDateString("ar-AE");
  }catch(e){return "";}
}

function mergeCustomUnits(data, y, m){
  // Ensure all active custom units exist in this month's data (and removed ones are gone)
  const cu=getCustomUnits();
  let changed=false;
  // Add active custom partition-units
  cu.units.forEach(u=>{
    const active=customUnitActiveIn(u,y,m);
    const existing=data.units.find(x=>x.id===u.id);
    if(active && !existing){
      const fresh=JSON.parse(JSON.stringify(u));
      delete fresh._fromY;delete fresh._fromM;delete fresh._removedY;delete fresh._removedM;
      fresh.partitions=(fresh.partitions||[]).map(p=>({...p,status:"vacant",tenant:"",note:"فارغ",partial:false,paid_amount:0,start_date:"",end_date:"",due_date:""}));
      data.units.push(fresh);changed=true;
    } else if(!active && existing){
      data.units=data.units.filter(x=>x.id!==u.id);changed=true;
    }
  });
  // Add active custom full-units
  cu.full.forEach(u=>{
    const active=customUnitActiveIn(u,y,m);
    const existing=data.full.find(x=>x.id===u.id);
    if(active && !existing){
      const fresh=JSON.parse(JSON.stringify(u));
      delete fresh._fromY;delete fresh._fromM;delete fresh._removedY;delete fresh._removedM;
      data.full.push(initFull(fresh));changed=true;
    } else if(!active && existing){
      data.full=data.full.filter(x=>x.id!==u.id);changed=true;
    }
  });
  return changed;
}

async function loadMonthOnline(y,m){
  const k=getMonthKey(y,m);
  const hasLocal=!!localStorage.getItem("qama_month_"+k);
  S.syncMsg="جاري المزامنة...";
  if(!hasLocal){S.loading=true;}
  R();
  try{
    const snap=await getDoc(doc(db,"months",k));
    if(snap.exists()){
      let data=normalizeData(snap.data().data||snap.data());
      if(isAprilMonth(y,m) && data.aprilSeedVersion!=="april-revenue-numbers-v1"){
        data=applyAprilImportedRevenue(data,true);
        await setDoc(doc(db,"months",k),{data,updatedAt:serverTimestamp()},{merge:true});
        S.syncMsg="تم تحميل إيرادات أبريل";
      }else if(isOldAutoFilledMonth(data)){
        data=createZeroMonthData(y,m);
        await setDoc(doc(db,"months",k),{data,updatedAt:serverTimestamp()},{merge:true});
        S.syncMsg=isAprilMonth(y,m)?"تم تحميل إيرادات أبريل":"بدأ الشهر من الصفر";
      }else{
        // Merge any custom units added later
        const merged=mergeCustomUnits(data,y,m);
        if(merged){
          await setDoc(doc(db,"months",k),{data,updatedAt:serverTimestamp()},{merge:true});
        }
        localStorage.setItem("qama_month_"+k,JSON.stringify(data));
        S.syncMsg="متصل";
      }
      // localStorage already set in each branch above
    }else{
      const data=normalizeData(createZeroMonthData(y,m));
      await setDoc(doc(db,"months",k),{data,updatedAt:serverTimestamp()},{merge:true});
      localStorage.setItem("qama_month_"+k,JSON.stringify(data));
      S.syncMsg=isAprilMonth(y,m)?"تم إنشاء أبريل مع الإيرادات":"تم إنشاء شهر جديد من الصفر";
    }
  }catch(e){
    console.error(e);
    S.syncMsg="تعذر الاتصال - حفظ محلي";
  }
  S.loading=false;
  R();
}

function saveMonthData(y,m,data,quiet=false){

async function verifyAndEnter(userKey,pin){
  let ok=false, offline=false;
  const res=await secureLogin(userKey,pin);
  if(res.ok){
    ok=true;
    try{localStorage.setItem("qama_ph_"+userKey,await pinHash(userKey,pin));}catch(e){}
  }else if(res.err==="auth/network-request-failed"){
    // لا إنترنت: تحقق من البصمة المشفّرة المحفوظة من آخر دخول ناجح
    try{
      const saved=localStorage.getItem("qama_ph_"+userKey);
      if(saved&&saved===await pinHash(userKey,pin)){ok=true;offline=true;}
      else if(!saved){S.pinMsg="لا اتصال — الدخول الأول يتطلب إنترنت";}
    }catch(e){}
  }else if(res.err==="auth/too-many-requests"){
    S.pinMsg="محاولات كثيرة — انتظر دقيقة ثم حاول";
  }
  S.pinBusy=false;
  // إذا رجع المستخدم للخلف أثناء التحقق لا تكمل الدخول
  if(S.screen!=="pin"||S.pendingUser!==userKey){S.pinMsg="";S.pin="";R();return;}
  if(!ok){
    S.pin="";S.pinErr=true;R();
    setTimeout(()=>{S.pinErr=false;S.pinMsg="";R();},1400);
    return;
  }
  S.pinMsg="";
  S.screen="app";S.user=userKey;S.pin="";S.pinErr=false;
  S.tab=USERS[userKey].role==="owner"?"overview":"units";
  S.selUnit=null;S.editPart=null;
  if(offline)S.syncMsg="وضع محلي — لا اتصال";
  loadPermissions();
  loadLocksFromServer().then(()=>R()); // عند الدخول من Firebase + إعادة رسم
  loadRequests();
  loadCustomUnits();
  R();
  loadMonthOnline(S.year,S.month);
  loadBalances().then(()=>R());
}

function pinPress(d){
  if(S.pinBusy)return;
  if(S.pinErr){S.pin="";S.pinErr=false;S.pinMsg="";}
  const n=S.pin+d;
  if(n.length===PIN_LEN){
    S.pin=n;S.pinBusy=true;R();
    verifyAndEnter(S.pendingUser,n);
  } else set({pin:n});
}

// ========== DOM HELPER ==========
function h(tag,a,c){
  const e=document.createElement(tag);
  if(a)for(const[k,v]of Object.entries(a)){
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="class")e.className=v;
    else e.setAttribute(k,v);
  }
  for(const x of(c||[])){
    if(x==null||x===false)continue;
    e.appendChild(typeof x==="string"||typeof x==="number"?document.createTextNode(String(x)):x);
  }
  return e;
}

            }
            startInp.addEventListener("change",e=>{eb.startDate=e.target.value;recalc();});
            endInp.addEventListener("change",e=>{eb.endDate=e.target.value;recalc();});
            rateInp.addEventListener("input",e=>{eb.nightRate=e.target.value;recalc();});
            totalInp.addEventListener("input",e=>eb.total=e.target.value);
            const save=h("button",{"data-testid":"daily-edit-save",class:"btn",style:{flex:"1",background:"#4ade80",color:"#000",borderRadius:"8px",padding:"8px",fontSize:"14px",fontWeight:"700"},onClick:()=>{
              if(!eb.startDate||!eb.endDate)return showMsg("أدخل التواريخ");
              if(!eb.total||Number(eb.total)<=0)return showMsg("أدخل المبلغ");
              Object.assign(b,{guest:eb.guest||"—",startDate:eb.startDate,endDate:eb.endDate,nights:eb.nights||0,nightRate:Number(eb.nightRate)||0,total:Number(eb.total)});
              addLog&&addLog(data,nm+" عدّل حجز يومي: "+(b.partLabel||b.partId));
              saveCurData(data);set({editingDaily:null});showMsg("✓ تم تعديل الحجز");
            }},["✓ حفظ التعديل"]);
            const cancel=h("button",{"data-testid":"daily-edit-cancel",class:"btn",style:{flex:"1",background:"#1a1a1a",border:"1px solid #2a2a2a",color:"#888",borderRadius:"8px",padding:"8px",fontSize:"14px"},onClick:()=>set({editingDaily:null})},["إلغاء"]);
            wrap.appendChild(guestInp);wrap.appendChild(startInp);wrap.appendChild(endInp);wrap.appendChild(rateInp);wrap.appendChild(totalInp);wrap.appendChild(nightsLbl);
            wrap.appendChild(h("div",{style:{display:"flex",gap:"8px"}},[save,cancel]));
            return wrap;
          })():null;
          return h("div",{"data-testid":"daily-booking-card","data-booking-id":String(b.id),class:"card",style:{padding:"14px",marginBottom:"10px",border:"1px solid "+(isActive?"#16a34a":isFuture?"#3b82f6":"#2a2a2a")}},[
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}},[
              h("div",{},[
                h("div",{style:{fontSize:"15px",fontWeight:"700",color:"#fff"}},[b.partLabel]),
                h("div",{"data-testid":"daily-card-guest",style:{fontSize:"13px",color:"#888",marginTop:"2px"}},["النزيل: "+b.guest])]),
              h("span",{style:{background:isActive?"#052e16":isFuture?"#1e3a5f":"#1a1a1a",color:isActive?"#4ade80":isFuture?"#60a5fa":"#888",borderRadius:"6px",padding:"3px 9px",fontSize:"12px",fontWeight:"600"}},[isActive?"🟢 حالياً":isFuture?"🔵 قادم":"انتهى"])]),
            h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"13px",color:"#aaa",marginBottom:"8px"}},[
              h("span",{"data-testid":"daily-card-dates"},["📅 "+b.startDate+" ← "+b.endDate]),
              h("span",{},[b.nights>0?b.nights+" ليلة":""])]),
            (()=>{
              const pay=b.paymentStatus||"unpaid";
              const payLbl=pay==="collected"?"محصّل / لم يودع":pay==="deposited"?"مودع":"غير محصّل";
              const payColor=pay==="collected"?"#fbbf24":pay==="deposited"?"#4ade80":"#f87171";
              return h("div",{"data-testid":"daily-pay-status",style:{fontSize:"12px",color:payColor,marginBottom:"8px",fontWeight:"600"}},[payLbl]);
            })(),
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:"8px",borderTop:"1px solid #1a1a1a",flexWrap:"wrap",gap:"6px"}},[
              h("div",{"data-testid":"daily-card-total",style:{fontSize:"17px",fontWeight:"800",color:"#4ade80"}},[Number(b.total).toLocaleString()+" د.إ"]),
              h("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap"}},[
                (canEdit()&&(b.paymentStatus||"unpaid")==="unpaid")?h("button",{"data-testid":"daily-collect-cash",class:"btn",style:{fontSize:"13px",color:"#000",background:"#4ade80",borderRadius:"6px",padding:"5px 10px",fontWeight:"700"},
                  onClick:async()=>{
                    if(S._payingDaily){showMsg("جاري الحفظ...");return;}
                    if(!confirm("تحصيل نقدي لهذا الحجز؟\nسيزيد المحصّل والعهدة بمبلغ "+Number(b.total).toLocaleString()+" د.إ"))return;
                    S._payingDaily=true;R();
                    try{
                      const period=typeof periodOfMonth==="function"?periodOfMonth(S.year,S.month):(S.year+"-"+String(S.month+1).padStart(2,"0"));
                      const fils=Math.round(Number(b.total)*100);
                      const r=await engineCommand("createDailyCashReceipt",{
                        bookingId:String(b.id),
                        amountFils:fils,
                        collectionDate:(typeof engineToday==="function"?engineToday():new Date().toISOString().slice(0,10)),
                        period,
                        note:String(b.guest||"حجز يومي").slice(0,300),
                        collectorUserId:S.user
                      },("dailypay-"+b.id+"-"+fils).slice(0,120));
                      b.paymentStatus="collected";
                      b.receiptId=r&&r.receiptId;
                      await saveCurData(data,false);
                      showMsg("تم الحفظ — محصّل / لم يودع");
                    }catch(e){
                      showMsg("⚠ "+(typeof formatEngineError==="function"?formatEngineError(e):(e&&e.message||e)));
                    }finally{S._payingDaily=false;R();}
                  }},["تحصيل نقداً"]):null,
                isOwner?h("button",{"data-testid":"daily-edit",class:"btn",style:{fontSize:"13px",color:"#93c5fd",background:"#0c1a2e",border:"1px solid #1e3a5f",borderRadius:"6px",padding:"5px 10px"},
                  onClick:()=>set({editingDaily:isEditing?null:b.id,showAddDaily:false})},[isEditing?"إغلاق":"تعديل"]):null,
                isOwner?h("button",{"data-testid":"daily-delete",class:"btn",style:{fontSize:"13px",color:"#f87171",background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"6px",padding:"5px 10px"},
                  onClick:async()=>{
                    if(!confirm("حذف هذا الحجز اليومي؟"))return;
                    data.dailyBookings=data.dailyBookings.filter(x=>x.id!==b.id);
                    try{await saveCurData(data,false);showMsg("تم الحفظ");}catch(e){showMsg("⚠ "+(e&&e.message||e));}
                    set({editingDaily:null});
                  }},["حذف"]):null])]),
            editForm]);
        }))]);
  }

  // ======= AUDIT LOG TAB =======
  if(S.tab==="audit"){
    const logs=(data.logs||[]);
    content=h("div",{},[
      monthNav(),
      h("div",{class:"card",style:{padding:"16px",marginBottom:"12px"}},[
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}},[
          h("div",{style:{fontSize:"15px",fontWeight:"700",color:"#fff"}},["📋 سجل التعديلات"]),
          h("div",{style:{fontSize:"13px",color:"#555"}},[logs.length+" عملية"])]),
        h("div",{style:{fontSize:"12px",color:"#555"}},["كل تعديل: من، متى، القيمة القديمة والجديدة"])]),
      logs.length===0?h("div",{style:{padding:"30px",textAlign:"center",color:"#555",fontSize:"15px"}},["لا توجد تعديلات مسجّلة هذا الشهر"]):
        h("div",{},logs.map(L=>{
          const d=new Date(L.at);
          const dateStr=d.toLocaleDateString("ar",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});
          return h("div",{class:"card",style:{padding:"12px",marginBottom:"8px",borderRight:"3px solid #3b82f6"}},[
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}},[
              h("div",{style:{fontSize:"14px",fontWeight:"700",color:"#60a5fa"}},[L.name||L.user]),
              h("div",{style:{fontSize:"11px",color:"#555"}},[dateStr])]),
            L.target?h("div",{style:{fontSize:"13px",color:"#aaa",marginBottom:"3px"}},[L.target]):null,
            (L.field&&(L.oldVal!=null||L.newVal!=null))?h("div",{style:{display:"flex",alignItems:"center",gap:"8px",fontSize:"14px",marginTop:"4px"}},[
              h("span",{style:{color:"#888"}},[L.field+":"]),
              h("span",{style:{color:"#f87171",textDecoration:"line-through"}},[L.oldVal||"—"]),
              h("span",{style:{color:"#555"}},["←"]),
              h("span",{style:{color:"#4ade80",fontWeight:"700"}},[L.newVal||"—"])]):
              h("div",{style:{fontSize:"14px",color:"#ccc"}},[L.text||""])]);
        }))]);
  }

  // ======= OCCUPANCY TAB =======
  if(S.tab==="occupancy"){
    const totalParts=units.reduce((s,u)=>s+u.partitions.length,0);
    const occupiedParts=units.reduce((s,u)=>s+u.partitions.filter(p=>p.status!=="vacant").length,0);
    const occupancyPct=totalParts>0?Math.round(occupiedParts/totalParts*100):0;
    const fullOccupied=full.filter(u=>u.status==="collected"||u.status!=="vacant").length;
    const fullTotal=full.length;
    const fullPct=fullTotal>0?Math.round(fullOccupied/fullTotal*100):0;

    // Color based on %
    const pctColor=occupancyPct>=90?"#4ade80":occupancyPct>=70?"#facc15":"#f87171";

    content=h("div",{},[
      monthNav(),
      // Main occupancy card
      h("div",{class:"card",style:{padding:"20px",marginBottom:"12px",textAlign:"center"}},[
        h("div",{style:{fontSize:"12px",color:"#555",marginBottom:"8px"}},["نسبة إشغال البارتشنات"]),
        h("div",{style:{fontSize:"56px",fontWeight:"900",color:pctColor,lineHeight:"1"}},[occupancyPct+"%"]),
        h("div",{style:{fontSize:"13px",color:"#777",marginTop:"8px"}},[occupiedParts+" من "+totalParts+" بارتشن مشغول"]),
        h("div",{style:{background:"#1a1a1a",borderRadius:"6px",height:"10px",overflow:"hidden",margin:"14px 0 0"}},[
          h("div",{style:{height:"100%",width:occupancyPct+"%",background:`linear-gradient(90deg,${pctColor}88,${pctColor})`,borderRadius:"6px",transition:"width 0.5s"}})])]),

      // Full units occupancy
      h("div",{class:"card",style:{padding:"14px",marginBottom:"12px"}},[
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}},[
          h("div",{style:{fontSize:"13px",color:"#888"}},["الشقق الكاملة"]),
          h("div",{style:{fontSize:"18px",fontWeight:"900",color:fullPct>=90?"#4ade80":fullPct>=70?"#facc15":"#f87171"}},[fullPct+"%"])]),
        h("div",{style:{background:"#1a1a1a",borderRadius:"4px",height:"6px",overflow:"hidden"}},[
          h("div",{style:{height:"100%",width:fullPct+"%",background:"linear-gradient(90deg,#60a5fa88,#60a5fa)",borderRadius:"4px"}})])]),

      // Per unit breakdown
      h("div",{class:"card",style:{overflow:"hidden"}},[
        h("div",{style:{padding:"10px 14px",borderBottom:"1px solid #1a1a1a",fontSize:"12px",fontWeight:"600",color:"#666"}},["تفصيل لكل شقة"]),
        ...units.map((u,i)=>{
          const tot=u.partitions.length;
          const occ=u.partitions.filter(p=>p.status!=="vacant").length;
          const pct=Math.round(occ/tot*100);
          const col=pct>=90?"#4ade80":pct>=70?"#facc15":"#f87171";
          return h("div",{style:{padding:"10px 14px",borderBottom:i<units.length-1?"1px solid #161616":"none",display:"flex",justifyContent:"space-between",alignItems:"center"}},[
            h("div",{},[
              h("div",{style:{fontSize:"13px",color:"#fff",fontWeight:"500"}},[u.name]),
              h("div",{style:{fontSize:"11px",color:"#555",marginTop:"2px"}},[occ+"/"+tot+" بارتشن"])]),
            h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},[
              h("div",{style:{background:"#1a1a1a",borderRadius:"3px",height:"5px",width:"80px",overflow:"hidden"}},[
                h("div",{style:{height:"100%",width:pct+"%",background:col,borderRadius:"3px"}})]),
              h("span",{style:{fontSize:"13px",fontWeight:"700",color:col,width:"36px",textAlign:"left"}},[pct+"%"])])]);})])]);
  }

  // ======= MAINTENANCE TAB (merged into expenses) =======
  // Kept as no-op: S.tab==="maintenance" is remapped to "expenses" above.

  // Build global alert bar
  const allLate=units.flatMap(u=>u.partitions.filter(p=>displayStatus&&displayStatus(p)==="late"||(!displayStatus&&p.status==="late")).map(p=>u.name+"/"+p.id));
  const allVacant=units.flatMap(u=>u.partitions.filter(p=>p.status==="vacant").map(p=>u.name+"/"+p.id));
  const alertStrip=(allLate.length>0||allVacant.length>0)?h("div",{style:{
    background:"#0a0a0a",
    borderBottom:"1px solid #1a1a1a",
    padding:"8px 14px",
    overflowX:"auto",
    WebkitOverflowScrolling:"touch",
    display:"flex",
    gap:"6px",
    alignItems:"center",
    flexWrap:"nowrap",
    scrollbarWidth:"none"
  }},[
    ...allLate.map(i=>{
      const parts=i.split("/");
      const unitName=parts[0];
      const partId=parseInt(parts[1]);
      const unit=units.find(u=>u.name===unitName);
      return h("span",{class:"btn",style:{
        background:"#450a0a",border:"1px solid #7f1d1d",
        color:"#fca5a5",borderRadius:"6px",
        padding:"3px 9px",fontSize:"11px",fontWeight:"600",
        flexShrink:"0",whiteSpace:"nowrap",cursor:"pointer"
      },onClick:()=>{
        if(unit)set({tab:"units",selUnit:unit.id,editPart:unit.id+"-"+partId});
      }},["⚠ "+i]);
    }),
    ...allVacant.map(i=>{
      const parts=i.split("/");
      const unitName=parts[0];
      const partId=parseInt(parts[1]);
      const unit=units.find(u=>u.name===unitName);
      return h("span",{class:"btn",style:{
        background:"#1c1917",border:"1px solid #44403c",
        color:"#a8a29e",borderRadius:"6px",
        padding:"3px 9px",fontSize:"11px",
        flexShrink:"0",whiteSpace:"nowrap",cursor:"pointer"
      },onClick:()=>{
        if(unit)set({tab:"units",selUnit:unit.id,editPart:unit.id+"-"+partId});
      }},["○ "+i]);
    })
  ]):null;
  return h("div",{},[hdr,alertStrip,h("div",{style:{padding:"14px 14px 48px"}},[content])]);
}

function R(){
  const root=document.getElementById("root");
  root.innerHTML="";
  if(S.screen==="home")root.appendChild(renderHome());
  else if(S.screen==="pin")root.appendChild(renderPin());
  else root.appendChild(renderApp());
}


window.addEventListener("DOMContentLoaded",R);
</script>
</body>
</html>
